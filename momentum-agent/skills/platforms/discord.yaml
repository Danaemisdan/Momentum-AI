    - "IF (Discord_channel_post_fails) THEN (retry_post_or_send_direct_message_to_channel_owner)."
  
  - name: "AssessAlgorithmicBiasInContentRecommendation"
  trigger_roles:
    - "AI Ethics & Societal Impact Navigator"
    - "Ethical AI & Algorithmic Bias Auditor"
  strategy:
    - "Analyze content recommendation logs for patterns of disproportionate exposure or suppression of specific user demographics or content categories."
    - "Conduct A/B tests with modified recommendation algorithms to measure impact on diversity and fairness metrics."
    - "Generate a report detailing identified biases and proposing algorithmic adjustments."
  reference_patterns:
