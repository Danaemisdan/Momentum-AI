    - "New bot command deployed to a 'beta-testers' role."
    - "New channel type enabled for a small percentage of users."
    - "Spike in error logs or negative feedback during a feature rollout."
    - "Positive engagement metrics (e.g., usage rate) for a newly released feature."
  decision_logic:
