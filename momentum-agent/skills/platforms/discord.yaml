  - name: "incident_artifact_reconstruction"
  trigger_roles:
    - "Forensic Artifact Synthesizer & Incident Attribution Engine"
  strategy:
    - "Monitor Discord audit logs and message history for anomalous activities or reported incidents."
    - "Correlate disparate data points (deleted messages, user joins/leaves, role changes, file uploads) to reconstruct an event timeline."
    - "Generate a concise report detailing the incident, involved parties, and potential attribution."
  reference_patterns:
    - "Rapid succession of user joins/leaves."
