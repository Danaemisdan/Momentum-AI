    - "Detect policy violations (e.g., hate speech, harassment) with minimal latency."
    - "Trigger immediate, localized moderation actions or escalate to human moderators based on severity."
  reference_patterns:
    - "Spikes in reported voice chat abuse."
    - "High concurrent user counts in specific voice channels."
    - "Deployment of new voice chat features or events."
    - "Performance degradation in voice chat due to unmoderated disruptive behavior."
  decision_logic:
    - "IF audio_sentiment_score < -0.8 AND keyword_match_hate_speech_list THEN action: 'temporary_mute_user_in_channel_and_log_incident'"
    - "IF audio_volume_spike_duration > 5s AND keyword_match_screaming_abuse THEN action: 'kick_user_from_voice_channel_and_notify_moderator'"
    - "IF multiple_users_report_voice_abuse_in_channel_X_within_30s THEN action: 'activate_enhanced_audio_monitoring_for_channel_X_and_alert_human'"
    - "IF edge_AI_model_confidence_low_for_specific_audio_type THEN action: 'route_audio_segment_to_central_AI_for_re-evaluation'"
  actions:
