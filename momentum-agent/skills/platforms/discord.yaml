  - name: "NormalizeCrossServerEventMetadata"
  trigger_roles:
    - "Trans-Dimensional Data Ingestion & Semantic Normalizer"
  strategy:
    - "Identify newly created or updated event objects across all monitored Discord servers."
    - "Extract and standardize event metadata (e.g., time, date, description, location, associated channels, user mentions) into a unified schema, resolving discrepancies in free-text fields."
    - "Generate a canonical, normalized event representation for downstream consumption, flagging potential duplicates or conflicts."
  reference_patterns:
    - "Server logs indicating new 'CREATE_EVENT' or 'UPDATE_EVENT' API calls."
    - "Discord audit logs showing event modifications."
    - "User messages containing keywords like 'event', 'meetup', 'gathering' followed by date/time indicators."
  decision_logic:
    - "IF event.server_id IS NOT NULL AND event.status == 'scheduled' THEN BEGIN normalization_process."
    - "IF event.description CONTAINS 'http' AND event.description NOT CONTAINS 'discord.com' THEN EXTRACT external_link."
    - "IF event.start_time IS AMBIGUOUS (e.g., 'tomorrow 7pm') THEN ATTEMPT_TO_RESOLVE_WITH_SERVER_TIMEZONE ELSE FLAG_FOR_REVIEW."
  actions:
    - "API.GET('/guilds/{guild_id}/scheduled-events')"
    - "API.POST('/internal/data_lake/normalized_events', payload=normalized_event_object)"
    - "API.POST('/internal/alerts', payload='Semantic conflict detected in event {event_id}')"
  verification:
    - "Confirm normalized_event_object.schema_version matches latest."
    - "Verify no data loss from original event fields to normalized fields."
    - "Check for successful ingestion into data lake via API response code 200."
  recovery:
    - "IF normalization_process FAILS THEN LOG_ERROR_AND_REQUEUE_EVENT_ID_FOR_REPROCESSING_AFTER_10_MINUTES."
    - "IF semantic_conflict_flagged THEN NOTIFY_HUMAN_OPERATOR_WITH_CONFLICT_DETAILS_AND_ORIGINAL_DATA."
  
