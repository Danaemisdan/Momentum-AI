    - "Interact with cloud provider APIs (AWS, GCP, Azure) to provision VMs, containers, load balancers, and network rules."
    - "Deploy Docker images/Kubernetes manifests to target clusters in various regions."
    - "Configure DNS and load balancer rules for phased traffic shifting."
    - "Monitor real-time performance metrics (latency, error rates, resource utilization) from deployed services."
    - "Execute automated rollback procedures if health checks fail."
