    - "IF (A/B_test_shows_significant_negative_impact_on_fairness_metric) THEN (revert_algorithm_change_and_investigate)."
    - "IF (multiple_user_reports_allege_bias_in_recommendations) THEN (trigger_targeted_audit_of_relevant_algorithm_components)."
  actions:
