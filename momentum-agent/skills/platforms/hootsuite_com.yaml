      - If the user is interested in job opportunities, then click 'Careers'.
      - If the user wants to learn about the team, then click 'Leadership'.
      - If the user wants to see client testimonials, then click 'Customers'.
      - If the user wants company news, then click 'Newsroom'.
      - If the user is interested in social responsibility, then click 'Social impact and DEI'.
      - If the user wants more general company details, then click 'More about us'.
    actions:
