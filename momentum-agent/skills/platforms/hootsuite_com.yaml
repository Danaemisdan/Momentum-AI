  - name: "generate_post_performance_causality_report"
    trigger_roles:
      - "Explainable AI & Interpretability Architect"
    strategy:
      - "Select a high-performing and a low-performing social media post published via Hootsuite."
      - "Analyze various metadata and engagement metrics to identify the causal factors contributing to their respective performance."
      - "Generate an interpretable report explaining *why* each post performed as it did, using Hootsuite's analytics data."
    reference_patterns:
      - "Deep dive into 'Analytics' -> 'Posts' and 'Performance' metrics."
