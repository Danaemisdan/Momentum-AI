intents:

- name: Navigate Platform Sections
    strategy:
      - Identify primary navigation elements.
      - Select the desired section to explore.
      - Utilize direct links to return to the homepage if needed.
    reference_patterns:
      - The user accesses primary navigation elements like 'Products', 'Integrations', 'Industries', 'Resources', 'Pricing', or 'Enterprise' to explore different areas of the platform.
      - Direct links such as 'homepage' or 'Hootsuite homepage' are used to return to the main landing page.
    decision_logic:
      - If the user wants to explore a specific platform area, then click the corresponding navigation element.
      - If the user wants to return to the main page, then click 'homepage' or 'Hootsuite homepage'.
    actions:
      - Click 'Products'
      - Click 'Integrations'
      - Click 'Industries'
      - Click 'Resources'
      - Click 'Pricing'
      - Click 'Enterprise'
      - Click 'homepage'
      - Click 'Hootsuite homepage'
    verification:
      - Verify that the URL or page content reflects the selected section.
    recovery:
      - If navigation fails, try clicking the element again.
  - name: Initiate Product Engagement
    strategy:
      - Determine if the user is new or existing.
      - Guide new users to trial or demo options.
      - Guide existing users to the login page.
    reference_patterns:
      - The user expresses interest in the product by selecting 'Start your free trial' or 'Request a demo'.
      - Existing users utilize the 'Log in' option to access their accounts.
    decision_logic:
      - If the user wants to try the product, then click 'Start your free trial'.
      - If the user wants a personalized demonstration, then click 'Request a demo'.
      - If the user is an existing customer, then click 'Log in'.
    actions:
      - Click 'Start your free trial'
      - Click 'Request a demo'
      - Click 'Log in'
    verification:
      - Verify that the trial/demo form or login page is displayed.
    recovery:
      - If the page doesn't load, refresh and try clicking again.
  - name: Understand Hootsuite's Value Proposition
    strategy:
      - Identify specific value propositions.
      - Provide options to learn more about each proposition.
    reference_patterns:
      - The user investigates specific solution-oriented statements like 'Safeguard your brand’s reputation', 'Prove your social media ROI', 'Go to market with confidence', or 'Streamline your social workflow'.
      - Further details are sought by clicking 'Learn more' associated with a value proposition.
    decision_logic:
      - If the user is interested in a specific value proposition, then click the associated 'Learn more' button.
    actions:
      - Click 'Learn more' (associated with 'Safeguard your brand’s reputation')
      - Click 'Learn more' (associated with 'Prove your social media ROI')
      - Click 'Learn more' (associated with 'Go to market with confidence')
      - Click 'Learn more' (associated with 'Streamline your social workflow')
    verification:
      - Verify that the detailed information page for the value proposition is displayed.
    recovery:
      - If the link is broken, try navigating to the main solutions page.
  - name: Access Educational and Support Content
    strategy:
      - Identify the type of content the user is seeking (educational, support, updates).
      - Direct the user to the appropriate resource.
    reference_patterns:
      - The user seeks knowledge through 'Case studies', 'Read the report', 'Read now →', 'Academy', 'Blog', 'Resource library', or 'Webinars'.
      - Assistance is requested via 'Need help?' or 'Contact us'.
      - Users stay informed by checking 'Product updates'.
    decision_logic:
      - If the user wants educational content, then click 'Case studies', 'Academy', 'Blog', 'Resource library', or 'Webinars'.
      - If the user wants to read a report, then click 'Read the report' or 'Read now →'.
      - If the user needs help, then click 'Need help?' or 'Contact us'.
      - If the user wants product news, then click 'Product updates'.
    actions:
      - Click 'Case studies'
      - Click 'Read the report'
      - Click 'Read now →'
      - Click 'Academy'
      - Click 'Blog'
      - Click 'Resource library'
      - Click 'Webinars'
      - Click 'Need help?'
      - Click 'Contact us'
      - Click 'Product updates'
    verification:
      - Verify that the relevant content page or support portal is loaded.
    recovery:
      - If the page doesn't load, check for alternative links or the main support page.
  - name: Explore Company Information
    strategy:
      - Identify the specific aspect of company information the user is interested in.
      - Navigate to the corresponding company information page.
    reference_patterns:
      - The user delves into 'Why Hootsuite', 'About us', 'Careers', 'Leadership', 'Customers', 'Newsroom', or 'Social impact and DEI' to learn about the organization.
      - Additional company details are found through 'More about us'.
    decision_logic:
