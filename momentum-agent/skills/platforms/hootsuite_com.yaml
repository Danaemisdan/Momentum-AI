      - "Explanations are directly supported by Hootsuite's available data points."
      - "The report is understandable to a non-technical audience."
    recovery:
      - "IF causal links are unclear THEN broaden the scope of analyzed variables or consult additional data points."
      - "IF the report is too technical THEN simplify the language and focus on key takeaways."

