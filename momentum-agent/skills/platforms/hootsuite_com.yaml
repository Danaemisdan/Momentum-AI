    decision_logic:
      - "IF a post significantly overperforms/underperforms expectations THEN prioritize for causality analysis."
      - "IF multiple variables correlate with performance THEN use statistical methods (simulated) to isolate causal factors."
      - "IF explanation is complex THEN simplify language and use visual aids for clarity."
    actions:
      - "Navigate to 'Analytics' -> 'Posts'."
      - "Filter posts by 'Performance' (e.g., highest engagement, lowest reach) to identify two contrasting examples."
      - "Click on each selected post to view its detailed metrics (e.g., impressions, clicks, comments, shares, sentiment)."
      - "Examine associated metadata: publishing time, targeted audience, social network, attached media, hashtags, keywords."
      - "Compare and contrast these factors between the high-performing and low-performing posts."
      - "Create a new 'Custom Report' in Analytics, adding text boxes to explain the identified causal links (e.g., 'High engagement due to trending hashtag and emotionally resonant image,' 'Low reach attributed to off-peak publishing time and generic call-to-action')."
