intents:

- name: Check and Correct Text
    strategy:
      - Identify the primary text input area for content to be checked.
      - Locate and activate the 'Correct' or 'Check' function.
      - Optionally, select a specific language if the default is not desired.
    reference_patterns:
      - The user inputs text into the primary text area, then initiates the 'Correct' function.
      - A user might select a specific language from the language dropdown before applying the 'Correct' action.
      - Uploading a document for checking involves utilizing the 'Check Word Document' button.
    decision_logic:
      - IF text is present in the input area AND 'Correct' button is visible, THEN proceed with correction.
      - IF a specific language is selected, THEN ensure the correction is applied with that language.
      - IF a document upload is initiated, THEN use the 'Check Word Document' functionality.
    actions:
      - Fill text into the main text area.
      - Click the 'Correct' or 'Check' button.
      - (Optional) Click the language dropdown and select a specific language.
      - (Optional) Click the 'Check Word Document' button and upload a file.
    verification:
      - Observe if suggestions or corrections appear in the text area.
      - Confirm that the status indicates the text has been checked.
    recovery:
      - If no corrections appear, re-click the 'Correct' button.
      - If an error occurs, clear the text and re-enter, then try again.
  - name: Paraphrase Content
    strategy:
      - Identify the text input area for content to be paraphrased.
      - Locate and activate the 'Paraphrase' function.
      - Alternatively, navigate to the dedicated paraphrasing tool page.
    reference_patterns:
      - The user provides text and then engages the 'Paraphrase' button to generate alternative phrasing.
      - Accessing the dedicated 'Paraphrasing Tool' page allows for focused text rephrasing.
    decision_logic:
      - IF text is present in the input area AND 'Paraphrase' button is visible, THEN proceed with paraphrasing.
      - IF the user navigates to the 'Paraphrasing Tool' page, THEN use the input and paraphrase functions there.
    actions:
      - Fill text into the main text area or paraphrasing tool input.
      - Click the 'Paraphrase' button.
      - (Alternative) Navigate to the 'Paraphrasing Tool' page.
    verification:
      - Observe if alternative phrasing or paraphrased text is generated.
      - Confirm that the output is different from the original input.
    recovery:
      - If no paraphrased text appears, re-click the 'Paraphrase' button.
      - If an error occurs, try re-entering the text and paraphrasing again.
  - name: Explore Premium Features
    strategy:
      - Locate links or buttons related to 'Premium' or 'Upgrade'.
      - Navigate to the premium features section to view benefits.
      - Identify options to learn more about upgrading.
    reference_patterns:
      - Navigating to the 'Premium' section or clicking 'Discover Premium' reveals subscription benefits.
      - A user might click 'Unlock all Premium Features' to learn more about upgrading.
    decision_logic:
      - IF 'Premium' or 'Discover Premium' link is visible, THEN click to explore.
      - IF 'Unlock all Premium Features' button is visible, THEN click to learn more.
    actions:
      - Click on 'Premium' or 'Discover Premium' link.
      - Click on 'Unlock all Premium Features' button.
    verification:
      - Confirm that the page displays information about premium features and benefits.
      - Verify that pricing or subscription options are presented.
    recovery:
      - If the page does not load correctly, try clicking the link again.
      - If no premium information is found, try searching for "premium" on the site.
  - name: Integrate LanguageTool with other Applications
    strategy:
      - Locate sections or links related to 'Add-ons', 'Plugins', or 'Integrations'.
      - Identify specific platform links for installation.
      - Navigate to the relevant integration page.
    reference_patterns:
      - The user explores 'Browser Add-ons' or 'Office Plugins' to find compatible integrations.
      - Direct links for specific platforms like 'Add to Chrome' or 'macOS App for Microsoft Word' facilitate installation.
    decision_logic:
      - IF 'Browser Add-ons' or 'Office Plugins' links are visible, THEN explore them.
      - IF direct platform links like 'Add to Chrome' are visible, THEN click to initiate installation.
    actions:
      - Click on 'Browser Add-ons' or 'Office Plugins'.
      - Click on specific platform links like 'Add to Chrome' or 'macOS App for Microsoft Word'.
    verification:
      - Confirm that the page displays a list of available integrations.
      - Verify that clicking a direct link leads to an installation prompt or store page.
    recovery:
      - If the integration page is not found, try navigating back and selecting a different integration link.
      - If a direct link fails, try searching for the add-on/plugin manually in the respective store.
  - name: Manage User Account
    strategy:
      - Locate 'Sign up' for new account creation.
      - Locate 'Log in' for existing user access.
      - Navigate to the respective account management pages.
    reference_patterns:
      - New users will utilize the 'Sign up' option to create an account.
      - Existing users access their profile via the 'Log in' button.
    decision_logic:
      - IF the user is new, THEN click 'Sign up'.
      - IF the user is existing, THEN click 'Log in'.
    actions:
      - Click the 'Sign up' button.
      - Click the 'Log in' button.
    verification:
      - For 'Sign up', verify that the registration form is displayed.
      - For 'Log in', verify that the login form is displayed or the user is redirected to their dashboard.
    recovery:
      - If the form does not load, try clicking the button again.
      - If login/signup fails, check for error messages and re-enter credentials/information.
  - name: Access Support and Information
    strategy:
      - Locate links related to 'Help', 'Support', or 'About Us'.
      - Navigate to the relevant information pages.
      - Identify links for legal terms or company information.
    reference_patterns:
      - Seeking assistance involves navigating to 'Help' or the 'Help Center'.
      - Information about the company or legal terms is found through 'About Us' or 'Terms & Conditions'.
    decision_logic:
      - IF 'Help' or 'Help Center' is visible, THEN click to find support.
      - IF 'About Us' or 'Terms & Conditions' is visible, THEN click to find company information.
    actions:
      - Click on 'Help' or 'Help Center'.
      - Click on 'About Us' or 'Terms & Conditions'.
    verification:
      - Confirm that the page displays FAQs, contact information, or articles.
      - Verify that the page contains company details or legal documents.
    recovery:
      - If the page does not load, try clicking the link again.
      - If the desired information is not found, try using the site's search function.
  - name: Understand Business Solutions
    strategy:
      - Locate links or sections dedicated to 'Business' or 'Enterprise' solutions.
      - Identify options for developers, such as an 'API'.
      - Navigate to the respective business or developer information pages.
    reference_patterns:
      - Businesses investigate offerings by clicking 'For Business' or 'LT for Business'.
      - Developers might explore the 'Proofreading API' for integration into their own systems.
    decision_logic:
      - IF 'For Business' or 'LT for Business' is visible, THEN click to explore business offerings.
      - IF 'Proofreading API' is visible, THEN click to explore developer resources.
    actions:
      - Click on 'For Business' or 'LT for Business'.
      - Click on 'Proofreading API'.
    verification:
      - Confirm that the page displays information about business plans, features, or case studies.
      - Verify that the API documentation or details are presented.
    recovery:
      - If the page does not load, try clicking the link again.
      - If the desired information is not found, try searching for "business" or "API" on the site.
  - name: Change Language Settings
    strategy:
      - Locate the language selection element, typically a dropdown.
      - Interact with the element to choose a preferred language.
      - Alternatively, navigate to specific language-focused pages.
    reference_patterns:
      - The user interacts with the language 'select' element to choose a preferred checking language.
      - Specific language spell-checking pages, like 'English' or 'German', can be directly accessed.
    decision_logic:
      - IF a language 'select' element is visible, THEN interact with it to change the language.
      - IF specific language pages (e.g., 'English', 'German') are accessible, THEN navigate directly.
    actions:
      - Click the language 'select' element and choose a language from the dropdown.
      - Navigate to a specific language spell-checking page.
    verification:
      - Observe if the interface language changes or if the checking language is updated.
      - Confirm that the selected language is reflected in the application.
    recovery:
      - If the language does not change, try re-selecting it from the dropdown.
      - If a specific language page fails to load, try navigating to the main page and using the dropdown.
  - name: Engage with Community and Social Media
    strategy:
      - Locate social media icons or links (e.g., 'X', 'Facebook').
      - Identify links to the platform's 'Blog'.
      - Navigate to the respective social media profiles or blog.
    reference_patterns:
      - Users can connect with the platform through various social media links such as 'X' or 'Facebook'.
      - Exploring the 'Blog' provides insights and updates from the LanguageTool team.
    decision_logic:
      - IF social media links (e.g., 'X', 'Facebook') are visible, THEN click to connect.
      - IF 'Blog' link is visible, THEN click to read updates.
    actions:
      - Click on social media icons/links (e.g., 'X', 'Facebook').
      - Click on the 'Blog' link.
    verification:
      - Confirm that the social media profile page opens in a new tab/window.
      - Verify that the blog page loads and displays articles.
    recovery:
      - If a social media link is broken, try searching for the platform's name on that social media site.
      - If the blog page does not load, try clicking the link again.
  - name: Explore Open-Source and Developer Resources
    strategy:
      - Locate links related to 'Open-Source' or 'Source Code'.
      - Identify the 'Proofreading API' for programmatic access.
      - Navigate to the relevant open-source or API documentation pages.
    reference_patterns:
      - Developers interested in the underlying technology will seek out 'Open-Source Development' or 'Source Code'.
      - The 'Proofreading API' provides a programmatic interface for advanced usage.
    decision_logic:
      - IF 'Open-Source Development' or 'Source Code' is visible, THEN click to explore.
      - IF 'Proofreading API' is visible, THEN click to access API documentation.
    actions:
      - Click on 'Open-Source Development' or 'Source Code'.
      - Click on 'Proofreading API'.
    verification:
      - Confirm that the page displays information about open-source projects or links to repositories.
      - Verify that the API documentation, endpoints, and usage examples are presented.
    recovery:
      - If the page does not load, try clicking the link again.
      - If the desired information is not found, try searching for "open source" or "API" on the site.
