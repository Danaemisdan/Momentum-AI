  strategy:
    - "Scan all new product listings and updates for keywords, images, and metadata indicative of sanctioned goods, dual-use items, or items originating from restricted regions."
    - "Cross-reference identified items/entities against global sanctions lists (e.g., OFAC, EU, UN) and Amazon's internal prohibited items catalog."
    - "Automatically block or flag for manual review any listing that poses a potential sanctions or export control risk, preventing it from going live."
  reference_patterns:
