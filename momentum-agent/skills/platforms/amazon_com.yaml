  - name: "algorithmic_bias_detection_and_mitigation_for_recommendations"
    trigger_roles:
      - "Explainable AI & Interpretability Architect"
    strategy:
      - "Continuously monitor amazon.com's recommendation algorithms (e.g., 'Customers who bought this also bought...') for statistical biases related to protected attributes (gender, race, age, socioeconomic status)."
      - "Generate human-readable explanations for specific recommendation outcomes, highlighting the contributing factors and potential sources of bias."
      - "Propose and implement targeted interventions to mitigate identified biases while maintaining recommendation quality."
    reference_patterns:
      - "Recommendation engine consistently suggesting lower-priced items to users from specific geographic regions."
      - "Gender-stereotyped product recommendations appearing for neutral search queries."
      - "Lack of diversity in recommended products for certain demographic groups."
    decision_logic:
      - "IF recommendation for 'kitchen appliances' consistently shows only male models to male users AND female models to female users THEN identify as gender bias and flag for intervention."
      - "IF users from low-income zip codes are disproportionately recommended 'used' or 'refurbished' items, even when new alternatives are available AND relevant to their browsing history THEN flag as socioeconomic bias."
      - "IF the explanation for a recommendation reveals a strong correlation with a protected attribute that is not directly relevant to product utility THEN propose de-biasing techniques."
    actions:
      - "Analyze recommendation logs for statistical disparities across demographic groups."
      - "Generate counterfactual explanations for biased recommendations (e.g., 'If you were X, you would have seen Y')."
      - "Adjust feature weighting or introduce fairness constraints into recommendation models."
    verification:
      - "Bias metrics (e.g., disparate impact, equal opportunity) show significant reduction post-intervention."
      - "Human evaluators rate explanations as 'clear' and 'informative' regarding bias."
      - "Recommendation quality (e.g., click-through rate, conversion) remains stable or improves after de-biasing."
    recovery:
      - "IF bias mitigation technique negatively impacts recommendation quality significantly THEN revert to previous model and explore alternative de-biasing strategies."
      - "IF explanation generation fails to provide coherent reasons THEN flag the model for deeper interpretability analysis."
      - "IF new biases emerge after intervention THEN re-initiate the detection and mitigation cycle."
