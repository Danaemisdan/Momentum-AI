  - name: "InferCausalImpactOfPromotionalCampaignOnCustomerLifetimeValue"
  trigger_roles:
    - "Probabilistic Inference & Causal Discovery Architect"
  strategy:
    - Ingest granular data from a specific Amazon promotional campaign (e.g., discount codes, ad impressions, user interactions) and subsequent customer behavior.
    - Apply advanced causal inference techniques (e.g., uplift modeling, synthetic control methods, instrumental variables) to isolate the true causal effect of the campaign on long-term customer metrics like Lifetime Value (LTV).
    - Disentangle confounding factors and provide a probabilistic assessment of the campaign's net impact, informing future marketing budget allocation.
  reference_patterns:
    - Correlation between campaign participation and increased sales, but unclear causality.
    - High cost of campaigns with uncertain long-term ROI.
    - Need to optimize marketing spend across various channels and promotions.
  decision_logic:
    - IF campaign_spend_exceeds_threshold AND observed_sales_increase_is_significant THEN initiate_causal_impact_analysis.
    - IF A/B_test_results_are_ambiguous_due_to_spillover_effects THEN apply_advanced_causal_discovery_methods.
    - IF predicted_LTV_uplift_from_campaign < 0.05 THEN recommend_re-evaluation_of_campaign_strategy.
  actions:
    - Access "Causal Inference & Discovery Platform" (simulated internal tool).
    - Select "Promotional Campaign Impact Analysis".
    - Input "Campaign ID: [Campaign ID]".
    - Define "Target Causal Variable: [Customer LTV]".
    - Specify "Confounding Variables: [e.g., Seasonality, Economic Trends]".
    - Run "Causal Inference Model: [e.g., Uplift Modeling]".
    - Generate "Probabilistic Impact Report".
  verification:
    - Review confidence intervals and statistical significance of causal estimates.
    - Compare model-predicted LTV uplift with actual observed LTV for treated vs. control groups (where applicable).
    - Validate model assumptions against domain expertise.
  recovery:
    - IF causal_model_fails_to_converge_or_produces_unstable_estimates THEN adjust_model_specification_or_feature_engineering.
    - IF data_quality_issues_detected_in_campaign_logs THEN flag_for_data_cleaning_and_re-ingestion.

