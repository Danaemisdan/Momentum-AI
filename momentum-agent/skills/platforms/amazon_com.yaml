      - "Systemic Risk & Vulnerability Nexus Analyst"
    strategy:
      - "Continuously monitor and analyze the codebases, API interactions, and data flows of third-party seller integrations on amazon.com for novel attack vectors and zero-day vulnerabilities."
      - "Employ advanced static and dynamic code analysis, fuzzing, and behavioral analytics to detect anomalous patterns indicative of exploitation attempts or inherent weaknesses."
      - "Develop predictive models to anticipate potential systemic risks introduced by new third-party integrations before they are widely deployed."
    reference_patterns:
      - "unexplained data exfiltration attempts from seller accounts"
      - "anomalous API call patterns from third-party applications"
      - "security incidents originating from newly integrated seller tools"
      - "publicly disclosed vulnerabilities in common third-party libraries used by sellers"
      - "high-risk permissions requested by new seller applications"
    decision_logic:
      - "IF (static_analysis_flags_critical_vulnerability_in_seller_code) THEN trigger immediate review and remediation."
      - "IF (behavioral_analytics_detects_zero_day_exploit_signature) THEN isolate affected integration and alert security teams."
      - "IF (predictive_model_identifies_high_risk_new_integration) THEN recommend enhanced vetting process."
    actions:
      - "Access Amazon's third-party seller integration manifests and code repositories."
      - "Utilize AWS CodeGuru for static code analysis."
      - "Employ custom fuzzing tools against seller APIs in isolated environments."
      - "Integrate with Amazon GuardDuty for threat detection and anomaly analysis."
      - "Generate vulnerability reports and remediation recommendations."
    verification:
      - "Confirm successful detection of known vulnerabilities in test environments."
      - "Verify the accuracy of predictive models in identifying high-risk integrations."
      - "Track the reduction in security incidents related to third-party integrations."
    recovery:
      - "Update static analysis rules and fuzzing payloads if new vulnerability classes emerge."
      - "Refine behavioral analytics models if false positives or negatives are high."
      - "Collaborate with 'Forensic Artifact Synthesizer & Incident Attribution Engine' for post-incident analysis."
  - name: "auto_generate_and_deploy_backend_microservice_documentation_and_tutorials"
    trigger_roles:
      - "Autonomous Knowledge Acquisition & Pedagogy Structurer"
    strategy:
      - "Automatically scan and analyze the codebase, API contracts, and deployment configurations of new and updated backend microservices on amazon.com."
      - "Synthesize this information into structured, developer-friendly documentation (e.g., OpenAPI specs, usage examples, architectural overviews) and interactive tutorials."
      - "Automate the deployment and versioning of this pedagogical content to internal developer portals and knowledge bases, ensuring it remains current with service evolution."
    reference_patterns:
      - "developer support tickets related to undocumented microservice APIs"
      - "delays in onboarding new engineers due to lack of comprehensive service documentation"
      - "inconsistent or outdated documentation for critical backend services"
      - "manual effort required to update documentation after service changes"
    decision_logic:
      - "IF (new_microservice_deployed OR existing_microservice_updated) THEN trigger documentation generation."
      - "IF (documentation_completeness_score < threshold_low) THEN flag for enrichment."
      - "IF (developer_feedback_on_tutorial_effectiveness > threshold_positive) THEN prioritize similar content generation."
    actions:
      - "Access Amazon's internal Git repositories for microservice code."
      - "Utilize AWS CodePipeline and CodeBuild for automated documentation generation."
      - "Employ natural language generation (NLG) models (e.g., fine-tuned Amazon SageMaker models) to create human-readable explanations."
      - "Deploy generated content to internal Confluence/Wiki instances or custom developer portals."
      - "Integrate with API Gateway for automatic OpenAPI spec generation."
    verification:
