    - "IF (weather_alert_severity = 'extreme') AND (impacted_region_contains_supplier_Y) THEN initiate_contact_with_alternative_supplier_Z_for_contingency."
    - "IF (geopolitical_event_sentiment = 'negative') AND (affects_key_manufacturing_region) THEN recommend_pre-emptive_inventory_build-up_for_affected_products."
