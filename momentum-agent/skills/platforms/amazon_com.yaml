    recovery:
      - "IF legitimate_user_is_blocked_by_verification_step THEN provide_clear_path_to_customer_support_for_manual_review."
      - "IF MFA_delivery_mechanism_fails (e.g., SMS not received) THEN offer_alternative_verification_method."

