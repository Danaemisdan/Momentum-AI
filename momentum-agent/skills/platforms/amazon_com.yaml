      - Scan product listings, descriptions, and seller information for potential non-compliance.
      - Generate compliance reports and flag high-risk items for review.
    reference_patterns:
      - Frequent updates to regulatory databases.
      - Accessing product data feeds.
      - Cross-referencing legal text with product attributes.
    decision_logic:
      - IF new regulation affects product category THEN initiate scan for that category.
      - IF product description contains prohibited claims THEN flag for seller notification.
      - IF seller lacks required certification for product THEN initiate compliance review.
    actions:
      - Access Amazon's internal product catalog database.
      - Query external regulatory databases (e.g., FDA, EU CE marking).
      - Generate internal compliance reports.
      - Flag specific product ASINs or seller accounts.
    verification:
      - Confirm generation of compliance report.
      - Verify flagged items align with identified regulatory violations.
      - Check if notifications are queued for relevant teams/sellers.
    recovery:
