    - "Access 'SageMaker Clarify' for bias detection and explainability on recommendation models."
    - "Query 'Amazon Personalize' for recommendation logs and user interaction data."
    - "Develop and deploy custom bias mitigation algorithms within 'SageMaker'."
    - "Generate 'QuickSight' dashboards visualizing bias metrics and fairness scores over time."
    - "Create 'Jira' tickets for model retraining or feature engineering tasks related to bias."
  verification:
