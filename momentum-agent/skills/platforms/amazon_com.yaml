  - name: "proactive_system_health_anomaly_detection"
    trigger_roles:
      - "Intelligent Observability & Anomaly Detection Nexus"
    strategy:
      - "Continuously ingest and analyze real-time telemetry data (logs, metrics, traces) from all Amazon services."
      - "Apply machine learning models to detect subtle deviations from normal operational baselines, predicting potential outages or performance degradations."
      - "Automatically generate and route actionable alerts to relevant engineering teams, initiating diagnostic playbooks."
    reference_patterns:
      - "Spike in HTTP 5xx errors for a specific microservice."
      - "Gradual increase in database query latency over 30 minutes."
      - "Unusual pattern of user login failures from a specific geographic region."
      - "Log entries containing keywords like 'OutOfMemoryError' or 'ConnectionTimeout'."
    decision_logic:
      - "IF (metric['service_X']['error_rate'] > baseline_error_rate * 2 AND duration > 5_minutes) THEN trigger_critical_alert_for_service_X_team."
      - "IF (log_pattern_match('OutOfMemoryError') AND host_group == 'checkout_servers') THEN automatically_scale_up_memory_for_affected_instances_and_notify_SRE."
      - "IF (user_login_failures_from_region_Y > baseline_failures * 3 AND source_IP_range_matches_known_botnet) THEN automatically_block_IP_range_and_notify_security_team."
      - "IF (anomaly_score > 0.95 AND no_known_deployments_or_events) THEN initiate_automated_diagnostic_runbook_for_affected_service."
    actions:
      - "API.call('amazon_monitoring_service.create_alert', severity='CRITICAL', message='High error rate in Service X', target_team='ServiceX_SRE')"
      - "API.call('amazon_security_service.block_ip_range', ip_range='detected_botnet_range')"
      - "API.call('amazon_runbook_automation_service.execute_playbook', playbook_name='diagnose_service_X_performance', service_id='service_X')"
      - "UI.navigate_to('/aws/console/cloudwatch/alarms')"
      - "UI.click_element('button[data-action=\"create-new-alarm\"]')"
      - "UI.input_text('input[name=\"metric_name\"]', 'service_X_error_rate')"
    verification:
      - "API.call('amazon_monitoring_service.get_alert_status', alert_id='service_X_error_alert') == 'FIRING'"
      - "API.call('amazon_security_service.get_blocked_ips') CONTAINS 'detected_botnet_range'"
      - "UI.element_text_contains('div[data-alert-id=\"service_X_error_alert\"]', 'Status: ALARM')"
    recovery:
      - "IF (API.error_code == '400_INVALID_ALERT_CONFIG') THEN re-validate_alert_parameters_and_retry_creation."
      - "IF (API.error_code == '503_AUTOMATION_SERVICE_UNAVAILABLE') THEN escalate_to_human_on-call_engineer_with_full_context."
      - "IF (UI.element_not_found('button[data-action=\"create-new-alarm\"]')) THEN attempt_alert_creation_via_CLI_tool."
