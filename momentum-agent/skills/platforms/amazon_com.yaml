    - "Verify 'DynamoDB' queries return accurate and up-to-date data."
    - "Check 'SNS' topic for successful delivery of compliance alerts."
  recovery:
    - "IF (external_API_call_fails) THEN (implement_retry_logic_and_alert_API_integration_team)"
    - "IF (DynamoDB_query_latency_high) THEN (optimize_indexes_or_scale_up_read_capacity)"
    - "IF (SNS_delivery_failures) THEN (review_endpoint_configurations_and_permissions)"
  
  - name: "AuditAlgorithmicBiasInRecommendations"
  trigger_roles:
    - "Ethical AI & Compliance Architect"
  strategy:
    - "Monitor product recommendation algorithms for unintended biases across demographic groups (e.g., gender, race, age)."
    - "Analyze recommendation diversity and fairness metrics to ensure equitable exposure for sellers and products."
    - "Propose and implement bias mitigation techniques (e.g., re-ranking, constrained optimization) to ensure fair and inclusive recommendations."
  reference_patterns:
    - "Recommendation lists consistently showing certain demographics specific product types."
    - "Underrepresentation of products from minority-owned businesses in top recommendations."
    - "Disparate impact on conversion rates or visibility for different user segments."
    - "Customer feedback or complaints regarding biased recommendations."
  decision_logic:
    - "IF (recommendation_diversity_score_for_group_A < threshold_min) THEN (trigger_re-ranking_algorithm_with_diversity_constraints)"
    - "IF (disparate_impact_metric_for_gender_X > threshold_max) THEN (initiate_feature_re-engineering_or_debiasing_techniques_on_model)"
    - "IF (seller_visibility_for_minority_owned_businesses < target_percentage) THEN (boost_exposure_for_identified_sellers_in_recommendation_pool)"
    - "IF (new_model_deployment_causes_bias_spike) THEN (rollback_to_previous_model_and_investigate_new_model_parameters)"
