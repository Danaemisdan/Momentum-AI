  - name: "OptimizeProductPricingForElasticity"
  trigger_roles:
    - "Data-Driven Monetization & Pricing Strategist"
  strategy:
    - "Identify products with high price elasticity based on recent sales data and competitor pricing."
    - "Simulate price adjustments across various product categories to predict revenue impact."
    - "Implement dynamic pricing changes for selected products to maximize profit margins while maintaining sales velocity."
  reference_patterns:
    - "Frequent price changes on competitor platforms for similar products."
    - "Significant drops in sales volume following minor price increases."
    - "High conversion rates during promotional pricing periods."
    - "Customer reviews mentioning price as a primary decision factor."
  decision_logic:
    - "IF (product_elasticity > threshold_high AND competitor_price < current_price) THEN (decrease_price_by_X_percent)"
    - "IF (product_elasticity < threshold_low AND profit_margin < target_margin) THEN (increase_price_by_Y_percent)"
    - "IF (promotional_event_imminent AND inventory_level > buffer_stock) THEN (apply_temporary_discount_Z)"
    - "IF (sales_velocity_stagnant AND competitor_price_stable) THEN (A/B_test_new_price_point)"
  actions:
    - "Navigate to 'Seller Central' -> 'Pricing' -> 'Automated Pricing Rules'."
    - "Select 'Create a new pricing rule'."
    - "Choose 'Competitive Buy Box Price' or 'Lowest Price' strategy."
    - "Define price adjustment parameters (e.g., 'Stay below Buy Box by $0.50')."
    - "Apply rule to identified ASINs."
    - "Monitor 'Business Reports' -> 'Sales Dashboard' for immediate impact."
  verification:
    - "Confirm price changes are reflected on product detail pages within 15 minutes."
    - "Verify 'Automated Pricing Rules' dashboard shows active rules for targeted ASINs."
    - "Check 'Sales and Traffic' report for initial uplift or stabilization in sales volume."
  recovery:
    - "IF (price_change_not_reflected) THEN (re-apply_pricing_rule_and_clear_cache)"
    - "IF (sales_drop_significantly_below_baseline) THEN (revert_to_previous_price_and_analyze_competitor_actions)"
    - "IF (rule_application_fails) THEN (check_for_API_errors_or_platform_status_page)"
  
  - name: "ForecastQuarterlyRevenueByCategory"
  trigger_roles:
    - "Predictive Revenue Optimization Engine"
  strategy:
    - "Ingest historical sales data, marketing spend, and external economic indicators."
    - "Apply advanced time-series models (e.g., ARIMA, Prophet) to forecast revenue for the next quarter across all major product categories."
    - "Identify high-growth and declining categories to inform resource allocation and inventory planning."
  reference_patterns:
    - "Seasonal spikes and dips in sales for specific product types."
    - "Correlation between marketing campaign launches and revenue increases."
    - "Impact of macroeconomic news (e.g., inflation, consumer confidence) on overall sales trends."
    - "Inventory levels fluctuating in anticipation of peak seasons."
  decision_logic:
    - "IF (forecasted_growth_rate_category_X > threshold_high) THEN (recommend_increased_inventory_and_marketing_budget_for_X)"
    - "IF (forecasted_decline_rate_category_Y > threshold_moderate) THEN (recommend_reduced_inventory_and_promotional_offers_for_Y)"
    - "IF (forecasted_total_revenue < target_quarterly_revenue) THEN (trigger_alert_for_strategic_intervention)"
    - "IF (model_confidence_interval_wide) THEN (request_additional_data_inputs_or_alternative_model_evaluation)"
  actions:
    - "Access 'Amazon Redshift' data warehouse for historical sales, marketing, and inventory data."
    - "Execute 'SageMaker' notebook containing revenue forecasting models."
    - "Generate 'QuickSight' dashboard visualizing forecasted revenue by category and confidence intervals."
    - "Publish forecast report to 'AWS S3' for stakeholder access."
  verification:
    - "Confirm 'QuickSight' dashboard loads with current quarter's forecast data."
    - "Verify forecast accuracy against actual sales data from previous quarters (backtesting)."
    - "Check 'S3' bucket for the presence of the latest forecast report."
  recovery:
    - "IF (SageMaker_job_fails) THEN (review_logs_for_data_ingestion_or_model_execution_errors)"
    - "IF (QuickSight_dashboard_data_stale) THEN (trigger_data_refresh_pipeline_from_Redshift)"
    - "IF (forecast_accuracy_below_threshold) THEN (retrain_models_with_updated_hyperparameters_or_new_features)"
  
  - name: "IdentifySupplyChainVulnerability"
  trigger_roles:
    - "Semantic Vulnerability Graph & Exploitability Modeler"
  strategy:
    - "Construct a semantic graph of Amazon's global supply chain, including suppliers, logistics partners, and geopolitical regions."
    - "Analyze the graph for single points of failure, concentration risks, and dependencies on unstable regions or entities."
    - "Simulate potential disruptions (e.g., natural disasters, geopolitical conflicts, supplier bankruptcy) to quantify their impact on product availability and delivery times."
  reference_patterns:
    - "Recent news articles detailing disruptions in specific geographic regions or industries."
    - "Supplier financial health reports indicating instability."
    - "Concentration of critical components from a single source."
    - "Historical data on delivery delays linked to specific logistics hubs."
  decision_logic:
    - "IF (single_source_supplier_for_critical_component AND geopolitical_risk_score > threshold) THEN (flag_high_vulnerability_and_recommend_alternative_sourcing)"
    - "IF (logistics_hub_capacity_utilization > threshold_high AND weather_forecast_severe) THEN (recommend_rerouting_shipments_or_pre-positioning_inventory)"
    - "IF (supplier_financial_health_score < threshold_low AND dependency_level_high) THEN (initiate_contingency_planning_for_supplier_replacement)"
    - "IF (simulated_disruption_impact_exceeds_tolerance) THEN (trigger_risk_mitigation_strategy_development)"
  actions:
