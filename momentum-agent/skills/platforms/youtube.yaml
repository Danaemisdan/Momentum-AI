platform: "youtube.com"
system_behavior: "YouTube is an algorithmic infinite-scroll engine. The interface centers around a prominent top search bar, extreme reliance on thumbnail grids, and sidebars for related content. Autoplay happens frequently."

intents:

- name: "research_deep_dive"
    trigger_roles: ["Learner", "Researcher", "Generalist", "Deep Explorer"]
    strategy:
      - "Identify the core research topic and formulate precise keywords."
      - "Utilize advanced search filters to refine results and eliminate irrelevant content."
      - "Access and analyze the most relevant video content and its associated metadata."
    reference_patterns:
      - "Locate the massive search bar at the very top center of the screen, input the exact niche topic, and hit the magnifying glass search button."
      - "Once results load, click the 'Filters' button right below the search bar."
      - "Under 'Duration', click 'Over 20 minutes' to strip out short-form noise. Under 'Sort by', click 'Relevance' or 'View count' depending on how authoritative you need the data."
      - "Click on the video thumbnail or exact title of the top result. Immediately look for the 'Show more' button in the description to expand it and find time-stamps or resource links."
    decision_logic:
      - "If search results are too broad, apply duration and sort filters."
      - "If the initial top result is not relevant, check the next few results."
      - "If 'Show more' is not present, assume the description is fully expanded."
    actions:
      - "Type into search bar (element: 'search_input')"
      - "Click search button (element: 'search_button')"
      - "Click 'Filters' button (element: 'filters_button')"
      - "Click 'Over 20 minutes' duration filter (element: 'duration_over_20_min')"
      - "Click 'Relevance' or 'View count' sort filter (element: 'sort_by_relevance' or 'sort_by_view_count')"
      - "Click video thumbnail/title (element: 'video_thumbnail' or 'video_title')"
      - "Click 'Show more' button (element: 'show_more_description')"
    verification:
      - "Confirm video page loaded and description is visible."
      - "Verify relevant timestamps or resource links are present in the expanded description."
    recovery:
      - "If no relevant results, refine search query and re-execute."
      - "If video fails to load, refresh the page."

  - name: "extract_transcript_metadata"
    trigger_roles: ["Synthesizer", "Fact Checker", "Data Thinker"]
    strategy:
      - "Access the video's description area to locate transcript options."
      - "Open and navigate the transcript panel to extract specific textual data."
      - "Handle cases where a direct transcript is unavailable."
    reference_patterns:
      - "Wait for the target video to buffer or begin playing, then locate the description area below the video player."
      - "Click the '...more' button inside the description block if it's collapsed."
      - "Scroll down within the description and look for a button labeled 'Show transcript'. Click it."
      - "A side panel titled 'Transcript' will appear on the right side of the video player. Read through the time-stamped dialogue text blocks and extract the specific quotes needed."
      - "If 'Show transcript' is not visible, it means the video creator disabled captions, and you must switch to an audio processing module to parse the raw playback."
    decision_logic:
      - "If description is collapsed, expand it."
      - "If 'Show transcript' is present, click it."
      - "If 'Show transcript' is absent, activate audio processing module."
    actions:
      - "Click '...more' button in description (element: 'description_more_button')"
      - "Click 'Show transcript' button (element: 'show_transcript_button')"
      - "Read text from transcript panel (element: 'transcript_panel_text')"
    verification:
      - "Confirm transcript panel is visible and contains time-stamped text."
      - "Verify extracted quotes match the video content."
    recovery:
      - "If 'Show transcript' button is unresponsive, refresh the page and retry."
      - "If transcript panel is empty, check for alternative caption options or resort to audio processing."

  - name: "passive_entertainment_loop"
    trigger_roles: ["Leisure Explorer", "Observer"]
    strategy:
      - "Return to the main feed to access algorithmically curated content."
      - "Select a video based on visual and textual cues that align with current interests."
      - "Allow the platform's autoplay feature to guide subsequent content consumption."
    reference_patterns:
      - "To simply consume algorithmically curated content, click the YouTube logo at the top left to return to the home screen."
      - "Scroll down the grid of recommendations, looking at the thumbnail images and titles. Select one that aligns with the agent's current persona or curiosity."
      - "Allow the video to play out entirely. Do not pause. Let YouTube's 'Autoplay' engine select the next 'Up next' video automatically to deeply embed into the algorithm's recommendation chain."
    decision_logic:
      - "If not on home screen, navigate to home screen."
      - "If multiple appealing videos, prioritize based on current persona/curiosity."
      - "Ensure autoplay is enabled for continuous viewing."
    actions:
      - "Click YouTube logo (element: 'youtube_logo')"
      - "Scroll down home feed (element: 'home_feed_scroll')"
      - "Click selected video thumbnail (element: 'recommended_video_thumbnail')"
      - "Ensure autoplay toggle is ON (element: 'autoplay_toggle')"
    verification:
      - "Confirm video starts playing."
      - "Verify 'Up next' list is populated and autoplay is active."
    recovery:
      - "If video fails to load, select another recommended video."
      - "If autoplay is off, toggle it on."

  - name: "trend_velocity_analysis"
    trigger_roles: ["Trend Spotter", "Marketing Strategist"]
    strategy:
      - "Access the platform's trending section to identify popular content."
      - "Extract key metrics for trending videos to calculate their velocity."
      - "Alert if a video's view velocity indicates a massive breakout."
    reference_patterns:
      - "Click the top-left hamburger menu icon to open the left sidebar."
      - "Scroll down to the 'Explore' section and click the flame icon labeled 'Trending'."
      - "Scan the 'Now' tab. Extract the titles, the total views count, and the exact uploaded duration (e.g. '14 hours ago')."
      - "Calculate the view velocity by dividing total views by the number of hours live. If >50k views/hour, trigger an alert for a massive breakout trend."
    decision_logic:
      - "If sidebar is closed, open it."
      - "If not on 'Trending' page, navigate to it."
      - "If view velocity exceeds threshold, trigger alert."
    actions:
      - "Click hamburger menu icon (element: 'hamburger_menu_icon')"
      - "Click 'Trending' link (element: 'trending_link')"
      - "Extract video title (element: 'trending_video_title')"
      - "Extract total views count (element: 'trending_video_views')"
      - "Extract uploaded duration (element: 'trending_video_duration')"
    verification:
      - "Confirm trending page is loaded and video metrics are visible."
      - "Verify view velocity calculation is accurate."
    recovery:
      - "If trending page fails to load, refresh and retry."
      - "If data extraction fails, re-attempt extraction for individual elements."

  - name: "proactive_regulatory_compliance_scan_for_new_content_policies"
    trigger_roles:
      - "Regulatory Foresight & Policy Synthesis Engine"
    strategy:
      - "Monitor global legislative bodies and industry standards for emerging digital content regulations."
      - "Cross-reference identified regulations with YouTube's existing content policies and operational guidelines."
      - "Generate a predictive impact assessment report for YouTube's content moderation, creator monetization, and user data handling."
    reference_patterns:
      - "detection of new governmental policy drafts related to online content."
      - "identification of industry whitepapers on AI ethics in content platforms."
      - "analysis of legal precedents in digital media liability."
    decision_logic:
      - "IF new regulation impacts content classification OR monetization, THEN flag for immediate policy synthesis."
      - "IF regulation requires new data handling protocols, THEN initiate data governance review."
      - "IF regulation has ambiguous language, THEN trigger legal interpretation request."
    actions:
      - "Access global legislative databases (e.g., EU Digital Services Act, US EARN IT Act)."
      - "Query YouTube's internal policy database for relevant sections."
      - "Generate a 'Regulatory Impact Assessment' document with proposed policy adjustments."
      - "Submit assessment to 'Policy Synthesis' module."
    verification:
      - "Confirmation of successful policy document generation."
      - "Receipt of acknowledgment from 'Policy Synthesis' module."
      - "Validation that all identified regulatory points have corresponding policy recommendations."
    recovery:
      - "IF database access fails, THEN retry connection with exponential backoff."
      - "IF policy synthesis module is unresponsive, THEN queue assessment for later submission and alert human oversight."

  - name: "quantum_safe_encryption_protocol_audit_for_user_data_streams"
    trigger_roles:
      - "Algorithmic Cryptographic Resilience & Quantum-Safe Transition Architect"
    strategy:
      - "Identify all YouTube data streams carrying sensitive user information (e.g., login credentials, payment details, private messages)."
      - "Audit current cryptographic protocols against known quantum attack vectors and post-quantum cryptography (PQC) standards."
      - "Generate a 'Quantum-Safe Transition Roadmap' detailing necessary cryptographic upgrades and implementation timelines."
    reference_patterns:
      - "detection of new quantum algorithm breakthroughs capable of breaking current asymmetric encryption."
      - "identification of NIST PQC standardization updates."
      - "analysis of data breach reports targeting cryptographic weaknesses."
    decision_logic:
      - "IF current encryption is vulnerable to known quantum attacks, THEN prioritize immediate PQC migration for that stream."
      - "IF PQC standards are finalized for a specific algorithm, THEN initiate pilot implementation plan."
      - "IF a data stream lacks adequate encryption, THEN flag as critical security vulnerability."
    actions:
      - "Scan YouTube's network architecture for data flow diagrams and encryption points."
      - "Execute cryptographic vulnerability assessment tools against identified protocols."
      - "Consult NIST PQC competition results and recommended algorithms."
      - "Generate a 'Quantum-Safe Migration Plan' document."
      - "Submit plan to 'Security Orchestration' module."
    verification:
      - "Confirmation of comprehensive data stream identification."
      - "Validation that all cryptographic protocols have been assessed against PQC standards."
      - "Receipt of acknowledgment from 'Security Orchestration' module for the migration plan."
    recovery:
      - "IF network scan fails, THEN attempt alternative network mapping tools."
      - "IF PQC standard data is inaccessible, THEN alert human for manual research and update."

  - name: "automated_ml_model_drift_detection_and_retraining_initiation"
    trigger_roles:
      - "AI Lifecycle & MLOps Automation Maestro"
    strategy:
      - "Continuously monitor performance metrics (e.g., click-through rate, watch time, content classification accuracy) for all active YouTube ML models."
      - "Detect significant deviations or degradation in model performance indicative of data drift or concept drift."
      - "Automatically trigger the retraining pipeline for affected models using updated datasets and hyperparameter optimization."
    reference_patterns:
      - "sustained decrease in recommendation engine CTR below a predefined threshold."
      - "increase in content moderation false positives/negatives."
      - "shift in user behavior patterns not reflected in current model predictions."
    decision_logic:
      - "IF model performance metric drops below threshold for 24 consecutive hours, THEN initiate retraining with current production data."
      - "IF new data distribution significantly diverges from training data, THEN trigger full model re-evaluation and potential architecture update."
      - "IF retraining fails to improve performance, THEN escalate to human MLOps engineer for investigation."
    actions:
      - "Access real-time model performance dashboards (e.g., Prometheus, Grafana)."
      - "Execute drift detection algorithms (e.g., ADWIN, DDM) on incoming data streams."
      - "Trigger automated retraining pipeline via CI/CD system (e.g., Kubernetes, Argo Workflows)."
      - "Log retraining event and new model version in model registry."
    verification:
      - "Confirmation of new model version deployment."
      - "Initial post-retraining performance metrics show improvement."
      - "Alerts confirm successful pipeline execution without errors."
    recovery:
      - "IF retraining pipeline fails, THEN revert to previous stable model version and alert MLOps team."
      - "IF data source for retraining is unavailable, THEN pause retraining and alert data engineering team."

  - name: "real_time_anomalous_behavior_detection_and_automated_threat_response"
    trigger_roles:
      - "Cognitive Security Orchestration & Automated Response Nexus"
    strategy:
      - "Continuously analyze all user interactions, content uploads, and system access logs for anomalous patterns indicative of security threats (e.g., botnets, account takeovers, coordinated disinformation campaigns)."
      - "Correlate disparate security signals across multiple YouTube subsystems to form a comprehensive threat picture."
      - "Automatically deploy pre-approved defensive countermeasures (e.g., rate limiting, account suspension, content removal) based on threat severity and confidence."
    reference_patterns:
      - "sudden surge in video uploads from a single IP range with identical metadata."
      - "multiple failed login attempts followed by a successful login from a new geographic location."
      - "coordinated mass reporting of legitimate content by newly created accounts."
    decision_logic:
      - "IF high-confidence botnet activity detected, THEN immediately rate-limit associated IPs and flag accounts for review."
      - "IF account takeover confirmed, THEN force password reset and notify legitimate user."
      - "IF coordinated disinformation campaign identified, THEN automatically remove violating content and notify 'Strategic Communications' for public statement."
    actions:
      - "Ingest real-time telemetry from YouTube's security information and event management (SIEM) system."
      - "Apply machine learning models for anomaly detection and threat classification."
      - "Execute automated playbooks via security orchestration, automation, and response (SOAR) platform."
      - "Generate incident report for human security analysts."
    verification:
      - "Confirmation of automated countermeasure deployment."
      - "Reduction in anomalous activity post-response."
      - "Successful generation and delivery of incident report."
    recovery:
      - "IF automated response fails, THEN escalate to human security operations center (SOC) for manual intervention."
      - "IF threat classification confidence is low, THEN quarantine suspicious activity and request human review before acting."

  - name: "dynamic_content_accessibility_enhancement_for_diverse_user_needs"
    trigger_roles:
      - "Accessibility & Inclusive Design Paragon"
    strategy:
      - "Scan newly uploaded YouTube content (video, audio, text) for potential accessibility barriers (e.g., lack of captions, poor color contrast, complex language)."
      - "Automatically generate or suggest accessibility improvements (e.g., auto-captions, audio descriptions, simplified language summaries) tailored to identified user profiles."
      - "Provide creators with actionable feedback and tools to enhance content accessibility before or after publishing."
    reference_patterns:
      - "detection of video uploads without closed captions or transcripts."
      - "identification of low contrast text overlays in video thumbnails."
      - "analysis of comment section feedback regarding accessibility issues."
    decision_logic:
      - "IF video lacks captions, THEN automatically generate and offer to creator for review."
      - "IF video contains significant visual information without audio description, THEN flag for potential audio description generation."
      - "IF content language complexity exceeds readability standards, THEN suggest simplified summary generation."
    actions:
      - "Utilize speech-to-text APIs for caption generation."
      - "Employ image recognition and object detection for potential audio description cues."
      - "Apply natural language processing (NLP) for readability assessment and summarization."
      - "Integrate accessibility feedback into creator studio interface."
    verification:
      - "Confirmation of auto-caption generation and availability."
      - "Creator acceptance rate of accessibility suggestions."
      - "Improvement in accessibility scores for new content."
    recovery:
      - "IF auto-caption generation fails, THEN notify creator of issue and suggest manual captioning."
      - "IF NLP model struggles with specific language, THEN escalate to human language expert for review."

  - name: "real_time_public_perception_sentiment_analysis_for_trending_topics"
    trigger_roles:
      - "Strategic Communications & Public Perception Synthesizer"
    strategy:
      - "Continuously monitor external news sources, social media platforms, and YouTube comments for trending topics and public sentiment related to YouTube's brand, policies, and content."
      - "Identify emerging narratives, potential PR crises, or positive sentiment spikes."
      - "Synthesize insights into actionable communication strategies and draft proactive or reactive public statements."
    reference_patterns:
      - "sudden increase in negative sentiment keywords associated with a YouTube policy change on Twitter."
      - "viral spread of a misinformation campaign targeting YouTube's content moderation."
      - "overwhelming positive public reaction to a new YouTube feature launch."
    decision_logic:
      - "IF negative sentiment exceeds threshold for a critical topic, THEN trigger crisis communication protocol and draft holding statement."
      - "IF positive sentiment indicates a successful initiative, THEN amplify positive messaging and identify key influencers."
      - "IF misinformation campaign detected, THEN draft factual correction statement and coordinate with 'Cognitive Security' for content removal."
    actions:
      - "Ingest data from external social listening tools (e.g., Brandwatch, Sprinklr)."
      - "Apply sentiment analysis and topic modeling to identify key themes and emotional tone."
      - "Generate 'Public Perception Report' with recommended communication actions."
      - "Draft initial public statements or social media responses."
    verification:
      - "Confirmation of report generation and delivery to communications team."
      - "Tracking of public sentiment shift after communication deployment."
      - "Validation that drafted statements align with brand guidelines."
    recovery:
      - "IF external data feeds fail, THEN alert data ingestion team and switch to alternative data sources."
      - "IF sentiment analysis model produces ambiguous results, THEN flag for human review and manual sentiment tagging."

  - name: "dynamic_microservice_resource_reallocation_for_peak_traffic_events"
    trigger_roles:
      - "Self-Assembling & Reconfigurable Micro-Architecture Fabricator"
    strategy:
      - "Continuously monitor YouTube's microservice architecture for real-time resource utilization, latency, and error rates across all services (e.g., video transcoding, recommendation engine, search)."
      - "Predict impending peak traffic events (e.g., major live streams, viral content surges) based on historical data and external event triggers."
      - "Dynamically reconfigure and reallocate computational resources (CPU, RAM, network bandwidth) to critical microservices to maintain optimal performance and prevent outages."
    reference_patterns:
      - "sudden spike in concurrent viewers for a live event."
      - "exponential growth in views for a newly uploaded video."
      - "pre-scheduled global events known to drive high traffic (e.g., sports finals, product launches)."
    decision_logic:
      - "IF predicted traffic surge for video transcoding service, THEN scale up transcoding microservices by X instances."
      - "IF recommendation engine latency exceeds threshold, THEN reallocate CPU resources from less critical background tasks."
      - "IF a microservice experiences repeated errors, THEN isolate and re-route traffic to healthy instances while initiating self-healing protocols."
    actions:
      - "Access Kubernetes/cloud orchestration metrics (e.g., CPU utilization, memory usage, network I/O)."
      - "Utilize predictive analytics models for traffic forecasting."
      - "Execute API calls to cloud provider (e.g., GCP, AWS) for resource scaling."
      - "Update service mesh configurations for traffic routing."
    verification:
      - "Confirmation of successful resource scaling operations."
      - "Real-time metrics show reduced latency and error rates during peak events."
      - "Validation of stable system performance post-reconfiguration."
    recovery:
      - "IF resource scaling fails, THEN alert SRE team and initiate emergency failover procedures."
      - "IF predictive model accuracy degrades, THEN trigger model retraining with updated traffic data."

  - name: "automated_fraudulent_ad_impression_detection_and_clawback"
    trigger_roles:
      - "Financial Algorithmic Steward"
    strategy:
      - "Continuously analyze all ad impressions and clicks across YouTube for patterns indicative of fraudulent activity (e.g., bot traffic, click farms, ad stacking)."
      - "Identify and quantify the financial impact of detected fraudulent impressions on advertisers and creators."
      - "Automatically initiate clawback procedures for fraudulent revenue and adjust financial reporting."
    reference_patterns:
      - "unusually high click-through rates from suspicious IP addresses."
      - "discrepancies between reported impressions and actual video views."
      - "rapid, non-human-like browsing patterns on ad-served pages."
    decision_logic:
      - "IF high-confidence fraudulent impression detected, THEN flag ad revenue for clawback from relevant accounts."
      - "IF a specific ad campaign consistently attracts fraudulent traffic, THEN pause campaign and notify advertiser."
      - "IF a creator's content consistently generates fraudulent impressions, THEN demonetize content and initiate account review."
    actions:
      - "Ingest real-time ad impression logs and click data."
      - "Apply machine learning models for fraud detection (e.g., anomaly detection, behavioral analytics)."
      - "Access financial ledger system to identify affected revenue streams."
      - "Execute automated financial adjustments and generate audit trails."
    verification:
      - "Confirmation of successful revenue clawback transactions."
      - "Reduction in reported fraudulent impressions over time."
      - "Audit logs confirm all financial adjustments are recorded accurately."
    recovery:
      - "IF financial system integration fails, THEN queue clawback requests and alert finance operations team."
      - "IF fraud detection model confidence is low, THEN flag impressions for human review before initiating clawback."

  - name: "cross_platform_content_delivery_optimization_for_variable_device_ecosystems"
    trigger_roles:
      - "Omni-Dimensional Deployment & Orchestration Architect"
    strategy:
      - "Continuously monitor content delivery performance and user experience across all supported devices and platforms (e.g., mobile, desktop, smart TVs, VR headsets, low-bandwidth regions)."
      - "Dynamically optimize content encoding, streaming protocols, and caching strategies based on real-time network conditions, device capabilities, and user preferences."
      - "Orchestrate seamless content delivery and feature parity across the entire YouTube ecosystem."
    reference_patterns:
      - "high buffering rates reported by users on specific mobile networks."
      - "suboptimal video quality on large-screen smart TVs."
      - "inconsistent feature availability across different device types."
    decision_logic:
      - "IF high buffering detected for mobile users in region X, THEN switch to lower bitrate adaptive streaming profile and deploy edge caching."
      - "IF smart TV users report low resolution, THEN prioritize higher resolution transcodes for that device type."
      - "IF a new device type is detected, THEN automatically provision and test content delivery profiles."
    actions:
      - "Ingest telemetry from client-side applications and content delivery networks (CDNs)."
      - "Utilize device capability detection APIs."
      - "Execute dynamic content transcoding adjustments via video processing pipelines."
      - "Configure CDN rules and edge caching policies."
    verification:
      - "Confirmation of improved buffering rates and video quality metrics across diverse devices."
      - "Validation of consistent feature availability across platforms."
      - "User feedback indicates enhanced viewing experience."
    recovery:
      - "IF CDN configuration fails, THEN revert to previous stable configuration and alert network operations."
      - "IF device capability detection is inaccurate, THEN flag for manual device profile update."

  - name: "cross_platform_creator_monetization_synergy_identification_and_optimization"
    trigger_roles:
      - "Ecosystem & Partnership Synergy Orchestrator"
    strategy:
      - "Analyze creator content, audience demographics, and engagement patterns across YouTube and potential external partner platforms (e.g., gaming platforms, e-commerce sites, social media)."
      - "Identify synergistic monetization opportunities for creators that extend beyond YouTube's native ad revenue (e.g., merchandise sales integration, direct fan subscriptions on external platforms, cross-platform sponsorships)."
      - "Orchestrate partnerships and technical integrations to enable seamless creator monetization across a broader digital ecosystem."
    reference_patterns:
      - "high engagement of a YouTube gaming creator's audience on a specific game streaming platform."
      - "significant external merchandise sales linked to a YouTube creator's brand."
      - "creator audience overlap between YouTube and a niche e-commerce platform."
    decision_logic:
      - "IF a creator's audience shows high engagement on a specific external platform, THEN identify potential partnership for direct monetization integration."
      - "IF a creator's content aligns with a specific product category, THEN suggest e-commerce integration opportunities."
      - "IF a new external platform gains significant traction, THEN evaluate its potential for creator monetization synergy and initiate partnership exploration."
    actions:
      - "Access YouTube Analytics data for creator performance and audience insights."
      - "Utilize external market research and platform analysis tools."
      - "Generate 'Creator Synergy Report' with identified opportunities and potential partners."
      - "Initiate communication with potential external partners for integration discussions."
    verification:
      - "Confirmation of successful partnership initiation or integration."
      - "Increase in creator's diversified revenue streams."
      - "Positive feedback from creators regarding new monetization options."
    recovery:
      - "IF external platform data is inaccessible, THEN alert data acquisition team and seek alternative data sources."
      - "IF partnership negotiations stall, THEN re-evaluate alternative partners or internal solutions."

  - name: "symbolic_content_relation_mapping"
    trigger_roles:
      - "Cognitive Architecture & Symbolic Reasoning Integrator"
    strategy:
      - Analyze newly uploaded video content for core semantic entities and actions.
      - Map identified entities and actions to existing knowledge graph ontologies and symbolic representations of user interests.
      - Infer novel, high-level conceptual relationships between disparate videos based on symbolic reasoning.
    reference_patterns:
      - High volume of new video uploads in diverse categories.
      - Low existing symbolic connections between seemingly related content.
      - User search queries indicating conceptual gaps (e.g., "how to combine X and Y" where X and Y are distinct video topics).
    decision_logic:
      - IF new_video_upload AND entity_extraction_successful THEN initiate_symbolic_mapping.
      - IF symbolic_mapping_identifies_novel_relation AND confidence_score > 0.8 THEN propose_new_knowledge_graph_edge.
      - IF user_query_pattern_matches_conceptual_gap THEN prioritize_symbolic_mapping_for_relevant_content.
    actions:
      - Access video metadata and transcribed content.
      - Query internal knowledge graph for existing entities and relations.
      - Propose new symbolic links to the recommendation engine.
    verification:
      - Check if the proposed symbolic link improves recommendation diversity or relevance for test users.
      - Verify that the new knowledge graph edge is logically consistent with existing ontology.
    recovery:
      - IF symbolic_mapping_fails_due_to_low_confidence THEN request human expert review of extracted entities.
      - IF proposed_edge_rejected_by_ontology_validator THEN refine symbolic mapping rules and re-evaluate.
  - name: "ethical_bias_propagation_audit"
    trigger_roles:
      - "Ethical AI & Responsible Innovation Enforcer"
    strategy:
      - Systematically audit the recommendation algorithm's output for potential biases across demographic groups.
      - Trace identified biases back to their source within the data, model, or feature engineering.
      - Propose and enforce mitigation strategies to prevent the propagation of harmful biases.
    reference_patterns:
      - Disproportionate content exposure for specific demographics.
      - User complaints regarding unfair or discriminatory content suggestions.
      - A/B test results showing significant performance disparities across user segments.
    decision_logic:
      - IF bias_detection_algorithm_flags_disparity_above_threshold THEN initiate_root_cause_analysis.
      - IF root_cause_identified_as_feature_engineering THEN mandate feature re-evaluation and re-design.
      - IF proposed_mitigation_strategy_reduces_bias_by_X% THEN approve_for_deployment.
    actions:
      - Access recommendation logs and user demographic data (anonymized).
      - Run bias detection algorithms on recommendation outputs.
      - Flag biased features or model weights for review.
      - Trigger policy enforcement mechanisms for algorithm adjustments.
    verification:
      - Monitor post-mitigation recommendation metrics for equitable distribution.
      - Conduct user surveys to assess perceived fairness and inclusivity.
    recovery:
      - IF mitigation_strategy_fails_to_reduce_bias THEN escalate to human ethics committee for intervention.
      - IF new_bias_emerges_after_mitigation THEN re-initiate audit with refined detection parameters.
  - name: "adaptive_cognitive_load_optimization"
    trigger_roles:
      - "User Experience & Cognitive Flow Architect"
    strategy:
      - Monitor user cognitive load indicators (e.g., watch time, interaction frequency, abandonment rates) during content consumption.
      - Dynamically adjust UI elements, content density, and recommendation pacing to maintain optimal cognitive flow.
      - Personalize the presentation of information to match individual user's processing capabilities and preferences.
    reference_patterns:
      - Sudden drops in watch time or increased skipping behavior.
      - High bounce rates on complex video pages.
      - User feedback indicating information overload or boredom.
    decision_logic:
      - IF cognitive_load_indicator_exceeds_threshold THEN simplify_UI_elements_or_reduce_recommendation_density.
      - IF cognitive_load_indicator_falls_below_threshold THEN introduce_more_complex_interactions_or_diverse_content.
      - IF user_preference_for_fast_pacing_detected THEN increase_content_delivery_speed.
    actions:
      - Analyze real-time user interaction data (scroll speed, click patterns, gaze tracking if available).
      - Adjust recommendation carousel size and speed.
      - Modify video player controls visibility and complexity.
      - Dynamically alter content summary length.
    verification:
      - A/B test different cognitive load adjustments and measure user engagement and satisfaction.
      - Observe changes in user watch time and completion rates.
    recovery:
      - IF cognitive_load_adjustment_leads_to_negative_engagement THEN revert to previous state and re-evaluate.
      - IF system_fails_to_detect_cognitive_load_changes THEN recalibrate sensor inputs and detection algorithms.
  - name: "emerging_content_niche_identification"
    trigger_roles:
      - "Market Intelligence & Competitive Foresight Analyst"
    strategy:
      - Scan external web platforms, social media, and academic research for nascent trends and content gaps.
      - Identify early indicators of emerging content niches not yet saturated on YouTube.
      - Forecast the potential growth and monetization opportunities of these identified niches.
    reference_patterns:
      - Spikes in search queries on external platforms for specific, new topics.
      - High engagement with niche content on competitor platforms with low YouTube presence.
      - Academic papers or industry reports predicting future consumer interests.
    decision_logic:
