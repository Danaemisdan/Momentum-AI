      - "Identify content genres, creator archetypes, and monetization models with high potential for success in specific regions."
      - "Develop and execute localized content acquisition, promotion, and partnership strategies to drive rapid market penetration."
    reference_patterns:
      - "High search volume for specific content types in a target region with low local content supply."
      - "Successful content formats from other regions showing early traction in the target market."
      - "Regulatory changes opening new opportunities or imposing new constraints on content distribution."
      - "Emergence of local creator talent pools with high potential for platform growth."
    decision_logic:
