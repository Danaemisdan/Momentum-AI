      - "Real-time telemetry indicating unusual load patterns on specific services or regions."
      - "Predictive models forecasting significant viewership increases for upcoming content releases."
      - "Cost analysis revealing inefficiencies in current resource allocation."
      - "Latency or availability degradation reports during peak times."
    decision_logic:
      - "IF (predicted_resource_demand > current_capacity_threshold) THEN (trigger automated resource provisioning)."
      - "IF (cost_efficiency_metric < target) THEN (initiate resource reallocation optimization)."
      - "IF (latency_spike_prediction > threshold) THEN (pre-warm CDN caches or reroute traffic)."
    actions:
      - "Access global infrastructure monitoring and telemetry systems."
      - "Run predictive models (e.g., time-series forecasting, deep learning) on historical and real-time data."
      - "Interface with cloud orchestration platforms to provision/deprovision virtual machines, storage, and network resources."
      - "Adjust CDN configurations and traffic routing rules."
    verification:
