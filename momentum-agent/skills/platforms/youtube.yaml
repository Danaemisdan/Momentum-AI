      - "Develop and deploy natural language processing (NLP) and computer vision models for entity and relationship extraction."
      - "Interact with graph database APIs (e.g., Neo4j, JanusGraph) to update and query the knowledge graph."
      - "Design schema evolution mechanisms for the knowledge graph to accommodate new knowledge types."
    verification:
