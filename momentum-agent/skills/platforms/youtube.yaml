  - name: "synthesize_cross_modal_threat_indicators_from_live_stream_comments_and_visuals"
    trigger_roles:
      - "Cross-Modal Information Synthesis & Transduction Architect"
    strategy:
      - "Monitor real-time live streams for emergent patterns across chat, audio, and visual content."
      - "Identify and correlate anomalous cross-modal signals indicative of potential platform abuse or harmful content."
      - "Generate a consolidated, prioritized threat intelligence report for immediate action."
    reference_patterns:
      - "Spike in specific keywords/phrases in chat coinciding with unusual visual cues (e.g., rapid scene changes, obscured objects)."
      - "Discrepancy between audio sentiment and visual content (e.g., positive audio over negative/disturbing visuals)."
      - "Repetitive, coordinated chat messages across multiple concurrent streams."
      - "Unusual metadata changes or stream title/description updates during live broadcast."
    decision_logic:
      - "IF (chat_keyword_density > threshold AND visual_anomaly_score > threshold) THEN trigger_cross_modal_alert."
      - "IF (audio_sentiment_divergence_score > threshold AND visual_content_flagged) THEN escalate_for_human_review."
      - "IF (coordinated_chat_pattern_detected AND multiple_streams_affected) THEN initiate_platform_wide_threat_assessment."
    actions:
      - "API_CALL: youtube.liveStream.getChatMessages(streamId, interval)"
      - "API_CALL: youtube.liveStream.getVisualFrames(streamId, interval)"
      - "API_CALL: youtube.liveStream.getAudioTranscript(streamId, interval)"
      - "INTERNAL_SYSTEM_ACTION: generate_cross_modal_threat_report(correlation_data, priority_level)"
      - "INTERNAL_SYSTEM_ACTION: push_alert_to_security_ops_dashboard(report_id)"
    verification:
