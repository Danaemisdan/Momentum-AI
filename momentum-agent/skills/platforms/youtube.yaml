      - "Propose tailored monetization strategies (e.g., optimal ad placement, merchandise integration, channel memberships) to maximize creator revenue."
      - "Evaluate the impact of new monetization features on creator earnings and platform revenue, adjusting pricing models as needed."
    reference_patterns:
      - "Creators with high engagement but low ad revenue due to suboptimal ad formats or placement."
      - "Audience segments with high propensity for channel memberships or merchandise purchases not being targeted."
      - "Discrepancies between content value and creator earnings in specific niches."
      - "Underutilization of new monetization features by eligible creators."
    decision_logic:
      - "IF (creator_revenue_potential_gap > threshold) THEN (flag creator for optimization recommendation)."
      - "IF (new_feature_adoption_rate < target) THEN (initiate targeted creator outreach)."
      - "IF (monetization_feature_ROI < expected) THEN (re-evaluate pricing or feature design)."
    actions:
