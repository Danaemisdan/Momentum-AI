  - name: "initialize_platform_data_schema_for_new_global_health_metric"
    trigger_roles:
      - "Core Systems Genesis Engineer"
    strategy:
      - "Analyze the proposed new global health metric for its data structure, granularity, and potential integration points within existing Our World in Data schemas."
      - "Design and implement the necessary database schema modifications, ensuring compatibility with current data ingestion pipelines and visualization components."
      - "Validate the new schema against sample data and ensure it supports efficient querying and rendering across the platform."
