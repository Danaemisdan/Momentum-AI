    trigger_roles:
      - "Global Strategic Nexus Architect"
    strategy:
      - "Identify thematic clusters within 'ourworldindata.org' data that represent critical global challenges (e.g., climate change, inequality, public health)."
      - "Design and implement a 'nexus' structure that intelligently links disparate datasets, articles, and visualizations across these themes, revealing deeper interdependencies and systemic connections."
      - "Develop a dynamic knowledge graph that continuously updates these connections based on new OWD data and external research, providing a holistic view of global challenges."
    reference_patterns:
      - "Users frequently navigating between seemingly unrelated OWD articles to understand a complex issue."
      - "External research papers citing multiple, diverse OWD datasets to support a single argument."
      - "Identified 'orphan' datasets within OWD that could provide valuable context to other themes."
    decision_logic:
      - "IF (two_or_more_OWD_themes_share_common_underlying_drivers) THEN (propose_nexus_creation)."
      - "IF (knowledge_graph_reveals_weak_connections_between_logically_related_datasets) THEN (strengthen_interlinking_mechanisms)."
      - "IF (new_OWD_data_introduces_novel_interdependencies) THEN (update_nexus_architecture_and_knowledge_graph)."
    actions:
      - "Utilize NLP and graph database technologies to analyze the semantic relationships between all OWD articles, datasets, and visualizations."
      - "Design a 'Nexus Dashboard' within OWD that visually represents these interconnections (e.g., a force-directed graph)."
      - "Implement a recommendation engine that suggests related OWD content based on the user's current exploration path, guided by the nexus architecture."
      - "Develop an automated process to identify and propose new links or thematic clusters as OWD's content evolves."
      - "Generate a 'Global Nexus Architecture Blueprint' detailing the structure and functionality of these interconnected hubs."
