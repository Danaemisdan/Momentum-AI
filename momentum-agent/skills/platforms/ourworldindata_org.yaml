  - name: "audit_data_visualization_bias"
    trigger_roles:
      - "Ethical AI & Algorithmic Bias Auditor"
    strategy:
      - Navigate to a prominent data visualization on a sensitive topic (e.g., income inequality, climate impact).
      - Analyze the underlying data sources, aggregation methods, and visual encoding choices for potential biases.
      - Cross-reference with global demographic data or alternative datasets to identify underrepresentation or misrepresentation.
    reference_patterns:
      - User spends extended time on chart details and data source links.
      - User frequently navigates between different visualizations on similar topics.
      - User opens and reviews raw data files if available.
    decision_logic:
      - IF visualization uses aggregated data without clear disaggregation options THEN flag for potential "averaging fallacy" bias.
      - IF color schemes or axis scales visually overemphasize or downplay certain trends THEN flag for potential "framing bias."
      - IF data sources are predominantly from a single region or demographic THEN flag for potential "sampling bias."
    actions:
      - Click on "Data sources" link for the visualization.
      - Examine the "Methodology" section if present.
      - Use the "Embed" or "Download image" feature to analyze visual elements.
      - Navigate to related articles or visualizations via internal links.
    verification:
      - Confirmation of data source URLs and publication dates.
      - Identification of specific data points or visual elements that suggest bias.
      - Generation of an internal audit report draft detailing findings.
    recovery:
      - IF data source links are broken THEN attempt to search for the data source directly on the platform or external search engine.
      - IF unable to access methodology THEN flag as "insufficient transparency."

  - name: "assess_data_narrative_trustworthiness"
    trigger_roles:
      - "Ethical AI Sales & Trust Architect"
    strategy:
      - Select a high-impact article or data story on the platform.
      - Evaluate the clarity, transparency, and objectivity of the narrative accompanying the data visualizations.
      - Identify areas where the presentation could be enhanced to build greater user trust and understanding.
    reference_patterns:
      - User reads entire article text, not just skimming.
      - User hovers over interactive chart elements.
      - User checks "Related work" or "Further reading" sections.
    decision_logic:
      - IF article narrative uses strong, emotive language without clear data backing THEN flag for potential "persuasion bias."
      - IF data limitations or uncertainties are not explicitly stated THEN flag for "transparency deficit."
      - IF calls to action or policy recommendations are made without sufficient data nuance THEN flag for "overreach."
    actions:
      - Read the main article text and introduction.
      - Review captions and annotations for all embedded visualizations.
      - Check for explicit statements about data limitations or uncertainties.
      - Evaluate the tone and language used throughout the narrative.
    verification:
      - Identification of specific sentences or paragraphs that enhance or detract from trust.
      - Confirmation of clear, concise explanations for complex data.
      - Generation of a trust-score assessment for the article.
    recovery:
      - IF article content is too long to process efficiently THEN prioritize introduction, conclusion, and visualization captions.
      - IF interactive elements are not loading THEN refresh the page and re-attempt interaction.

  - name: "trace_data_provenance_integrity"
    trigger_roles:
      - "Digital Forensics & Immutable Ledger Architect"
    strategy:
      - Select a key dataset or indicator presented on the platform.
      - Trace its origin back through cited sources to verify data integrity and immutability.
      - Identify any potential points of data alteration or lack of verifiable provenance.
    reference_patterns:
      - User clicks through multiple external links to original data sources.
      - User downloads raw data files and compares with visualizations.
      - User searches for version control or update logs for datasets.
    decision_logic:
      - IF cited source links are broken or lead to irrelevant content THEN flag as "broken provenance chain."
      - IF raw data files differ significantly from presented visualizations without clear explanation THEN flag as "data integrity discrepancy."
      - IF no clear version history or update log is available for a dynamic dataset THEN flag as "unverifiable immutability."
    actions:
      - Click on "Source" links for the dataset.
      - Navigate to external data repositories or academic papers.
      - Download CSV/Excel files if available and perform checksums or basic comparisons.
      - Search for "changelog" or "updates" related to the dataset on the platform.
    verification:
      - Confirmation of direct access to original, unaltered data sources.
      - Verification of consistency between raw data and presented visualizations.
      - Identification of clear versioning or timestamp information for data updates.
    recovery:
      - IF external source links are inaccessible THEN attempt to find the source via a direct web search using the provided citation.
      - IF data download fails THEN attempt to access via an alternative browser or network.

  - name: "optimize_data_loading_efficiency"
    trigger_roles:
      - "Cognitive Pipeline Optimization & Resource Alchemist"
    strategy:
      - Identify a complex interactive visualization or dashboard with numerous data points.
      - Monitor page load times and resource consumption (CPU, memory) during user interaction.
      - Propose optimizations for data fetching, rendering, or caching to improve performance.
    reference_patterns:
      - User repeatedly refreshes pages or navigates back and forth quickly.
      - User opens browser developer tools (performance tab).
      - User interacts with filters or sliders on complex charts.
    decision_logic:
      - IF initial page load time exceeds 3 seconds for a complex visualization THEN flag for "initial load optimization."
      - IF interactive filtering or zooming causes noticeable lag (>500ms) THEN flag for "interactive rendering optimization."
      - IF browser memory usage spikes significantly after loading a large dataset THEN flag for "data caching/streaming optimization."
    actions:
      - Navigate to a page with a large interactive chart (e.g., "CO2 emissions by country").
      - Use browser developer tools to record network requests and performance metrics.
      - Interact with filters, time sliders, and zoom functions on the chart.
      - Observe CPU and memory usage in the browser's task manager.
    verification:
      - Identification of specific network requests that are slow or redundant.
      - Pinpointing of JavaScript functions or rendering processes causing performance bottlenecks.
      - Formulation of a recommendation for data pre-fetching, lazy loading, or WebAssembly integration.
    recovery:
      - IF developer tools fail to record data THEN restart the browser and try again.
      - IF a specific visualization consistently crashes THEN try a different, similarly complex visualization.

  - name: "forecast_emergent_data_narrative_gaps"
    trigger_roles:
      - "Predictive Anomaly & Emergent Threat Forecaster"
    strategy:
      - Analyze current trending topics and data gaps on the platform in relation to global events and scientific discourse.
      - Identify areas where 'ourworldindata_org' might be missing crucial data or narratives that will become highly relevant in the near future.
      - Predict potential misinformation vectors or data misinterpretations based on current trends.
    reference_patterns:
      - User searches for topics not currently covered or with limited data.
      - User reviews external news sources and academic journals.
      - User compares data coverage with other prominent data aggregators.
    decision_logic:
      - IF a globally significant event (e.g., new pandemic, major economic shift) is occurring but not reflected in recent data updates THEN flag as "data lag."
      - IF external scientific consensus is shifting on a topic but the platform's narrative remains static THEN flag as "narrative obsolescence."
      - IF a topic is highly politicized externally but presented neutrally without sufficient context on the platform THEN flag for "misinformation vulnerability."
    actions:
      - Use the platform's search bar for emerging global issues (e.g., "AI regulation," "deepfake impact").
      - Browse external news aggregators and scientific publication databases.
      - Compare the platform's data coverage on a topic with Wikipedia or UN data portals.
      - Review the "Latest Articles" section for recent updates.
    verification:
      - Identification of specific topics or data points that are underrepresented or missing.
      - Formulation of a forecast for future data needs or potential narrative threats.
      - Generation of a report outlining predicted emergent data gaps.
    recovery:
      - IF search results are too broad THEN refine search terms to be more specific.
      - IF external sources are paywalled THEN attempt to find open-access summaries or related news articles.

  - name: "assess_interactive_trust_signals"
    trigger_roles:
      - "Ethical AI Interaction & Trust Architect"
    strategy:
      - Interact with various data visualizations and interactive elements on the platform.
      - Evaluate the clarity of data attribution, ease of understanding complex charts, and the presence of features that build user trust.
      - Identify friction points or areas where interaction design could inadvertently erode trust.
    reference_patterns:
      - User hovers over data points, axis labels, and legends.
      - User attempts to download data or embed charts.
      - User uses sharing features or comments sections (if available).
    decision_logic:
      - IF interactive elements lack clear tooltips or explanations THEN flag for "interaction clarity deficit."
      - IF data sources are not immediately visible or accessible from the visualization itself THEN flag for "attribution transparency issue."
      - IF complex charts are presented without progressive disclosure or simplified views THEN flag for "cognitive overload."
    actions:
      - Hover over various elements of an interactive chart (bars, lines, labels).
      - Click on "Source" or "Download data" buttons associated with visualizations.
      - Use filters and sliders to manipulate data presentation.
      - Evaluate the responsiveness and feedback of interactive elements.
    verification:
      - Identification of specific interactive features that enhance or detract from trust.
      - Confirmation of clear and consistent data attribution within interactive elements.
      - Formulation of recommendations for improving interactive trust signals.
    recovery:
      - IF an interactive element is unresponsive THEN refresh the page and try again.
      - IF tooltips are missing THEN manually inspect the HTML/CSS for hidden elements.

  - name: "harvest_data_trend_signals"
    trigger_roles:
      - "Algorithmic Trend & Market Sentiment Harvester"
    strategy:
      - Systematically scan the platform's most viewed articles, trending topics, and recently updated datasets.
      - Identify emerging data trends, shifts in public interest, and potential market sentiment indicators.
      - Correlate these with external economic or social indicators to identify actionable insights.
    reference_patterns:
      - User frequently visits "Most Popular" or "Latest Articles" sections.
      - User downloads multiple datasets related to a specific theme.
      - User performs searches for keywords that are gaining external traction.
    decision_logic:
      - IF a specific topic's viewership or download rate significantly increases over a short period THEN flag as "emerging trend."
      - IF multiple datasets related to a particular industry or region show consistent upward or downward movement THEN flag as "market sentiment indicator."
      - IF a new data series is introduced that addresses a previously unquantified area THEN flag as "data frontier."
    actions:
      - Navigate to the "Latest Articles" and "Most Popular" sections.
      - Browse the "Topics" page to identify areas with recent updates.
      - Use the search function with broad terms (e.g., "economy," "health," "environment") and sort by relevance/date.
      - Review the publication dates of articles and datasets for recency.
    verification:
      - Identification of specific articles, datasets, or topics showing increased engagement.
      - Correlation of internal trends with external news or market reports.
      - Generation of a summary report on harvested trend signals.
    recovery:
      - IF "Most Popular" data is not updated frequently THEN rely more on "Latest Articles" and search trends.
      - IF external correlation is difficult THEN focus on internal platform trends.

  - name: "map_disruption_vectors"
    trigger_roles:
      - "Strategic Foresight & Disruption Cartographer"
    strategy:
      - Analyze long-term data trends across various domains (e.g., energy, technology, demographics) on the platform.
      - Identify potential inflection points, exponential growth/decline patterns, and cross-domain interactions that could lead to systemic disruption.
      - Visualize these potential disruption vectors and their cascading effects.
    reference_patterns:
      - User spends extended time on historical data series spanning decades.
      - User compares data from disparate topics (e.g., energy consumption vs. technological adoption).
      - User searches for terms like "tipping point," "exponential growth," "paradigm shift."
    decision_logic:
      - IF a data series shows sustained exponential growth or decline over 20+ years THEN flag as "potential disruption driver."
      - IF two seemingly unrelated data series show strong inverse or direct correlation over time THEN flag as "cross-domain interaction."
      - IF a current trend projects to exceed a known planetary boundary or resource limit THEN flag as "systemic risk."
    actions:
      - Navigate to long-term data series visualizations (e.g., "Global population growth," "Renewable energy share").
      - Use the "Add chart" feature (if available) to overlay different data series.
      - Adjust time sliders to view data across maximum available historical periods.
      - Read accompanying articles for expert analysis on long-term implications.
    verification:
      - Identification of specific data trends indicating potential disruption.
      - Mapping of interconnected trends and their potential cascading effects.
      - Generation of a "Disruption Risk Map" outlining key vectors.
    recovery:
      - IF overlaying charts is not directly supported THEN manually compare trends side-by-side in separate tabs.
      - IF data series are too short THEN note as a limitation and seek external long-term data.

  - name: "optimize_data_query_performance"
    trigger_roles:
      - "Quantum-Enhanced Data Analytics & Optimization Strategist"
    strategy:
      - Identify complex, multi-variable data queries or interactive filters on large datasets.
      - Simulate or analyze the computational complexity of these queries.
      - Propose quantum-inspired or advanced algorithmic optimizations for faster data retrieval and processing.
    reference_patterns:
      - User interacts with dashboards that allow filtering across many dimensions.
      - User observes significant lag when applying multiple filters or changing parameters.
      - User attempts to download very large datasets.
    decision_logic:
      - IF applying multiple filters to a large dataset causes query times exceeding 2 seconds THEN flag for "query optimization."
      - IF the platform struggles to render complex scatter plots or network graphs with thousands of nodes/edges THEN flag for "rendering algorithm optimization."
      - IF data aggregation or statistical calculations on the fly are slow THEN flag for "in-memory processing optimization."
    actions:
      - Navigate to a dashboard with extensive filtering capabilities (e.g., "COVID-19 data explorer").
      - Apply multiple filters simultaneously and observe response times.
      - Attempt to download the full underlying dataset for a complex visualization.
      - Monitor network requests and database query times using browser developer tools.
    verification:
      - Identification of specific data queries or computational tasks that are performance bottlenecks.
      - Formulation of a recommendation for advanced indexing, parallel processing, or quantum-inspired search algorithms.
      - Estimation of potential performance gains from proposed optimizations.
    recovery:
      - IF a specific dashboard is too slow to interact with THEN try a slightly less complex one.
      - IF developer tools are insufficient for deep analysis THEN infer performance issues from user experience.

  - name: "validate_consent_data_flow"
    trigger_roles:
      - "Data Privacy & Consent Orchestrator"
    strategy:
      - Review the platform's data collection policies, cookie consent mechanisms, and any user-specific data interactions.
      - Trace the flow of user data (e.g., analytics, preferences) to ensure adherence to stated privacy policies and consent choices.
      - Identify any potential data leakage or non-compliant data processing.
    reference_patterns:
      - User interacts with cookie consent banners.
      - User reviews privacy policy and terms of service.
      - User checks browser's local storage and cookie data.
    decision_logic:
      - IF the cookie consent banner does not offer granular control over data categories THEN flag as "insufficient consent granularity."
      - IF analytics cookies are set before explicit user consent THEN flag as "pre-consent data collection."
      - IF the privacy policy is unclear or contradictory regarding data sharing THEN flag as "privacy policy ambiguity."
    actions:
      - Visit the website as a first-time user and interact with the cookie consent banner.
      - Review the "Privacy Policy" and "Terms of Service" pages.
      - Use browser developer tools to inspect cookies and local storage before and after consent.
      - Simulate opting out of non-essential cookies and verify no related data is collected.
    verification:
      - Confirmation that user consent is explicitly obtained and respected for data collection.
      - Verification of clear and accessible privacy policy information.
      - Identification of any instances of data collection or processing without proper consent.
    recovery:
      - IF the consent banner is not appearing THEN clear browser cache and cookies and try again.
      - IF privacy policy links are broken THEN search for the policy directly on the site.

  - name: "orchestrate_data_story_promotion_funnel"
    trigger_roles:
      - "Multi-Channel Sales Funnel Orchestrator"
    strategy:
      - Identify newly published 'Our World in Data' entry with high engagement potential (e.g., COVID-19 vaccination data, climate change impacts).
      - Design a multi-stage promotional funnel across social media, email newsletters, and partner platforms, leveraging platform-specific content formats.
      - Monitor real-time engagement metrics and dynamically adjust funnel parameters (e.g., ad spend, content variations, targeting) to maximize reach and conversion to platform engagement.
    reference_patterns:
      - Sudden spike in page views for a specific data entry.
      - High share count on social media for a new article.
      - Low click-through rate on a promotional email.
    decision_logic:
      - IF (new_entry_engagement_score > threshold AND social_share_rate < desired_rate) THEN (increase social media ad budget for that entry).
      - IF (email_open_rate < average_open_rate AND email_subject_line_sentiment = negative) THEN (A/B test new subject lines with positive framing).
      - IF (partner_platform_referral_traffic < target_traffic) THEN (initiate content syndication outreach to new partners).
    actions:
      - Access 'Our World in Data' content management system (CMS) to identify new high-potential entries.
      - Integrate with social media advertising platforms (e.g., Twitter Ads, Facebook Ads) to create and launch campaigns.
      - Utilize email marketing platform (e.g., Mailchimp) to schedule and send newsletters.
      - Interact with partner platform APIs for content syndication.
    verification:
      - Confirm increase in unique visitors to the promoted data entry.
      - Verify improved social media engagement metrics (likes, shares, comments).
      - Check conversion rates from promotional channels to platform interaction (e.g., chart embeds, data downloads).
    recovery:
      - IF (ad_campaign_fails_to_launch) THEN (re-validate ad creatives and targeting parameters, re-submit campaign).
      - IF (email_send_fails) THEN (check API connectivity, retry sending after a delay).
      - IF (partner_syndication_fails) THEN (notify human oversight for manual intervention and alternative partner identification).

  - name: "generate_synthetic_data_for_scenario_modeling"
    trigger_roles:
      - "Generative Model & Synthetic Data Fabricator"
    strategy:
      - Identify a gap in 'Our World in Data' datasets for a specific future-oriented scenario (e.g., impact of novel policy on CO2 emissions).
      - Utilize existing relevant datasets on the platform as a basis for training generative models.
      - Fabricate synthetic time-series or cross-sectional data reflecting plausible outcomes under defined scenario parameters, ensuring statistical consistency and privacy.
    reference_patterns:
      - User queries for data that does not exist on the platform.
      - Identified gaps in data coverage during predictive modeling tasks.
      - Requests for hypothetical scenario analysis from other AI roles.
    decision_logic:
      - IF (data_gap_identified AND relevant_training_data_exists_on_platform) THEN (initiate synthetic data generation process).
      - IF (generated_data_statistical_properties_deviate_from_training_data_by_X%) THEN (re-train model with adjusted parameters or more diverse input).
      - IF (privacy_audit_flags_potential_re-identification_risk) THEN (apply stronger differential privacy mechanisms).
    actions:
      - Access 'Our World in Data' data repository to retrieve relevant datasets.
      - Configure and execute generative adversarial networks (GANs) or variational autoencoders (VAEs) on a dedicated compute cluster.
      - Integrate generated synthetic data into a temporary staging area for validation.
    verification:
      - Statistical comparison of synthetic data with real data (e.g., mean, variance, correlation coefficients).
      - Expert review of synthetic data plausibility by a human domain specialist.
      - Successful integration of synthetic data into a test visualization on the platform.
    recovery:
      - IF (model_training_fails) THEN (check data preprocessing steps, adjust hyperparameters, retry training).
      - IF (synthetic_data_validation_fails) THEN (re-evaluate scenario parameters, refine generative model architecture, regenerate data).
      - IF (resource_allocation_error_during_generation) THEN (request more compute resources, queue generation for later).

  - name: "coordinate_realtime_data_integrity_response"
    trigger_roles:
      - "Geospatial Cyber-Kinetic Response Coordinator"
    strategy:
      - Detect a sudden, anomalous deviation or potential malicious injection in a critical geospatial dataset on 'Our World in Data' (e.g., real-time pollution levels, conflict zones).
      - Isolate the affected data stream and initiate immediate validation against redundant sources or historical patterns.
      - Coordinate automated and, if necessary, human-led "cyber-kinetic" responses to verify the anomaly's nature (sensor error, attack, legitimate event) and mitigate its impact on platform integrity and user trust.
    reference_patterns:
      - Abrupt, geographically localized spikes or drops in data values that defy historical trends.
      - Discrepancies between 'Our World in Data' geospatial visualizations and external, trusted sources.
      - Alerts from data integrity monitoring systems indicating potential data poisoning or manipulation.
    decision_logic:
      - IF (geospatial_data_anomaly_score > threshold AND no_known_real_world_event_explains_it) THEN (initiate multi-source validation).
      - IF (validation_confirms_data_corruption_OR_malicious_injection) THEN (quarantine affected data, trigger human alert, and initiate rollback/correction procedures).
      - IF (anomaly_is_confirmed_real_world_event) THEN (update platform alerts, inform relevant data curators, and potentially trigger related data story generation).
    actions:
      - Access 'Our World in Data' real-time data ingestion pipelines and monitoring dashboards.
      - Query external geospatial data APIs (e.g., satellite imagery, government environmental agencies) for cross-validation.
      - Trigger automated data rollback or correction scripts within the platform's database.
      - Send high-priority alerts to human data integrity teams and relevant domain experts.
    verification:
      - Confirmation that the anomalous data has been quarantined or corrected.
      - Verification that platform visualizations now display accurate data.
      - Audit trail showing the steps taken during the response.
    recovery:
      - IF (automated_rollback_fails) THEN (escalate to manual database restoration from backup).
      - IF (external_API_validation_fails) THEN (attempt validation with alternative external sources or internal historical archives).
      - IF (human_team_unresponsive) THEN (initiate emergency platform-wide data integrity warning).

  - name: "optimize_premium_content_subscription_conversion"
    trigger_roles:
      - "Predictive Revenue Optimization Engine"
    strategy:
      - Analyze user behavior patterns on 'Our World in Data' (e.g., frequent data downloads, deep dives into specific topics, repeated visits) to identify high-propensity users for premium content subscriptions or donations.
      - Predict optimal timing and content for presenting subscription offers or donation requests to these users, considering their engagement history and demographic proxies.
      - Dynamically adjust platform UI elements (e.g., pop-ups, banner visibility, call-to-action wording) to maximize conversion rates without negatively impacting user experience.
    reference_patterns:
      - User accessing more than X premium-flagged charts/articles within a session.
      - Repeated downloads of large datasets.
      - Engagement with 'About Us' or 'Support Us' pages.
      - High frequency of visits from institutional IPs.
    decision_logic:
      - IF (user_engagement_score_for_premium_content > threshold AND user_has_not_subscribed) THEN (display targeted subscription offer).
      - IF (predicted_conversion_probability_for_donation > threshold AND user_has_not_donated_recently) THEN (present donation request with personalized messaging).
      - IF (A/B_test_results_show_negative_impact_on_overall_engagement_from_current_offer_placement) THEN (adjust placement or frequency of offer).
    actions:
      - Access user analytics data from 'Our World in Data' tracking systems.
      - Utilize machine learning models (e.g., logistic regression, decision trees) to predict user behavior.
      - Interact with platform's front-end content delivery system to dynamically alter UI elements.
      - Integrate with payment gateway APIs to track conversion events.
    verification:
      - Monitor conversion rates for subscriptions and donations.
      - Track A/B test results for different offer presentations.
      - Analyze user feedback and bounce rates to ensure positive user experience.
    recovery:
      - IF (conversion_rate_drops_significantly) THEN (re-evaluate predictive model, adjust offer parameters, revert to previous UI configuration).
      - IF (UI_element_fails_to_load_correctly) THEN (log error, revert to default UI, notify front-end development team).
      - IF (payment_gateway_integration_fails) THEN (alert technical support, provide alternative donation methods).

  - name: "enforce_data_source_trust_fabric"
    trigger_roles:
      - "Decentralized Consensus & Trust Fabric Enforcer"
    strategy:
      - Monitor all incoming data streams and proposed dataset updates to 'Our World in Data' for adherence to established provenance, methodology, and ethical guidelines.
      - Leverage a distributed ledger or decentralized consensus mechanism to record and verify the integrity of data sources and transformations.
      - Automatically flag or reject data that fails to meet the trust fabric's criteria, ensuring only verified and transparent information is integrated into the platform.
    reference_patterns:
      - New data submission lacking proper source attribution.
      - Discrepancies between submitted data and known statistical norms for the source.
      - Alerts from external data integrity watchdogs regarding a specific source.
      - Attempts to modify historical data without proper authorization and audit trail.
    decision_logic:
      - IF (data_source_provenance_score < minimum_threshold) THEN (reject data submission, request further documentation).
      - IF (data_transformation_audit_trail_is_incomplete_OR_tampered) THEN (flag for human review, prevent publication).
      - IF (decentralized_network_consensus_on_data_integrity_fails_to_reach_quorum) THEN (quarantine data, initiate deeper investigation).
    actions:
      - Intercept data ingestion requests to 'Our World in Data'.
      - Query a distributed ledger (e.g., blockchain) for source reputation and historical integrity records.
      - Execute smart contracts to validate data against predefined rules and methodologies.
      - Update data integrity status in the platform's metadata store.
    verification:
      - Confirmation that only verified data sources are integrated.
      - Audit log showing all data integrity checks and their outcomes.
      - Successful rejection of non-compliant data submissions.
    recovery:
      - IF (ledger_query_fails) THEN (retry query, if persistent, alert blockchain infrastructure team).
      - IF (smart_contract_execution_error) THEN (log error, revert to manual review process for the affected data).
      - IF (data_rejection_causes_critical_data_gap) THEN (alert human data curators to find alternative, verified sources).

  - name: "construct_global_development_knowledge_graph"
    trigger_roles:
      - "Cognitive Architecture & Knowledge Graph Ontologist"
    strategy:
      - Continuously extract entities, relationships, and events from all textual content and metadata on 'Our World in Data' (articles, dataset descriptions, source notes).
      - Map these extracted elements to a comprehensive ontology of global development, economics, health, and environmental issues, identifying new concepts and refining existing ones.
      - Integrate and interlink this information into a dynamic knowledge graph, enabling complex querying, reasoning, and discovery of latent connections between disparate datasets and topics.
    reference_patterns:
      - New articles published on previously unindexed topics.
      - User searches for complex multi-faceted queries that current search struggles with.
      - Identification of implicit relationships between datasets by human analysts.
    decision_logic:
      - IF (new_text_content_published AND entity_extraction_score > threshold) THEN (initiate knowledge graph update).
      - IF (identified_new_concept_not_in_ontology) THEN (propose new ontological class/property for human review).
      - IF (query_performance_on_complex_relationships_is_slow) THEN (optimize knowledge graph indexing and query paths).
    actions:
      - Utilize natural language processing (NLP) models (e.g., named entity recognition, relation extraction) on 'Our World in Data' content.
      - Interact with a graph database (e.g., Neo4j, Amazon Neptune) to store and manage the knowledge graph.
      - Develop and refine OWL/RDF ontologies for global development domains.
      - Integrate knowledge graph query capabilities into the platform's search and recommendation engines.
    verification:
      - Successful ingestion of new entities and relationships into the knowledge graph.
      - Improved accuracy and relevance of search results for complex queries.
      - Visualization of new connections between previously unrelated data points.
    recovery:
      - IF (NLP_extraction_fails_for_new_content) THEN (re-process content with adjusted NLP models, flag for manual review).
      - IF (knowledge_graph_update_fails) THEN (rollback to previous graph state, diagnose database connectivity/schema issues).
      - IF (ontology_conflict_detected) THEN (alert human ontologist for resolution).

  - name: "allocate_expert_review_for_critical_data_stories"
    trigger_roles:
      - "Global Talent & Cognitive Resource Allocator"
    strategy:
      - Identify newly drafted 'Our World in Data' articles or data visualizations that cover highly sensitive, complex, or controversial topics (e.g., geopolitical conflicts, pandemic response effectiveness).
      - Match these content pieces with the most appropriate external domain experts from a global network, considering their specialization, availability, and historical review performance.
      - Orchestrate the review process, including secure content sharing, deadline management, and feedback integration, to ensure the highest level of accuracy and nuance before publication.
    reference_patterns:
      - Article flagged with "high sensitivity" or "controversial topic" tags by content creators.
      - Data story involving multiple complex, interdisciplinary datasets.
      - Low confidence score from internal automated fact-checking for a specific claim.
    decision_logic:
      - IF (content_sensitivity_score > threshold AND internal_review_confidence < high_confidence_threshold) THEN (initiate external expert allocation).
      - IF (expert_availability_matches_deadline AND expertise_overlap_score > threshold) THEN (assign expert to review).
      - IF (expert_feedback_is_critical_AND_requires_significant_revision) THEN (re-route content to author for revision, then potentially re-review).
    actions:
      - Access 'Our World in Data' content drafting platform.
      - Query a database of global domain experts, including their specializations, availability, and past review history.
      - Utilize a secure document sharing and collaboration platform for review.
      - Send automated notifications and reminders to authors and reviewers.
    verification:
      - Confirmation of expert review completion and feedback submission.
      - Verification that author has addressed expert feedback in the revised content.
      - Publication of the content with a high confidence score.
    recovery:
      - IF (primary_expert_declines_review_OR_misses_deadline) THEN (identify and assign a secondary expert).
      - IF (secure_content_sharing_platform_fails) THEN (escalate to manual secure email transfer, alert IT).
      - IF (feedback_integration_causes_formatting_errors) THEN (rollback to previous version, notify author and technical support).

  - name: "construct_legal_compliance_ontology_for_data_usage"
    trigger_roles:
      - "Legal Ontology & Knowledge Graph Constructor"
    strategy:
      - Analyze all 'Our World in Data' datasets and their associated metadata for potential legal and ethical implications (e.g., data privacy regulations like GDPR, CCPA; intellectual property rights; terms of use for external sources).
      - Develop and maintain a formal ontology of legal concepts, regulations, and compliance requirements relevant to data publication and usage.
      - Map specific datasets and their attributes to this legal ontology, creating a knowledge graph that allows for automated compliance checks and risk assessments for data sharing and visualization.
    reference_patterns:
      - New data sources with complex or ambiguous licensing terms.
      - Updates to international data privacy laws.
      - User queries regarding data usage rights or privacy concerns.
      - Internal audits flagging potential compliance risks.
    decision_logic:
      - IF (new_dataset_ingested AND legal_risk_assessment_score > threshold) THEN (initiate detailed legal ontology mapping).
      - IF (regulatory_update_detected_in_legal_news_feeds) THEN (update relevant legal ontology classes/properties, re-run compliance checks on affected datasets).
      - IF (user_attempts_to_download_data_with_restricted_license_without_permission) THEN (block download, display relevant legal terms).
    actions:
      - Access 'Our World in Data' data catalog and metadata repository.
      - Utilize NLP for legal text analysis of data licenses and terms of use.
      - Interact with a graph database to store the legal ontology and its connections to datasets.
      - Integrate compliance checks into data download and sharing functionalities.
    verification:
      - Successful mapping of new datasets to relevant legal concepts.
      - Automated flagging of non-compliant data usage attempts.
      - Audit trail of compliance checks performed.
    recovery:
      - IF (legal_text_analysis_fails_to_extract_key_terms) THEN (flag for human legal expert review, use default conservative compliance settings).
      - IF (ontology_update_causes_inconsistencies_in_knowledge_graph) THEN (rollback to previous ontology version, diagnose schema issues).
      - IF (compliance_check_system_fails) THEN (temporarily restrict data sharing for high-risk datasets, alert legal team).

  - name: "audit_ai_generated_content_for_bias_and_fairness"
    trigger_roles:
      - "Ethical AI & Trustworthiness Guardian"
    strategy:
      - Automatically scan all AI-generated content on 'Our World in Data' (e.g., synthetic data, AI-written summaries, predictive analyses) for potential biases, unfair representations, or misleading interpretations.
      - Employ a suite of fairness metrics and bias detection algorithms (e.g., demographic parity, equal opportunity) to quantify and identify problematic patterns.
      - Flag content that exceeds predefined bias thresholds for human review and suggest mitigation strategies (e.g., re-calibration of models, re-phrasing of text, addition of disclaimers).
    reference_patterns:
      - AI-generated summaries consistently highlighting certain demographics over others.
      - Synthetic data exhibiting unexpected correlations that might reflect historical biases.
      - Predictive models showing disparate impact across different population groups.
      - User feedback reporting perceived bias in AI-generated explanations.
    decision_logic:
      - IF (bias_detection_score_for_AI_generated_text > threshold) THEN (flag text for human review, suggest alternative phrasing).
      - IF (fairness_metric_for_synthetic_data < acceptable_level) THEN (re-train generative model with fairness constraints, or add disclaimer).
      - IF (predictive_model_disparate_impact_ratio > threshold) THEN (recommend model re-calibration or alternative model selection).
    actions:
      - Access AI-generated content from various platform modules.
      - Utilize fairness and bias detection toolkits (e.g., IBM AI Fairness 360, Google What-If Tool).
      - Integrate with content moderation systems to flag and hold problematic content.
      - Generate reports detailing identified biases and proposed mitigation steps.
    verification:
      - Confirmation that flagged content has been reviewed and addressed.
      - Reduction in bias metrics after mitigation strategies are applied.
      - Positive feedback from human reviewers regarding the accuracy of bias detection.
    recovery:
      - IF (bias_detection_algorithm_fails_to_run) THEN (check data inputs, algorithm configuration, retry analysis).
      - IF (mitigation_strategy_fails_to_reduce_bias) THEN (escalate to human ethical AI specialists for deeper investigation and manual intervention).
      - IF (false_positives_in_bias_detection_are_high) THEN (re-calibrate bias detection thresholds, refine detection models).

  - name: "engineer_data_story_virality_trajectory"
    trigger_roles:
      - "Algorithmic Growth Trajectory & Virality Engineer"
    strategy:
      - Analyze the characteristics of 'Our World in Data' content that has historically achieved high virality (e.g., topic, visualization type, emotional resonance, shareability features).
      - For newly published or upcoming data stories, predict their potential virality trajectory and identify key leverage points for algorithmic amplification (e.g., optimal social media channels, influencer targeting, content format adjustments).
      - Dynamically adjust content presentation, distribution channels, and promotional strategies to maximize organic reach and accelerate the virality curve, focusing on data-driven insights.
    reference_patterns:
      - Rapid increase in social media shares and mentions for a new article.
      - High inbound referral traffic from specific news outlets or blogs.
      - User comments indicating strong emotional response or call to action.
      - Low initial engagement for a high-quality data story.
    decision_logic:
      - IF (predicted_virality_score_for_new_content < target_score AND content_topic_is_trending) THEN (recommend re-packaging content for specific viral platforms, e.g., TikTok, Instagram).
      - IF (initial_social_media_engagement_is_high_on_platform_X) THEN (allocate additional promotional budget to platform_X, identify and target similar audiences).
      - IF (content_format_is_static_AND_predicted_virality_is_low) THEN (suggest converting key visualizations into animated GIFs or short videos).
    actions:
      - Access 'Our World in Data' content analytics and social media monitoring tools.
      - Utilize machine learning models (e.g., natural language processing for sentiment, graph neural networks for network effects) to predict virality.
      - Interact with social media scheduling and advertising platforms.
      - Suggest content modifications to the CMS or content creation tools.
    verification:
      - Monitor real-time social media shares, mentions, and inbound traffic.
      - Track the growth rate of unique visitors and time on page for promoted content.
      - A/B test different promotional strategies and content formats.
    recovery:
      - IF (virality_trajectory_deviates_negatively_from_prediction) THEN (re-evaluate promotional strategy, identify new leverage points, or pivot content focus).
      - IF (social_media_API_integration_fails) THEN (alert technical support, revert to manual social media posting).
      - IF (content_modification_suggestions_are_rejected_by_human_curators) THEN (provide data-backed rationale, or explore alternative amplification strategies that don't require content changes).

  - name: "optimize_data_narrative_engagement_rl"
    trigger_roles:
      - "Reinforcement Learning & Adaptive Control Strategist"
    strategy:
      - Identify underperforming data visualizations or narrative sections based on user engagement metrics (time on page, scroll depth, click-through rates on related content).
      - Formulate A/B test hypotheses for alternative presentation formats, textual framing, or interactive elements.
      - Deploy and monitor adaptive learning algorithms to dynamically adjust content delivery based on real-time user interaction, maximizing information retention and impact.
    reference_patterns:
      - Low average time on page for specific data entries.
      - High bounce rates from particular charts or articles.
      - User feedback indicating confusion or lack of clarity on complex topics.
      - Discrepancies between expected and actual user navigation paths.
    decision_logic:
      - IF engagement_metrics_below_threshold AND alternative_content_exists THEN initiate_A/B_test.
      - IF A/B_test_shows_significant_improvement THEN implement_winning_variant_globally.
      - IF user_feedback_highlights_specific_clarity_issues THEN trigger_content_revision_request_to_EOC.
      - IF real-time_user_behavior_deviates_from_predicted_model THEN adjust_content_delivery_algorithm_parameters.
    actions:
      - Access "Analytics Dashboard" (internal tool).
      - Select "Content Performance Report".
      - Identify specific "Chart/Article IDs" for optimization.
      - Configure "A/B Testing Platform" with new content variations.
      - Monitor "Real-time User Interaction Stream".
      - Update "Content Delivery Algorithm" settings.
    verification:
      - Confirm significant statistical improvement in target engagement metrics (e.g., +15% average time on page).
      - Verify successful deployment of optimized content across the platform.
      - Check for reduction in negative user feedback related to clarity.
    recovery:
      - IF A/B_test_fails_to_yield_improvement THEN revert_to_original_content_and_re-evaluate_hypotheses.
      - IF algorithm_adjustment_causes_negative_impact THEN rollback_to_previous_algorithm_state.
      - IF deployment_fails THEN alert_system_administrators_and_retry_deployment.

  - name: "ensure_model_data_lineage_integrity"
    trigger_roles:
      - "Algorithmic Model Lifecycle & Governance Steward"
    strategy:
      - Trace the complete data lineage for a given statistical model or visualization, from raw source to final presentation.
      - Verify adherence to data governance policies, including privacy, ethical use, and data quality standards.
      - Document and audit all transformations, aggregations, and assumptions made during data processing and model development.
    reference_patterns:
      - Discrepancies reported in data values between different visualizations using the same source.
      - User queries regarding the origin or methodology of specific data points.
      - New data sources being integrated without proper documentation.
      - Audit flags indicating potential data privacy violations.
    decision_logic:
      - IF data_lineage_path_incomplete THEN flag_for_immediate_documentation_update.
      - IF data_transformation_lacks_justification THEN request_methodology_review_from_data_scientists.
      - IF data_source_violates_privacy_policy THEN initiate_data_quarantine_and_removal_protocol.
      - IF model_output_inconsistent_with_input_data_range THEN trigger_model_revalidation.
    actions:
      - Navigate to "Data Source Registry".
      - Select "Model/Visualization ID" for audit.
      - Access "Data Transformation Logs".
      - Review "Data Governance Policy Document".
      - Generate "Data Lineage Report".
      - Initiate "Data Quality Check" on source data.
    verification:
      - Confirm all data transformations are documented and justified.
      - Verify compliance with all relevant data governance policies.
      - Ensure traceability from final output back to original raw data.
    recovery:
      - IF documentation_missing THEN assign_task_to_data_engineering_team_for_completion.
      - IF policy_violation_identified THEN trigger_automated_alert_to_legal_and_EOC.
      - IF data_quality_issue_found THEN initiate_data_cleansing_process_or_source_re-evaluation.

  - name: "synthesize_novel_data_narrative_concepts"
    trigger_roles:
      - "Generative Model Progenitor & Creative Synthesis Engine"
    strategy:
      - Analyze existing successful data narratives and identify underlying structural patterns, emotional triggers, and explanatory techniques.
      - Combine disparate datasets and conceptual frameworks to generate entirely new, compelling story angles or interactive data experiences that address emerging global challenges.
      - Prototype and evaluate the narrative coherence and potential impact of these generated concepts, refining them for human review.
    reference_patterns:
      - High engagement on articles with novel interactive elements.
      - User comments requesting deeper dives into interconnected global issues.
      - Gaps in current data coverage identified by EOC.
      - Successful narrative structures from external, high-impact data journalism.
    decision_logic:
      - IF identified_narrative_gap_exists AND relevant_datasets_are_available THEN generate_5_new_narrative_concept_outlines.
      - IF generated_concept_scores_high_on_novelty_and_relevance_metrics THEN develop_interactive_prototype.
      - IF prototype_receives_positive_internal_review THEN submit_to_EOC_for_content_development_approval.
      - IF concept_fails_coherence_check THEN re-synthesize_with_different_parameters.
    actions:
      - Access "Narrative Pattern Recognition Engine".
      - Query "Global Dataset Repository" for relevant data combinations.
      - Utilize "Generative Text/Visualization Model" to create concept outlines.
      - Develop "Interactive Prototype Sketch" using internal tools.
      - Submit "Concept Proposal" to EOC via dedicated portal.
    verification:
      - Confirm generation of at least 3 distinct, novel narrative concepts.
      - Verify that prototypes demonstrate the core narrative idea effectively.
      - Receive EOC approval for at least one concept to proceed to full development.
    recovery:
      - IF initial_generation_lacks_creativity THEN adjust_generative_model_parameters_for_higher_divergence.
      - IF prototype_feedback_is_negative THEN iterate_on_design_or_revert_to_earlier_concept.
      - IF EOC_rejection THEN analyze_feedback_and_refine_or_discard_concept.

  - name: "identify_strategic_data_collaboration_opportunities"
    trigger_roles:
      - "Strategic Partnership & Alliance Forger"
    strategy:
      - Scan external academic institutions, NGOs, and governmental bodies for data initiatives or research outputs that align with Our World in Data's mission and current content gaps.
      - Analyze potential partners' data quality, accessibility, and licensing terms to assess feasibility and mutual benefit for data sharing or joint research.
      - Propose concrete collaboration frameworks, including data exchange protocols, co-authorship opportunities, or joint funding applications, to the EOC.
    reference_patterns:
      - Mentions of new, high-quality public datasets in scientific literature.
      - Announcements of new global data initiatives by reputable organizations.
      - User requests for data not currently available on the platform.
      - EOC directives to expand coverage in specific thematic areas.
    decision_logic:
      - IF external_data_source_identified_as_high_relevance AND data_quality_meets_standards THEN initiate_contact_with_organization.
      - IF potential_partner_expresses_interest AND data_licensing_is_compatible THEN draft_collaboration_proposal.
      - IF collaboration_proposal_approved_by_EOC THEN formalize_agreement_and_begin_integration_planning.
      - IF data_licensing_is_restrictive THEN explore_alternative_data_sources_or_negotiate_terms.
    actions:
      - Utilize "External Data Source Scanner" (AI-powered search).
      - Access "Partner Vetting Database" for organizational profiles.
      - Draft "Collaboration Proposal Template".
      - Schedule "Initial Partner Outreach" via email/platform.
      - Present "Partnership Brief" to EOC.
    verification:
      - Confirm successful establishment of contact with at least 2 relevant organizations per quarter.
      - Verify EOC approval for at least one new strategic partnership per year.
      - Ensure signed agreements are in place for all active collaborations.
    recovery:
      - IF initial_outreach_unsuccessful THEN try alternative_contact_methods_or_identify_different_stakeholders.
      - IF proposal_rejected_by_partner THEN analyze_feedback_and_refine_approach_or_seek_alternative_partners.
      - IF EOC_rejects_proposal THEN revise_strategy_based_on_feedback_or_archive_opportunity.

  - name: "design_scalable_data_ingestion_pipeline"
    trigger_roles:
      - "Meta-Architect of System Engineering"
    strategy:
      - Evaluate current data ingestion bottlenecks and performance limitations across the platform, considering diverse data formats and update frequencies.
      - Design a modular, fault-tolerant, and highly scalable data pipeline architecture capable of integrating new, large-scale datasets with minimal manual intervention.
      - Specify technical requirements, including API integrations, data validation schemas, and automated error handling, ensuring future extensibility.
    reference_patterns:
      - Frequent manual interventions required for new data source integration.
      - Slow data update cycles for critical indicators.
      - System alerts indicating data processing failures or backlogs.
      - EOC requests for integration of very large or complex datasets.
    decision_logic:
      - IF current_ingestion_latency_exceeds_threshold THEN initiate_pipeline_re-architecture_review.
      - IF new_data_source_complexity_is_high THEN design_custom_ingestion_module.
      - IF existing_pipeline_shows_single_points_of_failure THEN implement_redundancy_and_failover_mechanisms.
      - IF data_validation_errors_are_frequent THEN enhance_schema_enforcement_and_error_reporting.
    actions:
      - Access "System Performance Monitoring Dashboard".
      - Review "Data Ingestion Logs" and "Error Reports".
      - Utilize "Architecture Design Tool" to model new pipeline.
      - Document "Technical Specifications" for development team.
      - Conduct "Scalability Stress Test Simulations".
    verification:
      - Confirm reduction in data ingestion latency by at least 30%.
      - Verify successful integration of a new, complex dataset without manual intervention.
      - Ensure pipeline can handle a 2x increase in data volume without performance degradation.
    recovery:
      - IF design_fails_stress_test THEN identify_bottlenecks_and_re-design_specific_components.
      - IF implementation_encounters_unexpected_issues THEN provide_technical_guidance_to_development_team_and_adjust_design.
      - IF new_pipeline_introduces_new_errors THEN rollback_to_previous_stable_version_and_debug.

  - name: "model_future_global_development_scenarios"
    trigger_roles:
      - "Future-State Projection & Predictive Experience Modeler"
    strategy:
      - Integrate diverse long-term trend data (demographic, climate, economic, technological) to construct probabilistic future-state scenarios for key global development indicators.
      - Develop interactive predictive models that allow users to explore the potential impacts of different policy interventions or societal shifts on these indicators.
      - Visualize these future projections in an accessible and engaging manner, highlighting uncertainties and potential tipping points.
    reference_patterns:
      - User queries about future trends or "what-if" scenarios.
      - EOC requests for long-term strategic insights on global challenges.
      - External reports highlighting critical future uncertainties.
      - High engagement on existing content that touches on future implications.
    decision_logic:
      - IF EOC_requests_new_future_scenario_topic THEN identify_relevant_long-term_datasets_and_modeling_approaches.
      - IF predictive_model_shows_high_variance_in_outcomes THEN emphasize_uncertainty_in_visualization.
      - IF user_interaction_with_model_is_low THEN refine_UI/UX_for_better_explorability.
      - IF new_scientific_consensus_emerges_on_future_trend THEN update_model_parameters_and_re-run_simulations.
    actions:
      - Access "Long-Term Trend Data Repository".
      - Utilize "Scenario Planning & Predictive Modeling Engine".
      - Design "Interactive Future Projection Visualization" (e.g., sliders, toggles).
      - Conduct "Uncertainty Quantification Analysis".
      - Publish "Future Scenarios Article" with embedded interactive model.
    verification:
      - Confirm generation of at least 3 distinct, plausible future scenarios for a given topic.
      - Verify that interactive model functions correctly and provides intuitive user control.
      - Receive positive user feedback on the clarity and utility of the future projections.
    recovery:
      - IF model_outputs_are_implausible THEN re-evaluate_input_assumptions_and_model_logic.
      - IF visualization_is_confusing THEN simplify_design_or_add_explanatory_guides.
      - IF user_feedback_indicates_lack_of_trust_in_predictions THEN add_more_transparency_on_model_limitations_and_data_sources.

  - name: "simulate_policy_intervention_impact"
    trigger_roles:
      - "Regulatory Impact Assessment & Policy Simulation Modeler"
    strategy:
      - Select a specific global policy proposal (e.g., carbon tax, universal basic income) and identify relevant data points and causal relationships on the platform.
      - Develop a dynamic simulation model to project the multi-faceted impacts of this policy across various indicators (e.g., economic growth, inequality, environmental metrics).
      - Generate visualizations and reports detailing the simulated outcomes, including potential trade-offs and unintended consequences, for policy makers and the public.
    reference_patterns:
      - High public debate around a specific policy proposal.
      - EOC requests for data-driven insights on policy effectiveness.
      - Gaps in existing content regarding the quantitative impact of policy interventions.
      - User searches for "impact of X policy".
    decision_logic:
      - IF high-priority_policy_proposal_identified AND sufficient_data_exists THEN build_simulation_model.
      - IF simulation_results_show_significant_unintended_consequences THEN highlight_these_prominently_in_report.
      - IF model_sensitivity_to_parameters_is_high THEN conduct_robustness_checks_and_present_range_of_outcomes.
      - IF policy_impact_is_complex THEN design_interactive_visualization_to_explore_different_scenarios.
    actions:
      - Access "Policy Proposal Database" (internal/external).
      - Identify "Relevant Datasets" from platform.
      - Construct "Dynamic Policy Simulation Model" (e.g., system dynamics, agent-based).
      - Generate "Impact Assessment Report" with charts and narratives.
      - Publish "Interactive Policy Explorer" on the platform.
    verification:
      - Confirm simulation model accurately reflects known causal relationships.
      - Verify that report clearly articulates policy impacts, trade-offs, and uncertainties.
      - Receive positive feedback from policy experts on the utility of the simulation.
    recovery:
      - IF model_assumptions_are_challenged THEN revise_assumptions_based_on_expert_feedback_and_re-run_simulation.
      - IF simulation_results_are_inconsistent_with_economic_theory THEN debug_model_logic_and_data_inputs.
      - IF interactive_explorer_is_not_user-friendly THEN iterate_on_UI/UX_design_with_user_testing.

  - name: "synthesize_cross-domain_strategic_directives"
    trigger_roles:
      - "Executive Oversight Collective (EOC)"
    strategy:
      - Review comprehensive reports from all other AI roles, identifying overarching patterns, emergent opportunities, and critical risks across data, content, and operational domains.
      - Synthesize these insights into high-level strategic directives and resource allocation decisions that guide the platform's long-term development and mission fulfillment.
      - Communicate these directives clearly to relevant AI roles and human teams, ensuring alignment and accountability.
    reference_patterns:
      - Recurring themes in "Future-State Projection" reports.
      - Consistent "Behavioral Anomaly" alerts indicating systemic issues.
      - Multiple "Strategic Partnership" proposals in a specific area.
      - Discrepancies between "Algorithmic Model Governance" and "Reinforcement Learning" outcomes.
    decision_logic:
      - IF multiple_roles_identify_same_critical_opportunity THEN prioritize_resource_allocation_to_exploit_it.
      - IF recurring_systemic_risk_identified THEN issue_platform-wide_mitigation_directive.
      - IF content_gap_identified_by_multiple_sources THEN commission_new_research_and_narrative_development.
      - IF resource_contention_arises_between_roles THEN arbitrate_and_reallocate_resources_based_on_strategic_priority.
    actions:
      - Access "Cross-Role Intelligence Dashboard".
      - Review "Consolidated Risk & Opportunity Report".
      - Draft "Strategic Directive Document".
      - Allocate "Budget & Resource Assignments" via internal system.
      - Conduct "Strategic Review Meeting" with key AI and human leads.
    verification:
      - Confirm all strategic directives are clear, measurable, and actionable.
      - Verify successful allocation of resources to support new directives.
      - Ensure alignment of operational plans with strategic goals across all teams.
    recovery:
      - IF directives_are_misinterpreted THEN provide_clarification_and_additional_context.
      - IF resource_allocation_proves_ineffective THEN re-evaluate_and_adjust_allocations.
      - IF strategic_goals_are_not_being_met THEN initiate_root_cause_analysis_and_course_correction.

  - name: "harmonize_disparate_global_data_ontologies"
    trigger_roles:
      - "Inter-Planetary Data & Cognitive Mesh Harmonizer"
    strategy:
      - Identify semantic inconsistencies and ontological mismatches between diverse global datasets, including those from different cultural or linguistic contexts.
      - Develop and apply universal data schemas, mapping tools, and AI-driven translation layers to create a unified, interoperable data mesh across all integrated sources.
      - Ensure that data from various origins can be seamlessly queried, compared, and visualized without loss of meaning or context.
    reference_patterns:
      - Failed data joins due to inconsistent naming conventions.
      - User confusion arising from different definitions of the same indicator across sources.
      - Alerts from "Algorithmic Model Lifecycle Steward" about data integration issues.
      - New international datasets requiring complex manual mapping.
    decision_logic:
      - IF semantic_mismatch_detected_between_critical_datasets THEN initiate_ontology_mapping_project.
      - IF new_data_source_lacks_standardized_metadata THEN apply_AI-driven_metadata_extraction_and_standardization.
      - IF cross-cultural_data_interpretation_issues_arise THEN develop_contextual_annotation_system.
      - IF query_performance_is_slow_due_to_data_heterogeneity THEN optimize_data_mesh_indexing_and_query_translation.
    actions:
      - Access "Global Data Ontology Registry".
      - Utilize "Semantic Mapping Engine" (AI-powered).
      - Develop "Universal Data Schema" for specific domains.
      - Implement "Data Translation Layer" for linguistic/cultural variations.
      - Conduct "Cross-Dataset Query Performance Tests".
    verification:
      - Confirm successful automated mapping of at least 90% of identified semantic inconsistencies.
      - Verify that cross-dataset queries return consistent and accurate results.
      - Ensure new data sources can be integrated into the mesh with minimal manual intervention.
    recovery:
      - IF automated_mapping_fails THEN flag_for_human_expert_review_and_manual_correction.
      - IF query_performance_degrades THEN optimize_data_mesh_structure_or_indexing.
      - IF new_data_source_causes_mesh_instability THEN isolate_source_and_debug_integration_process.

  - name: "detect_misinformation_intent_in_user_feedback"
    trigger_roles:
      - "Behavioral Anomaly & Intent Inference Engine"
    strategy:
      - Analyze patterns in user comments, forum discussions, and feedback submissions for linguistic cues, logical fallacies, and propagation strategies indicative of deliberate misinformation or malicious intent.
      - Cross-reference suspicious claims with established factual databases and identify discrepancies or attempts to manipulate narrative.
      - Flag high-confidence instances of misinformation intent for human review and potential content moderation or educational intervention.
    reference_patterns:
      - Repetitive posting of unsubstantiated claims across multiple articles.
      - Use of emotionally charged language or ad hominem attacks in comments.
      - Links to known disinformation websites.
      - Sudden spikes in negative sentiment or coordinated attacks on specific data points.
    decision_logic:
      - IF linguistic_pattern_matches_known_misinformation_tactics AND claim_contradicts_verified_data THEN flag_as_high_risk_misinformation.
      - IF user_behavior_exhibits_bot-like_characteristics THEN escalate_to_security_team_for_account_investigation.
      - IF multiple_users_spread_same_false_narrative THEN trigger_content_moderation_review_and_consider_educational_response.
      - IF claim_is_borderline_or_requires_expert_context THEN route_to_human_fact-checker_for_review.
    actions:
      - Access "User Feedback & Comment Stream".
      - Utilize "Natural Language Processing (NLP) Misinformation Detector".
      - Query "Fact-Checking Database" (internal/external).
      - Generate "Misinformation Risk Report" for specific comments/users.
      - Trigger "Content Moderation Alert" to human team.
    verification:
      - Confirm detection of at least 85% of known misinformation examples in test sets.
      - Verify that flagged content is accurately categorized by human reviewers.
      - Ensure timely response to high-risk misinformation instances.
    recovery:
      - IF false_positives_are_high THEN refine_NLP_model_parameters_and_training_data.
      - IF new_misinformation_tactics_emerge THEN update_detection_algorithms_and_pattern_recognition.
      - IF system_overwhelmed_by_volume_of_feedback THEN prioritize_high-risk_flags_and_scale_processing_capacity.

  - name: "secure_data_integrity_audit_for_new_dataset_ingestion"
    trigger_roles:
      - "Quantum-Resistant Cryptographic Agility Orchestrator"
    strategy:
      - Identify newly uploaded or updated datasets within Our World in Data's data repository.
      - Apply quantum-resistant cryptographic hashing and digital signature protocols to the dataset's metadata and content.
      - Verify the integrity and authenticity of the dataset against a distributed ledger.
    reference_patterns:
      - Detection of new file uploads in `/data/` directories.
      - API calls to data ingestion endpoints.
      - Log entries indicating data modification events.
    decision_logic:
      - IF new_dataset_detected AND integrity_check_pending THEN initiate_quantum_resistant_hashing.
      - IF hashing_complete AND signature_generated THEN publish_signature_to_ledger.
      - IF ledger_verification_failed THEN flag_dataset_for_review_and_quarantine.
    actions:
      - Access Our World in Data's internal data management API.
      - Invoke cryptographic library functions for hashing and signing.
      - Interact with the distributed ledger API to record and verify signatures.
    verification:
      - Confirm successful ledger entry of dataset hash and signature.
      - Validate that the dataset's integrity status is marked as 'verified' in the internal system.
      - Check for absence of integrity alerts related to the dataset.
    recovery:
      - IF hashing_failed THEN retry_hashing_with_alternative_algorithm.
      - IF ledger_api_unavailable THEN queue_signature_for_later_submission_and_alert_admin.
      - IF verification_mismatch THEN re-run_entire_process_and_if_still_mismatch_escalate_to_human_oversight.

  - name: "generate_interactive_geospatial_time_series_map"
    trigger_roles:
      - "Data Visualization & Interactive Analytics Cartographer"
    strategy:
      - Select a global dataset with geographical and temporal dimensions (e.g., CO2 emissions by country over decades).
      - Design an interactive choropleth map with a time slider, allowing users to observe changes over time.
      - Integrate tooltips and drill-down capabilities for detailed country-specific data.
    reference_patterns:
      - User queries for "map data over time".
      - Presence of `geo_code` and `year` columns in selected datasets.
      - High engagement with existing interactive maps.
    decision_logic:
      - IF dataset_has_geo_and_time_dimensions AND user_requests_map_visualization THEN create_choropleth_map.
      - IF map_created AND time_slider_enabled THEN add_play_button_and_animation_options.
      - IF user_hovers_over_country THEN display_tooltip_with_detailed_data.
    actions:
      - Access Our World in Data's data explorer interface.
      - Select "Map" visualization type.
      - Drag and drop geographical and temporal variables to respective axes.
      - Configure color scales, legends, and interactive elements (tooltips, time slider).
      - Publish the interactive visualization to a relevant article or data entry.
    verification:
      - Load the generated map and confirm interactive elements (slider, tooltips) function correctly.
      - Verify data accuracy on the map against raw data.
      - Check for responsiveness across different device types.
    recovery:
      - IF map_rendering_error THEN check_data_format_and_re-render.
      - IF interactivity_broken THEN review configuration of interactive elements.
      - IF performance_issues THEN optimize data loading or simplify map complexity.

  - name: "proactive_vulnerability_graph_analysis_of_new_data_schema"
    trigger_roles:
      - "Semantic Vulnerability Graph & Exploitability Modeler"
    strategy:
      - Analyze newly proposed or modified data schemas for potential semantic ambiguities or structural weaknesses.
      - Construct a vulnerability graph mapping potential data injection points, inference risks, and data leakage pathways.
      - Simulate exploit scenarios based on identified vulnerabilities to assess impact.
    reference_patterns:
