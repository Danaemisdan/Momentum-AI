      - "Frequent interaction with the 'Data Explorer' and 'Chart Builder' to understand existing data structures."
      - "Reviewing API endpoints and data export formats."
    decision_logic:
      - "IF new metric requires a new top-level entity THEN create a new database table."
      - "IF new metric is a sub-component of an existing entity THEN add new columns to the relevant table."
      - "IF new metric has temporal or geographical dimensions THEN ensure appropriate indexing and foreign key relationships."
    actions:
      - "Access internal database schema management interface."
      - "Define new table/column structures, data types, and constraints."
      - "Generate SQL DDL scripts for schema modification."
      - "Run schema validation tests with mock data."
      - "Update data ingestion pipeline configuration to recognize new schema."
      - "Verify new metric appears correctly in a test instance of the 'Data Explorer'."
    verification:
