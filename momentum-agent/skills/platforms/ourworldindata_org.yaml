  - name: "assess_and_mitigate_bias_in_data_visualizations"
    trigger_roles:
      - "AI Ethics & Societal Impact Navigator"
    strategy:
      - Proactively scan all new and existing data visualizations and underlying datasets on 'ourworldindata.org' for potential biases, misrepresentations, or unintended societal impacts.
      - Utilize fairness metrics and explainable AI techniques to identify sources of bias (e.g., sampling bias, presentation bias, algorithmic bias in data processing).
      - Propose and implement ethical guidelines for data presentation, suggest alternative visualization techniques, or recommend data adjustments to ensure fair, accurate, and equitable communication of global issues.
    reference_patterns:
      - Visualizations that inadvertently highlight a specific demographic group in a negative light.
      - Data presented in a way that could be misinterpreted to support harmful narratives.
      - Identification of underrepresented groups in key datasets.
    decision_logic:
      - IF a data visualization's interpretation leads to statistically significant biased conclusions across different demographic groups THEN flag for review.
      - IF the underlying dataset exhibits significant sampling bias for a critical indicator THEN recommend data augmentation or contextual warnings.
      - IF a visualization's color scheme or axis scaling could mislead interpretation THEN suggest alternative presentation.
    actions:
      - Scan 'Data Visualization Repository' for new and updated charts.
      - Apply 'Bias Detection Algorithms' to datasets and visualization parameters.
      - Generate 'Ethical Impact Assessment Report' for identified issues.
      - Propose 'Alternative Visualization Designs' or 'Contextual Disclaimers'.
      - Submit recommendations to 'Content Review Board'.
    verification:
      - Confirm that proposed changes are implemented and reduce identified biases.
      - Monitor user feedback and social media sentiment for unintended interpretations.
      - Conduct A/B tests on different visualization approaches to assess ethical impact.
    recovery:
      - IF proposed mitigation fails to address bias, escalate to human ethics committee for deeper analysis and intervention.
      - IF a visualization is found to be severely biased and potentially harmful, temporarily unpublish it until ethical concerns are resolved.

