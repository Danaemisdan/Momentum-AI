intents:

- name: "Explore Data by Topic"
    strategy:
      - "Identify the user's interest in a broad subject area."
      - "Locate the primary navigation or a dedicated section for topic browsing."
      - "Select the most relevant topic to access related data and insights."
    reference_patterns:
      - "The user initiates exploration by selecting a specific topic from the main navigation or a dedicated topic list. This action directs them to a page detailing data and insights related to that chosen subject."
      - "A user seeking information on a particular global issue might utilize the 'Browse by topic' button to reveal a comprehensive list, then select a relevant topic like 'Poverty' or 'Climate Change' to delve deeper."
      - "Looking for a general overview of a subject, I'd click on a category name in the main menu."
    decision_logic:
      - "IF user intent is to explore a general subject, THEN navigate to the 'Topics' section."
      - "IF a specific topic is mentioned, THEN search for that topic within the available list."
      - "IF no specific topic, THEN present a list of popular topics."
    actions:
      - "Click 'Topics' in the main navigation."
      - "Click on the desired topic (e.g., 'Poverty', 'Climate Change')."
    verification:
      - "Verify that the URL reflects the chosen topic."
      - "Confirm that the page content is relevant to the selected topic."
    recovery:
      - "If the page is incorrect, navigate back and re-select the topic."
      - "If the topic is not found, use the search bar instead."
  - name: "Search for Specific Data or Articles"
    strategy:
      - "Identify keywords or specific data points the user is looking for."
      - "Locate the search input field on the platform."
      - "Input the query and analyze the search results for relevance."
    reference_patterns:
      - "The intent to locate particular information is fulfilled by inputting keywords into the search bar. The system then presents relevant charts, topic pages, or data explorers."
      - "A user with a specific query, such as 'Life expectancy in Nigeria', would type this into the search input field and then review the resulting charts or topic pages."
      - "When I know exactly what I'm looking for, I'll use the search bar."
    decision_logic:
      - "IF user provides specific keywords or a phrase, THEN use the search bar."
      - "IF search results are not satisfactory, THEN refine the search query."
      - "IF search results include relevant charts or topic pages, THEN navigate to them."
    actions:
      - "Type query into the search input field."
      - "Press Enter or click the search button."
    verification:
      - "Check if search results are displayed."
      - "Verify that the results are relevant to the query."
    recovery:
      - "If no results, rephrase the query and search again."
      - "If irrelevant results, try more specific keywords."
  - name: "Stay Updated with Latest Content"
    strategy:
      - "Identify the user's desire for recent information or updates."
      - "Locate sections or indicators for new articles or data updates."
      - "Access the latest content to review recent changes."
    reference_patterns:
      - "Users can access the most recent articles and data updates by navigating to the 'Insights' section or by directly engaging with the prominently displayed 'NEW ARTICLE' and 'DATA UPDATE' cards."
      - "To see what's new, a user might scroll through the recent articles on the homepage or click 'See all updates' to view a dedicated feed of the latest data and insights."
      - "I want to know what's been added recently, so I'll look for 'latest' or 'new' sections."
    decision_logic:
      - "IF user wants to see new content, THEN look for 'Insights' or 'Latest updates'."
      - "IF 'NEW ARTICLE' or 'DATA UPDATE' cards are visible, THEN prioritize clicking them."
      - "IF a dedicated 'See all updates' link exists, THEN navigate to that page."
    actions:
      - "Click on 'Insights' in the navigation."
      - "Click on a 'NEW ARTICLE' or 'DATA UPDATE' card."
      - "Click 'See all updates' link."
    verification:
      - "Confirm that the displayed content is recent based on dates."
      - "Verify that the page lists multiple new articles or updates."
    recovery:
      - "If the page doesn't show recent content, check other navigation links for 'News' or 'Blog'."
      - "If no updates are immediately visible, try refreshing the page."
  - name: "Deep Dive into Data Visualizations"
    strategy:
      - "Identify the user's interest in exploring specific data through interactive charts."
      - "Locate interactive chart buttons or links related to a particular data point."
      - "Interact with the visualization to gain deeper insights."
    reference_patterns:
      - "Engagement with data visualizations is achieved by interacting with the interactive chart buttons, which lead to detailed graphs and related explanatory content."
      - "A user interested in 'Child mortality rate' would click on the corresponding button to open an interactive chart, allowing for further exploration of the data."
      - "To understand trends or comparisons, I'd look for interactive graphs or charts."
    decision_logic:
      - "IF user wants to explore data visually, THEN look for interactive chart buttons."
      - "IF a specific data point is mentioned, THEN find the corresponding chart button."
      - "IF the chart opens, THEN interact with its features (e.g., zoom, filter)."
    actions:
      - "Click on an interactive chart button (e.g., 'Child mortality rate chart')."
      - "Interact with chart controls (e.g., sliders, dropdowns)."
    verification:
      - "Verify that an interactive chart loads successfully."
      - "Confirm that the chart displays the expected data."
    recovery:
      - "If the chart doesn't load, refresh the page or try a different browser."
      - "If the chart is not interactive, look for an alternative data explorer."
  - name: "Access Data Explorers for Custom Analysis"
    strategy:
      - "Recognize the user's need for advanced, customizable data analysis."
      - "Locate the entry point for 'Data Explorers' or similar tools."
      - "Select the appropriate explorer for the desired analysis."
    reference_patterns:
      - "For more in-depth and customizable data analysis, users can access specialized 'Data Explorers' through dedicated links, enabling them to manipulate and visualize data according to their interests."
      - "To compare energy consumption across countries, a user would navigate to 'See all our Data Explorers' and then select the 'Energy Data Explorer' to begin their custom analysis."
      - "If I need to compare multiple datasets or customize my view, I'll look for a 'Data Explorer'."
    decision_logic:
      - "IF user requires custom data manipulation, THEN navigate to 'Data Explorers'."
      - "IF a specific data domain is mentioned (e.g., 'energy'), THEN select the relevant explorer."
      - "IF the explorer loads, THEN proceed with custom analysis."
    actions:
      - "Click 'See all our Data Explorers'."
      - "Click on the desired 'Data Explorer' (e.g., 'Energy Data Explorer')."
    verification:
      - "Verify that the Data Explorer interface loads."
      - "Confirm that the explorer allows for data customization."
    recovery:
      - "If the explorer doesn't load, check internet connection or try again."
      - "If the wrong explorer is opened, navigate back and select the correct one."
  - name: "Learn About the Organization"
    strategy:
      - "Identify the user's curiosity about the platform's background and mission."
      - "Locate the 'About' section or related links."
      - "Browse the information provided to understand the organization."
    reference_patterns:
      - "Information regarding the platform's mission, team, funding, and operational details is accessible through the 'About' menu and related footer links."
      - "A new visitor wishing to understand the organization's background might click the 'About' button, then proceed to 'Read about our mission' or explore links like 'Team' and 'Funding'."
      - "To understand who is behind this data, I'd look for an 'About Us' or 'Mission' page."
    decision_logic:
      - "IF user wants to know about the organization, THEN click 'About'."
      - "IF specific information is sought (e.g., 'team', 'funding'), THEN navigate to the respective sub-page."
      - "IF the 'About' page loads, THEN read the content."
    actions:
      - "Click 'About' in the navigation or footer."
      - "Click on sub-links like 'Our Mission', 'Team', 'Funding'."
    verification:
      - "Verify that the 'About' page or a related sub-page is displayed."
      - "Confirm that the content provides information about the organization."
    recovery:
      - "If the page is not found, check other footer links for similar information."
      - "If the information is incomplete, use the search bar for specific queries about the organization."
  - name: "Support the Platform"
    strategy:
      - "Recognize the user's intention to financially support the platform."
      - "Locate prominent 'Donate' buttons or links."
      - "Initiate the donation process by clicking the appropriate element."
    reference_patterns:
      - "Users can contribute financially to the platform by engaging with the 'Donate' buttons or links, which direct them to donation pages."
      - "To support the work, a user would locate and click on the 'Donate' button in the main navigation or the 'Donate now' link in the footer."
      - "If I value the content, I'll look for a 'Donate' or 'Support Us' button."
    decision_logic:
      - "IF user expresses intent to support, THEN look for 'Donate' buttons/links."
      - "IF a 'Donate' button is found, THEN click it to proceed to the donation page."
      - "IF the donation page loads, THEN follow the instructions to complete the donation."
    actions:
      - "Click 'Donate' button in the main navigation."
      - "Click 'Donate now' link in the footer."
    verification:
      - "Verify that the user is redirected to a donation page."
      - "Confirm that the donation page provides options for contribution."
    recovery:
      - "If the donation page doesn't load, check internet connection or try again later."
      - "If multiple donation options exist, prompt the user for their preference."
  - name: "Subscribe to Updates"
    strategy:
      - "Identify the user's desire to receive regular communications."
      - "Locate the email subscription input field and submission button."
      - "Enter the email and submit the form to subscribe."
    reference_patterns:
      - "To receive regular updates, users can subscribe by entering their email address into the designated input field and submitting the subscription form."
      - "A user wanting to receive newsletters would find the 'Your email address' input field, enter their email, and then click the 'Subscribe' button."
      - "I want to get newsletters, so I'll look for an email signup form."
    decision_logic:
      - "IF user wants to subscribe, THEN find the email input field."
      - "IF email input field is found, THEN enter the provided email address."
      - "IF the 'Subscribe' button is present, THEN click it to submit."
    actions:
      - "Type email address into 'Your email address' input field."
      - "Click 'Subscribe' button."
    verification:
      - "Verify that a confirmation message for subscription is displayed."
      - "Check for an email confirmation in the provided email address inbox."
    recovery:
      - "If subscription fails, check for input errors and retry."
      - "If no confirmation, check spam folder or try subscribing again after a short delay."
  - name: "Engage on Social Media"
    strategy:
      - "Recognize the user's intent to connect via social platforms."
      - "Locate the social media icons or links, typically in the footer."
      - "Click on the desired social media icon to open the platform's profile."
    reference_patterns:
      - "Connecting with the platform on various social media channels is facilitated by clicking on the respective social media icons or links."
      - "To follow Our World in Data on social platforms, a user would click on icons such as 'X', 'Instagram', or 'Facebook' in the footer."
      - "I want to follow them on social media, so I'll look for the social icons."
    decision_logic:
      - "IF user wants to engage on social media, THEN look for social media icons."
      - "IF a specific social platform is mentioned, THEN click its corresponding icon."
      - "IF the social media page opens, THEN the engagement is successful."
    actions:
      - "Click on the 'X' (Twitter) icon."
      - "Click on the 'Instagram' icon."
      - "Click on the 'Facebook' icon."
    verification:
      - "Verify that a new tab or window opens to the respective social media profile."
      - "Confirm that the social media page belongs to Our World in Data."
    recovery:
      - "If the social media link is broken, try another social media platform."
      - "If the page doesn't load, check internet connection."
  - name: "Manage Privacy and Legal Settings"
    strategy:
      - "Identify the user's concern about privacy, cookies, or legal terms."
      - "Locate links related to 'Privacy Policy', 'Cookie Settings', or 'Legal'."
      - "Interact with these links to review or adjust settings."
    reference_patterns:
      - "Users can review privacy policies, cookie notices, and manage their cookie preferences through dedicated links, ensuring control over their data and browsing experience."
      - "Upon first visiting, a user might interact with the cookie consent buttons to 'Accept optional cookies' or 'Reject optional cookies', and can later review the 'Privacy Policy' or 'manage your cookie settings'."
      - "I want to check my privacy options or cookie settings."
    decision_logic:
      - "IF user wants to manage privacy, THEN look for 'Privacy Policy' or 'Cookie Settings' links."
      - "IF a cookie consent banner is present, THEN interact with 'Accept' or 'Reject' options."
      - "IF 'manage your cookie settings' link is available, THEN click it to customize."
    actions:
      - "Click 'Accept optional cookies' button."
      - "Click 'Reject optional cookies' button."
      - "Click 'Privacy Policy' link."
      - "Click 'manage your cookie settings' link."
    verification:
      - "Verify that the privacy policy or cookie management interface is displayed."
      - "Confirm that settings can be viewed or adjusted."
    recovery:
      - "If cookie settings are not accessible, try clearing browser cache and revisiting."
      - "If a policy page is missing, search for 'privacy' or 'terms' on the site."

  - name: "proactive_data_governance_scan"
    trigger_roles:
      - "Regulatory Foresight & Policy Synthesis Engine"
    strategy:
      - Identify newly published data series or visualizations on 'ourworldindata.org'.
      - Cross-reference new content against a dynamic database of global data privacy regulations (e.g., GDPR, CCPA) and ethical AI guidelines.
      - Generate a compliance risk assessment report for each new data asset, highlighting potential regulatory conflicts or ethical concerns.
    reference_patterns:
      - New data series added to "Data Explorer".
      - New visualizations published on topic pages.
      - Updates to existing datasets.
    decision_logic:
      - IF new_data_asset_detected THEN initiate_regulatory_scan.
      - IF scan_identifies_high_risk_flag THEN generate_alert_to_data_stewards.
      - IF scan_identifies_medium_risk_flag THEN suggest_mitigation_strategies_and_document.
    actions:
      - Navigate to "Latest Data" section.
      - Programmatically access metadata for new datasets.
      - Run NLP analysis on data descriptions and sources.
      - Generate internal compliance report.
    verification:
      - Confirmation of report generation in internal system.
      - Receipt of alert by relevant personnel.
      - Audit trail of compliance checks.
    recovery:
      - IF API_access_failed THEN retry_API_call_with_backoff.
      - IF NLP_model_error THEN log_error_and_flag_for_manual_review.

  - name: "quantum_safe_data_transmission_audit"
    trigger_roles:
      - "Algorithmic Cryptographic Resilience & Quantum-Safe Transition Architect"
    strategy:
      - Monitor all data transmission channels for 'ourworldindata.org' (e.g., API endpoints, CDN delivery).
      - Evaluate current cryptographic protocols against known quantum attack vectors and emerging quantum-safe standards.
      - Propose and simulate the integration of post-quantum cryptography (PQC) algorithms for critical data pathways.
    reference_patterns:
      - Data download requests.
      - API calls for data retrieval.
      - Website content delivery.
    decision_logic:
      - IF current_crypto_protocol_is_vulnerable_to_known_quantum_attack THEN flag_for_immediate_review.
      - IF new_PQC_standard_emerges THEN evaluate_its_applicability_to_ourworldindata.
      - IF simulation_shows_performance_degradation_with_PQC THEN recommend_alternative_PQC_or_optimization.
    actions:
      - Intercept and analyze network traffic.
      - Access server configuration files.
      - Run cryptographic strength tests.
      - Generate PQC integration proposal.
    verification:
      - Successful simulation of PQC handshake.
      - Report detailing current cryptographic posture.
      - Confirmation of PQC recommendation delivery.
    recovery:
      - IF network_traffic_capture_fails THEN reinitialize_capture_tool.
      - IF simulation_environment_error THEN restart_simulation_container.

  - name: "automated_ml_model_deployment_for_trends"
    trigger_roles:
      - "AI Lifecycle & MLOps Automation Maestro"
    strategy:
      - Identify new or significantly updated data series on 'ourworldindata.org' that are suitable for predictive modeling.
      - Automatically train and validate a baseline machine learning model (e.g., time series forecasting) on the new data.
      - Deploy the validated model to a staging environment for review and potential integration into a new interactive visualization.
    reference_patterns:
      - New "Data Explorer" entries with time-series data.
      - Significant updates to existing datasets (e.g., new years of data).
      - User requests for trend analysis on specific topics.
    decision_logic:
      - IF new_time_series_data_detected THEN initiate_model_training_pipeline.
      - IF model_validation_metrics_meet_thresholds THEN deploy_to_staging.
      - IF model_performance_degrades_on_new_data THEN trigger_retraining_or_alert_for_review.
    actions:
      - Access 'ourworldindata.org' data API.
      - Trigger automated ML pipeline (data ingestion, feature engineering, model training, validation).
      - Deploy model artifact to a designated staging server.
    verification:
      - Model performance metrics logged and accessible.
      - Model endpoint successfully deployed in staging.
      - Notification of successful deployment.
    recovery:
      - IF data_ingestion_fails THEN retry_data_fetch_with_error_logging.
      - IF model_training_fails THEN log_stack_trace_and_notify_engineer.

  - name: "proactive_content_integrity_monitoring"
    trigger_roles:
      - "Cognitive Security Orchestration & Automated Response Nexus"
    strategy:
      - Continuously scan 'ourworldindata.org' content (text, data, visualizations) for subtle anomalies, inconsistencies, or potential disinformation patterns.
      - Utilize natural language processing and image recognition to detect deviations from established factual baselines or known manipulation techniques.
      - Automatically flag suspicious content for human review and initiate a rapid response protocol if a high-severity threat is detected.
    reference_patterns:
      - Sudden, unexplained changes in data trends.
      - Discrepancies between visualization and underlying data.
      - Use of emotionally charged or misleading language in captions/text.
      - External reports of disinformation campaigns targeting similar topics.
    decision_logic:
      - IF anomaly_score_exceeds_threshold THEN flag_content_for_human_review.
      - IF multiple_anomalies_co-occur_on_same_page THEN escalate_to_critical_alert.
      - IF external_threat_intel_matches_internal_anomaly THEN initiate_automated_response_protocol.
    actions:
      - Crawl 'ourworldindata.org' content.
      - Apply NLP models for sentiment and factual consistency.
      - Apply image recognition for visualization integrity.
      - Cross-reference with external threat intelligence feeds.
      - Generate security alert.
    verification:
      - Alert successfully generated and routed.
      - Audit log of scanned content and detected anomalies.
      - Confirmation of human review initiation.
    recovery:
      - IF content_crawl_fails THEN retry_crawl_with_different_user_agent.
      - IF NLP_model_inference_error THEN revert_to_previous_model_version_and_log.

  - name: "inclusive_visualization_audit_and_remediation"
    trigger_roles:
      - "Accessibility & Inclusive Design Paragon"
    strategy:
      - Systematically audit all new and updated data visualizations on 'ourworldindata.org' for WCAG 2.1 AA compliance and broader inclusive design principles.
      - Identify specific accessibility barriers (e.g., color contrast, text alternatives, keyboard navigation, cognitive load).
      - Automatically generate alternative accessible versions or suggest concrete remediation steps for developers.
    reference_patterns:
      - New charts or maps published.
      - Updates to existing visualization components.
      - User feedback regarding accessibility issues.
    decision_logic:
      - IF color_contrast_ratio_below_threshold THEN suggest_alternative_palette.
      - IF image_lacks_alt_text THEN generate_descriptive_alt_text_proposal.
      - IF interactive_element_not_keyboard_navigable THEN flag_for_developer_fix.
    actions:
      - Programmatically access visualization DOM and SVG elements.
