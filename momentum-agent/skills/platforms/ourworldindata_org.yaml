      - "Verify that sample data for the new metric can be ingested and stored correctly."
      - "Ensure that the new metric is discoverable and queryable through the platform's internal data tools."
    recovery:
      - "IF schema modification fails THEN rollback to the previous schema version and analyze error logs."
      - "IF data ingestion fails for the new metric THEN review data pipeline configuration and schema definition for mismatches."
      - "IF query performance is degraded after schema update THEN review indexing strategies and optimize."
