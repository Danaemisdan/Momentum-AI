      - "API_CALL: edx.cloud_provider.scale_resources(compute_cluster_id, new_capacity)"
      - "API_CALL: edx.mlops_orchestrator.trigger_model_retraining(recommendation_engine_id, new_dataset_version)"
      - "API_CALL: edx.mlops_orchestrator.deploy_new_model_version(recommendation_engine_id, optimized_model_artifact)"
