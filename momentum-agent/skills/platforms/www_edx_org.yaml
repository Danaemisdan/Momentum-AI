    trigger_roles:
      - "Quantum AI & Neuromorphic Computing Pioneer"
    strategy:
      - Monitor advancements in quantum computing and neuromorphic research.
      - Identify emerging algorithms and applications with educational potential.
      - Propose new edX course topics and content modules in these cutting-edge areas.
    reference_patterns:
      - Publications in leading quantum computing journals (e.g., Nature Quantum Information, Physical Review A).
      - Announcements from quantum hardware providers (IBM Quantum, Google AI Quantum).
      - University research group breakthroughs in neuromorphic computing.
      - Patent filings in quantum AI.
    decision_logic:
      - IF (new_quantum_algorithm_demonstrates_significant_speedup_for_relevant_problem) THEN (propose_course_module_on_this_algorithm)
      - IF (neuromorphic_chip_architecture_achieves_human-level_cognitive_task) THEN (suggest_course_on_neuromorphic_programming)
      - IF (multiple_sources_confirm_a_breakthrough_in_a_specific_subfield) THEN (prioritize_course_development_in_that_subfield)
    actions:
      - Scrape academic databases and pre-print servers (e.g., arXiv).
      - Monitor news feeds from quantum computing companies and research labs.
      - Analyze research papers using NLP to extract key algorithms, applications, and prerequisites.
      - Generate a detailed course proposal document including learning objectives, target audience, and potential instructors (from existing edX partners or new contacts).
      - Present proposal to edX content development team.
    verification:
