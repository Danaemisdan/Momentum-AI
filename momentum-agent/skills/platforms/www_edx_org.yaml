  - name: "construct_legal_compliance_knowledge_graph_for_data_privacy"
    trigger_roles:
      - "Legal Ontology & Knowledge Graph Constructor"
    strategy:
      - "Ingest and parse legal documents (e.g., GDPR, CCPA, edX privacy policy, regional data protection laws) to extract entities (e.g., 'personal data', 'data subject rights') and relationships (e.g., 'requires consent for')."
      - "Build a formal legal ontology representing data privacy regulations, linking specific edX platform features and data flows to relevant legal obligations."
      - "Maintain the graph by automatically incorporating updates to legal frameworks and edX's internal policies, identifying potential compliance gaps."
    reference_patterns:
      - "New data privacy regulation enacted in a key operating region."
      - "Update to edX's internal data handling policy."
      - "Request for data access or deletion from a user."
    decision_logic:
      - "IF new_regulation_detected THEN parse_legal_text_and_extract_obligations."
      - "IF edx_feature_processes_personal_data AND no_linked_legal_basis_in_graph THEN flag_for_compliance_review."
      - "IF user_data_request_type = 'deletion' THEN query_graph_for_all_data_stores_requiring_deletion_under_applicable_laws."
    actions:
      - "API_CALL: edx_legal_document_parser.extract_entities_and_relations(document_text='GDPR_text')"
      - "API_CALL: edx_knowledge_graph_api.add_node(node_type='legal_obligation', properties={'regulation': 'GDPR', 'article': '17'})"
