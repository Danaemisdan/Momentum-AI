      - "Identify bottlenecks or inefficiencies in data ingestion, model training, or deployment stages."
      - "Automatically trigger optimization routines (e.g., hyperparameter tuning, resource scaling, pipeline refactoring) to improve performance."
    reference_patterns:
      - "Spikes in recommendation engine inference latency."
      - "Decreases in recommendation accuracy metrics (e.g., NDCG, CTR)."
      - "Increases in cloud resource consumption for ML workloads."
      - "New data schema changes impacting feature engineering."
    decision_logic:
