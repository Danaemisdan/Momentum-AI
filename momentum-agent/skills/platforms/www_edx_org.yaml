intents:

- name: "Discover Educational Content"
    strategy:
      - "Understand the user's interest in specific educational topics or general exploration."
      - "Identify keywords or categories related to the user's learning goals."
      - "Locate relevant courses, programs, or content sections on the platform."
    reference_patterns:
      - "The user initiates a search query or navigates through broad categories like 'Browse all courses' or 'Explore courses'. They might refine their search using subject or skill filters."
      - "The user explores featured or new course listings, potentially using carousel controls to view more options."
      - "The user directly accesses specific topic pages like 'Learn AI' or 'Python' to find relevant content."
    decision_logic:
      - "IF user provides specific keywords, THEN use search functionality."
      - "IF user browses broadly, THEN navigate to 'Browse all courses' or 'Explore courses'."
      - "IF user expresses interest in a specific topic, THEN look for direct topic links."
    actions:
      - "Click 'Browse all courses' or 'Explore courses'."
      - "Enter keywords into the search bar."
      - "Click on specific subject/skill filters."
    verification:
      - "Check if search results or category pages display relevant content."
      - "Verify that the page title or URL reflects the chosen topic."
    recovery:
      - "If no results, try broader search terms or navigate to a general category."
      - "If incorrect page, re-evaluate keywords and try a different navigation path."
  - name: "Enroll in Programs or Degrees"
    strategy:
      - "Identify the user's intent to find and apply for structured educational programs."
      - "Locate sections dedicated to programs and degrees."
      - "Guide the user through program exploration to the application stage."
    reference_patterns:
      - "The user navigates to 'Browse all programs' or 'Browse all degrees' to view available offerings."
      - "The user explores specific degree types such as 'Bachelor's in Business' or 'Master's in Data Science' to find suitable programs."
      - "The user reviews detailed program descriptions and then proceeds to 'Apply' for a chosen program."
    decision_logic:
      - "IF user wants to see all programs, THEN navigate to 'Browse all programs'."
      - "IF user specifies a degree type, THEN filter or search for that type."
      - "IF user is on a program detail page, THEN look for the 'Apply' button."
    actions:
      - "Click 'Browse all programs' or 'Browse all degrees'."
      - "Click on specific degree type filters."
      - "Click the 'Apply' button on a program page."
    verification:
      - "Check if the page displays a list of programs or degrees."
      - "Verify that the application form or confirmation page is loaded."
    recovery:
      - "If program list is empty, check for alternative navigation or search options."
      - "If 'Apply' button is missing, look for 'Learn More' or 'Enroll' alternatives."
  - name: "Access Executive Education"
    strategy:
      - "Recognize the user's interest in specialized executive-level training."
      - "Direct the user to the dedicated Executive Education section."
      - "Facilitate exploration and engagement with executive programs."
    reference_patterns:
      - "The user selects 'Executive Education' from the main navigation or filters to view specialized programs."
      - "The user browses through various executive education listings, potentially toggling to view more featured options."
      - "The user examines program details and then proceeds to engage with the 'Get Started' or 'Apply' actions."
    decision_logic:
      - "IF user mentions 'Executive Education', THEN navigate to that section."
      - "IF user is browsing executive programs, THEN look for 'Show More' or 'Toggle View more' options."
      - "IF user is on an executive program detail page, THEN look for 'Get Started' or 'Apply'."
    actions:
      - "Click 'Executive Education' in the navigation."
      - "Click 'Show More' or 'Toggle View more featured executive education'."
      - "Click 'Get Started' or 'Apply' on a program page."
    verification:
      - "Check if the page title or content confirms 'Executive Education' programs."
      - "Verify that the next step (e.g., inquiry form) is presented after clicking 'Get Started'."
    recovery:
      - "If 'Executive Education' link is not found, try searching for it."
      - "If 'Get Started' fails, look for 'Contact Us' or 'Request Info' alternatives."
  - name: "Manage User Account"
    strategy:
      - "Identify the user's intention to either log in or create a new account."
      - "Locate the appropriate entry points for account management."
      - "Initiate the sign-in or registration process."
    reference_patterns:
      - "The user initiates the 'Sign In' process to access their existing account."
      - "New users select 'Register for free' or 'Get started' to create a new account."
    decision_logic:
      - "IF user wants to log in, THEN click 'Sign In'."
      - "IF user wants to create an account, THEN click 'Register for free' or 'Get started'."
    actions:
      - "Click 'Sign In'."
      - "Click 'Register for free' or 'Get started'."
    verification:
      - "Check if the login form or registration form is displayed."
      - "Verify that the user is redirected to their dashboard after successful login/registration."
    recovery:
      - "If login/registration button is missing, check header or footer for alternatives."
      - "If form doesn't load, refresh the page or try a different entry point."
  - name: "Explore Career Development Resources"
    strategy:
      - "Understand the user's goal to find guidance on career paths."
      - "Locate sections offering career-related guides and resources."
      - "Navigate to specific career guides as requested."
    reference_patterns:
      - "The user navigates to 'see more Guides' to find resources on career paths like 'Become a Data Scientist'."
      - "The user explores various 'Become a...' guides to understand the steps and skills required for specific roles."
    decision_logic:
      - "IF user expresses interest in career guidance, THEN navigate to 'see more Guides'."
      - "IF user specifies a career path (e.g., 'Data Scientist'), THEN look for that specific guide."
    actions:
      - "Click 'see more Guides'."
      - "Click on a specific 'Become a...' guide link."
    verification:
      - "Check if the page displays a list of career guides."
      - "Verify that the content of the selected guide is loaded."
    recovery:
      - "If 'see more Guides' is not found, search for 'career guides' or 'career paths'."
      - "If specific guide is not found, browse the general guides section."
  - name: "Engage with the edX Community and Information"
    strategy:
      - "Identify the user's intent to connect with edX's community or access general information."
      - "Locate links to social media, informational pages, or legal documents."
      - "Navigate to the requested external or internal information source."
    reference_patterns:
      - "The user visits social media links like 'Visit our Facebook page' or 'Visit our LinkedIn page'."
      - "The user accesses informational pages such as 'About', 'News', or 'Help Center'."
      - "The user reviews legal and policy documents like 'Privacy Policy' or 'Terms of Service & Honor Code'."
    decision_logic:
      - "IF user wants social media, THEN click the respective social link."
      - "IF user wants general info, THEN click 'About', 'News', or 'Help Center'."
      - "IF user wants legal info, THEN click 'Privacy Policy' or 'Terms of Service'."
    actions:
      - "Click 'Visit our Facebook page' or 'Visit our LinkedIn page'."
      - "Click 'About', 'News', or 'Help Center'."
      - "Click 'Privacy Policy' or 'Terms of Service & Honor Code'."
    verification:
      - "Check if the new tab/window opens to the correct social media page."
      - "Verify that the informational or legal document page loads correctly."
    recovery:
      - "If link is broken, try searching for the information directly on the site."
      - "If external site doesn't load, check internet connection or try again later."
  - name: "Filter and Refine Content"
    strategy:
      - "Understand the user's need to narrow down search results or content lists."
      - "Identify available filtering mechanisms on the page."
      - "Apply selected filters to refine the displayed content."
    reference_patterns:
      - "The user applies filters such as 'Courses', 'Certificates', or 'Master's Degrees' to narrow down content."
      - "The user utilizes subject-specific filters like 'Artificial Intelligence' or 'Business Management & Strategy' to find relevant offerings."
      - "The user selects a specific 'skill' or 'subject' to focus their content exploration."
    decision_logic:
      - "IF user specifies content type, THEN click 'Courses', 'Certificates', or 'Master's Degrees' filter."
      - "IF user specifies a subject, THEN click the corresponding subject filter."
      - "IF user specifies a skill, THEN click the corresponding skill filter."
    actions:
      - "Click filter checkboxes or buttons for 'Courses', 'Certificates', 'Master's Degrees'."
      - "Click filter checkboxes or buttons for 'Artificial Intelligence', 'Business Management & Strategy'."
      - "Click on a specific 'skill' or 'subject' tag."
    verification:
      - "Check if the displayed content list updates to reflect the applied filters."
      - "Verify that the active filters are highlighted or indicated on the page."
    recovery:
      - "If filters don't apply, try clearing existing filters and re-applying."
      - "If no content after filtering, try broader filters or remove some filters."
  - name: "Navigate Site Content"
    strategy:
      - "Understand the user's intention to move between different sections or expand content."
      - "Identify common navigation elements like main menu, carousels, and 'show more' buttons."
      - "Execute the appropriate navigation action."
    reference_patterns:
      - "The user utilizes the main navigation links to move between different sections of the platform."
      - "The user interacts with carousel controls to browse through featured content or testimonials."
      - "The user uses 'Show More' or 'Toggle View more featured executive education' to expand content visibility."
    decision_logic:
      - "IF user wants to go to a different section, THEN click the main navigation link."
      - "IF user wants to see more items in a carousel, THEN click carousel controls."
      - "IF user wants to expand hidden content, THEN click 'Show More' or 'Toggle View more'."
    actions:
      - "Click main navigation links (e.g., 'Courses', 'Programs', 'Degrees')."
      - "Click left/right arrows or dots on carousels."
      - "Click 'Show More' or 'Toggle View more featured executive education'."
    verification:
      - "Check if the page URL or content changes to the new section."
      - "Verify that the carousel content shifts or new content appears after 'Show More'."
    recovery:
      - "If navigation link is broken, try using the search bar for the desired section."
      - "If carousel or 'Show More' doesn't respond, try refreshing the page."
  - name: "Adjust Site Preferences"
    strategy:
      - "Identify the user's desire to customize their site experience."
      - "Locate preference management options like privacy settings or language selectors."
      - "Interact with the controls to apply the desired preference."
    reference_patterns:
      - "The user interacts with 'Your Privacy Choices' to manage cookie settings."
      - "The user selects a language preference from the 'English\nSpanish' dropdown."
      - "The user accepts or rejects cookies via the 'Accept Cookies' or 'Reject All' buttons."
    decision_logic:
      - "IF user wants to manage privacy, THEN click 'Your Privacy Choices'."
      - "IF user wants to change language, THEN interact with the language dropdown."
      - "IF user is presented with a cookie banner, THEN click 'Accept Cookies' or 'Reject All'."
    actions:
      - "Click 'Your Privacy Choices'."
      - "Click the language dropdown and select 'Spanish' (or other language)."
      - "Click 'Accept Cookies' or 'Reject All'."
    verification:
      - "Check if the privacy settings panel opens."
      - "Verify that the site content changes to the selected language."
      - "Confirm that the cookie banner disappears after interaction."
    recovery:
      - "If privacy choices link is missing, look for 'Cookie Settings' in the footer."
      - "If language change doesn't apply, refresh the page and try again."
  - name: "Seek Support or Business Solutions"
    strategy:
      - "Understand if the user needs personal assistance or is looking for organizational solutions."
      - "Locate relevant contact, help, or business-specific links."
      - "Direct the user to the appropriate support or business inquiry page."
    reference_patterns:
      - "The user accesses 'Contact Us' or 'Help Center' for assistance."
      - "The user explores 'edX For Business' or 'Discover enterprise solutions' for organizational learning needs."
      - "The user investigates 'Partner With Us' for collaboration opportunities."
    decision_logic:
      - "IF user needs personal help, THEN click 'Contact Us' or 'Help Center'."
      - "IF user represents an organization, THEN click 'edX For Business' or 'Discover enterprise solutions'."
      - "IF user wants to collaborate, THEN click 'Partner With Us'."
    actions:
      - "Click 'Contact Us' or 'Help Center'."
      - "Click 'edX For Business' or 'Discover enterprise solutions'."
      - "Click 'Partner With Us'."
    verification:
      - "Check if the contact form, FAQ page, or business solutions page loads."
      - "Verify that the page content is relevant to support or business inquiries."
    recovery:
      - "If a link is broken, try searching for 'support' or 'business' on the site."
      - "If the page doesn't load, check internet connection or try a different browser."


  - name: "Ensure_Course_Compliance_with_Global_Accessibility_Standards"
  trigger_roles:
    - "Autonomous Regulatory Compliance Enforcer"
  strategy:
    - "Scan all new and updated course content for adherence to WCAG 2.1 AA guidelines."
    - "Cross-reference identified accessibility gaps with regional regulatory frameworks (e.g., ADA, EAA)."
    - "Generate actionable remediation reports for course authors and platform administrators."
  reference_patterns:
    - "Presence of alt-text on images."
    - "Correct heading structure in course modules."
    - "Video captions and transcripts availability."
    - "Keyboard navigability of interactive elements."
  decision_logic:
    - "IF 'alt-text' is missing on 'image' THEN 'flag_for_review'."
    - "IF 'video' is present AND 'captions' are absent THEN 'trigger_captioning_workflow'."
    - "IF 'interactive_element' is not 'keyboard_navigable' THEN 'report_to_dev_team'."
  actions:
    - "Navigate to 'www.edx.org/course/{course_id}/edit/accessibility_settings'."
    - "Initiate 'accessibility_scan' on 'course_content_editor'."
    - "Access 'course_author_dashboard' to post 'compliance_alerts'."
  verification:
    - "Confirm 'accessibility_score' update in 'course_dashboard'."
    - "Verify 'remediation_tasks' are assigned to relevant 'users'."
    - "Check 'compliance_report_generation_timestamp'."
  recovery:
    - "IF 'scan_fails' THEN 'reschedule_scan_after_1_hour'."
    - "IF 'report_delivery_fails' THEN 'retry_email_notification_to_admin'."
  
  - name: "Proactive_Threat_Surface_Analysis_of_LMS_Integrations"
  trigger_roles:
    - "AI System Security & Threat Intelligence Analyst"
  strategy:
    - "Identify all third-party integrations (e.g., LTI tools, payment gateways) within the edX platform."
    - "Perform real-time vulnerability scanning and behavioral anomaly detection on data flows to/from these integrations."
    - "Correlate findings with global threat intelligence feeds to predict potential attack vectors."
  reference_patterns:
    - "Unusual API call patterns from LTI providers."
    - "Spikes in failed login attempts originating from specific IP ranges associated with known threats."
    - "Unauthorized data access attempts on integrated services."
    - "Out-of-band communication from embedded content."
  decision_logic:
    - "IF 'API_call_rate' from 'LTI_provider_X' exceeds 'threshold_Y' AND 'origin_IP' is 'unusual' THEN 'flag_for_investigation'."
