    - "IF (data_export_volume > baseline_Y AND user_role_is_not_admin) THEN temporarily_suspend_export_privileges_and_alert_security_team."
    - "IF (SQL_injection_pattern_detected_in_query) THEN immediately_quarantine_request_and_isolate_affected_service."
