    - "Generate a cohesive visual theme (color palette, imagery, typography adjustments) that resonates with current context and edX brand guidelines."
    - "Deploy the synthesized aesthetic to the edX homepage and key landing pages to enhance user engagement and relevance."
  reference_patterns:
    - "Spikes in news mentions for specific educational fields (e.g., AI, climate change)."
    - "Seasonal holidays or academic cycles (e.g., back-to-school, summer breaks)."
    - "Performance metrics of previous aesthetic deployments (e.g., click-through rates on hero banners)."
  decision_logic:
