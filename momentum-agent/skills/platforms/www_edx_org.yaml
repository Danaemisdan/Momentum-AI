      - Identify key learner pathways, bottlenecks, and success metrics.
      - Design and render interactive, personalized data visualizations for educators and learners.
    reference_patterns:
      - High volume of learner activity logs (course progress, forum posts, quiz attempts).
      - Educator requests for student performance insights.
      - Learner feedback on course difficulty or engagement.
    decision_logic:
      - IF educator_requests_cohort_performance_view THEN generate_heat_map_of_module_completion_rates.
      - IF learner_struggles_with_specific_concept THEN visualize_alternative_learning_paths_and_resources.
