      - "IF 'diagnostic_identifies_resource_bottleneck' THEN 'trigger_resource_scaling_action'."
      - "IF 'diagnostic_identifies_model_drift' THEN 'trigger_automated_retraining_with_new_data'."
      - "IF 'optimization_improves_metrics_by_X%' THEN 'commit_pipeline_changes'."
