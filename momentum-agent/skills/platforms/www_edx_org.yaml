      - "Map these concepts to a formal ontology, identifying prerequisite knowledge and skill dependencies between courses and topics."
      - "Continuously update the knowledge graph as new courses are added or existing course content is modified, ensuring semantic consistency."
    reference_patterns:
      - "New course added to the catalog."
      - "Existing course content updated with new topics."
      - "User struggles with a course, indicating a potential prerequisite gap."
    decision_logic:
      - "IF new_course_detected THEN parse_syllabus_and_extract_concepts."
      - "IF concept_extraction_confidence_score < 0.8 THEN flag_for_manual_review_and_annotation."
      - "IF prerequisite_path_not_found_for_concept THEN search_for_related_concepts_in_ontology."
    actions:
      - "API_CALL: edx_course_catalog.get_course_details(course_id)"
      - "API_CALL: edx_nlp_service.extract_entities_and_relations(text_content='course_syllabus')"
      - "API_CALL: edx_knowledge_graph_api.add_node(node_type='concept', properties={'name': 'concept_name'})"
      - "API_CALL: edx_knowledge_graph_api.add_edge(source_node_id, target_node_id, edge_type='prerequisite_for')"
    verification:
      - "CHECK: knowledge_graph_consistency_via_SPARQL_queries."
      - "CHECK: number_of_unlinked_concepts_in_graph."
      - "CHECK: accuracy_of_prerequisite_recommendations_based_on_graph."
    recovery:
