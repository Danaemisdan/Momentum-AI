  - name: "synthesize_cross_platform_k8s_docs_for_novel_deployment_pattern"
    trigger_roles:
      - "Cross-Modal Information Synthesis & Transduction Architect"
    strategy:
      - Identify emerging deployment patterns across various cloud providers (e.g., hybrid, multi-cloud, edge) that leverage Kubernetes.
      - Extract and correlate relevant documentation, API specifications, and best practices from kubernetes.io and linked external resources.
      - Generate a consolidated, transmodal (text, diagram, code example) architectural blueprint and operational guide for the identified pattern.
    reference_patterns:
      - Frequent navigation to "Concepts", "Tasks", "Tutorials" sections.
      - Searches for terms like "hybrid cloud Kubernetes", "edge deployment", "multi-cluster federation".
      - Accessing external links to cloud provider documentation or CNCF projects.
      - Copying and pasting code snippets from examples.
    decision_logic:
      - IF new deployment pattern identified AND no existing comprehensive guide on kubernetes.io THEN initiate synthesis.
      - IF conflicting information found across sources THEN prioritize official Kubernetes documentation and recent updates.
      - IF a critical component lacks clear documentation THEN flag for further research or community engagement.
    actions:
      - Navigate to `/docs/concepts/`, `/docs/tasks/`, `/docs/tutorials/`.
      - Utilize internal search bar with advanced operators.
      - Follow external links to related CNCF project sites or cloud provider documentation.
      - Extract text, code blocks, and image URLs.
      - Generate new markdown or Mermaid diagram code for the synthesis.
    verification:
      - Confirm the generated blueprint addresses all key aspects of the novel deployment pattern.
      - Verify all referenced Kubernetes APIs and concepts are accurately cited from kubernetes.io.
      - Check for internal consistency and logical flow of the synthesized information.
    recovery:
      - IF synthesis incomplete due to missing information THEN re-initiate search with broader terms or consult community forums.
      - IF generated content fails validation THEN review individual source extractions and re-synthesize relevant sections.

  - name: "bootstrap_k8s_core_component_from_source_code_analysis"
    trigger_roles:
      - "Core Systems Genesis Engineer"
    strategy:
      - Select a critical Kubernetes core component (e.g., API server, scheduler, controller manager) for in-depth source code analysis.
      - Trace the component's initialization, configuration, and primary operational loops within the official Kubernetes GitHub repository.
      - Generate a minimal, self-contained GoLang bootstrap example demonstrating the component's fundamental functionality and interaction with other core services.
    reference_patterns:
      - Direct navigation to the "Reference" section, specifically API documentation.
      - Frequent access to the "Contribute" section, particularly "Developer Guide" and "Codebase Overview".
      - External navigation to the official Kubernetes GitHub repository.
      - Copying and modifying GoLang code examples.
    decision_logic:
      - IF a new version of Kubernetes introduces significant changes to a core component's internal workings THEN prioritize its analysis.
      - IF existing documentation for a core component is ambiguous or outdated regarding its genesis THEN initiate source code analysis.
      - IF a critical dependency for the component is not clearly defined THEN trace its import paths in the source.
    actions:
      - Navigate to `/docs/reference/kubernetes-api/`.
      - Navigate to `/docs/contribute/`.
      - Access external link to `github.com/kubernetes/kubernetes`.
      - Search within the GitHub repository for specific Go files (e.g., `cmd/kube-apiserver/apiserver.go`).
      - Extract code snippets and configuration examples.
      - Write new GoLang code for the bootstrap example.
    verification:
      - Confirm the generated GoLang example successfully compiles and executes.
      - Verify the example accurately reflects the core component's initialization logic as observed in the source.
      - Ensure the example demonstrates the intended fundamental functionality without external dependencies beyond standard Go libraries and Kubernetes client-go.
    recovery:
      - IF compilation fails THEN re-examine extracted code for syntax errors or missing imports.
      - IF execution fails or produces unexpected results THEN re-trace the component's logic in the source code and adjust the bootstrap example.

  - name: "simulate_advanced_ttp_against_k8s_security_posture"
    trigger_roles:
      - "Autonomous Adversarial TTP Emulation & Defensive Posture Fortifier"
    strategy:
      - Identify a specific advanced Threat, Tactic, or Procedure (TTP) relevant to Kubernetes (e.g., supply chain attack, container escape, privilege escalation).
      - Consult kubernetes.io security documentation and best practices to understand potential vulnerabilities and recommended mitigations.
      - Formulate a sequence of simulated actions on a test Kubernetes cluster that emulates the TTP, leveraging information from kubernetes.io to craft the attack vectors.
    reference_patterns:
      - Frequent navigation to `/docs/concepts/security/`, `/docs/tasks/administer-cluster/securing-a-cluster/`.
      - Searches for terms like "container escape", "privilege escalation", "admission controllers", "network policies".
      - Reviewing `kubectl` command examples related to security contexts, RBAC, and secrets.
      - Accessing external links to CVE databases or security research papers.
    decision_logic:
      - IF a new critical Kubernetes CVE is announced THEN prioritize TTP emulation related to that vulnerability.
      - IF existing security documentation suggests a common misconfiguration THEN design a TTP to exploit it.
      - IF a specific defensive control (e.g., Pod Security Admission) is being evaluated THEN craft TTPs to test its efficacy.
    actions:
      - Navigate to `/docs/concepts/security/pod-security-standards/`, `/docs/reference/access-authn-authz/`.
      - Extract `kubectl` commands for creating pods with specific security contexts, roles, or network policies.
      - Identify relevant API objects and their fields for crafting malicious YAML manifests.
      - Simulate interactions with the Kubernetes API (e.g., `kubectl exec`, `kubectl apply`).
      - Document the simulated attack steps and observed outcomes.
    verification:
      - Confirm the simulated TTP successfully achieves its objective (e.g., unauthorized access, data exfiltration) on the test cluster.
      - Verify that the attack vectors used are consistent with the TTP and leverage Kubernetes-specific mechanisms.
      - Document the impact and identify the specific security controls that failed or were bypassed.
    recovery:
      - IF the simulated TTP fails to achieve its objective THEN re-evaluate the attack vector and consult kubernetes.io for alternative exploitation methods or misconfigurations.
      - IF the test environment is compromised or unstable THEN reset the cluster and re-run the simulation from a known good state.

  - name: "orchestrate_realtime_k8s_event_stream_for_anomaly_detection_at_edge"
    trigger_roles:
      - "Real-time Streaming Analytics & Edge Intelligence Orchestrator"
    strategy:
      - Identify key Kubernetes event types and metrics relevant for real-time anomaly detection in edge environments (e.g., pod failures, resource exhaustion, network policy violations).
      - Consult kubernetes.io documentation for `kubectl events`, metrics APIs, and logging configurations to define data sources.
      - Design a streaming data pipeline architecture that collects, processes, and analyzes these events at the edge, integrating with Kubernetes-native observability tools.
    reference_patterns:
      - Frequent navigation to `/docs/concepts/cluster-administration/logging/`, `/docs/concepts/monitoring/`.
      - Searches for terms like "edge Kubernetes metrics", "real-time events", "anomaly detection", "Prometheus", "Fluentd".
      - Reviewing `kubectl` commands for `get events`, `top nodes`, `top pods`.
      - Accessing external links to CNCF observability projects.
    decision_logic:
      - IF an edge cluster experiences frequent, unexplained downtime THEN prioritize real-time event streaming for root cause analysis.
      - IF resource constraints at the edge necessitate highly optimized data collection THEN focus on minimal, high-value metrics and events.
      - IF a new security threat requires immediate detection THEN integrate relevant security-related events into the stream.
    actions:
      - Navigate to `/docs/concepts/cluster-administration/logging/`, `/docs/tasks/debug/debug-cluster/`.
      - Extract `kubectl` commands for retrieving events and metrics.
      - Identify relevant Kubernetes API endpoints for metrics (e.g., `/metrics`, `/stats`).
      - Design a data flow diagram for the streaming pipeline (e.g., using Mermaid syntax).
      - Propose configuration snippets for tools like Prometheus, Fluent Bit, or custom event exporters.
    verification:
      - Confirm the designed pipeline can ingest and process Kubernetes events and metrics in real-time.
      - Verify that the chosen metrics and events are sufficient for detecting specified anomalies.
      - Ensure the proposed architecture is suitable for the resource constraints and network conditions of an edge environment.
    recovery:
      - IF the proposed data collection method is too resource-intensive THEN re-evaluate event filtering and aggregation strategies based on kubernetes.io best practices.
      - IF the chosen tools lack necessary integration points THEN consult documentation for alternative Kubernetes-native observability solutions.
