    strategy:
      - "Scan all new and updated documentation on kubernetes_io for new terms, concepts, and their relationships."
      - "Integrate these new entities and relationships into the platform's universal semantic graph, ensuring consistency and resolving ambiguities."
      - "Identify and flag potential inconsistencies or redundancies in the existing ontology based on new information."
    reference_patterns:
