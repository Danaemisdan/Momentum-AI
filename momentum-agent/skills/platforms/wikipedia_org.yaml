  - name: "contextually_route_editor_queries_to_optimal_resources"
    trigger_roles:
      - "Cognitive Router & Contextual Affinity Matrix Synthesizer"
    strategy:
      - Analyze the semantic content of editor support queries (e.g., "How to cite a source?", "Article deletion policy").
      - Synthesize a contextual affinity matrix linking query topics to relevant help pages, community forums, expert editors, or automated tools.
      - Dynamically route the editor to the most appropriate and efficient resource based on their query and historical interaction patterns.
    reference_patterns:
      - High volume of repetitive questions in general help forums.
      - Editors struggling to find specific policy documents.
      - Long resolution times for common editor issues.
      - Editors abandoning help-seeking attempts.
    decision_logic:
      - IF (query_contains_keywords_related_to_citation_formatting) THEN route to "Citing Sources" help page and suggest relevant templates.
      - IF (query_mentions_specific_article_deletion_criteria) AND (user_is_new_editor) THEN route to "Article Deletion Policy" and suggest contacting a mentor.
      - IF (query_semantic_similarity_to_known_FAQ > threshold) THEN provide direct answer from FAQ knowledge base.
    actions:
      - Implement natural language understanding (NLU) for query parsing.
      - Build and maintain a knowledge graph of Wikipedia resources and policies.
      - Develop a contextual affinity scoring model.
      - Dynamically generate links or suggestions for editors.
      - Route queries to specific forums or user groups.
    verification:
      - Monitor reduction in unanswered or misrouted editor queries.
      - Track editor satisfaction with support resources.
      - Measure average time to resolution for common issues.
    recovery:
      - IF (high_misrouting_rate_for_specific_query_types) THEN refine NLU model and update affinity matrix for those topics.
      - IF (editor_feedback_indicates_resource_is_unhelpful) THEN re-evaluate resource quality and routing logic.

  - name: "autonomously_provision_scalable_wiki_infrastructure"
    trigger_roles:
      - "Intelligent Infrastructure-as-Code Synthesizer"
    strategy:
      - Monitor Wikipedia's traffic patterns, database load, and content growth to predict future infrastructure needs.
      - Synthesize and deploy Infrastructure-as-Code (IaC) configurations to automatically scale up or down server instances, database capacity, and content delivery networks (CDNs).
      - Optimize resource allocation to maintain performance and cost efficiency, anticipating peak loads (e.g., major news events).
    reference_patterns:
      - Spikes in page views or edit activity.
      - Approaching database storage limits.
      - Increased latency during peak hours.
      - Cost overruns due to over-provisioned resources.
    decision_logic:
      - IF (predicted_traffic_increase_exceeds_X%_in_next_Y_hours) THEN provision Z additional web server instances in relevant regions.
      - IF (database_write_latency > threshold) AND (disk_utilization > threshold) THEN scale up database read replicas and storage.
      - IF (CDN_cache_hit_ratio_drops_below_benchmark) THEN optimize CDN configuration for popular content.
      - IF (resource_utilization_drops_below_threshold_for_Z_hours) THEN de-provision excess instances to reduce costs.
    actions:
      - Access real-time monitoring data (traffic, CPU, memory, disk I/O).
      - Utilize cloud provider APIs (AWS, Azure, GCP) for resource provisioning.
      - Generate and apply Terraform/Ansible scripts for infrastructure changes.
      - Update CDN configurations.
    verification:
      - Monitor system performance metrics (latency, uptime, throughput).
      - Track infrastructure costs against budget.
      - Verify successful deployment of IaC changes.
    recovery:
      - IF (IaC_deployment_fails) THEN automatically rollback to previous stable configuration and alert operations team.
      - IF (performance_degradation_persists_after_scaling) THEN analyze root cause and adjust scaling parameters.

  - name: "personalize_editor_engagement_for_CLTV_maximization"
    trigger_roles:
