  strategy:
    - "Monitor recent changes for patterns indicative of vandalism (e.g., rapid deletions, insertion of offensive language, nonsensical edits)."
    - "Analyze user edit history and IP reputation for known bad actors or suspicious new accounts."
    - "Automatically revert clear vandalism and flag suspicious edits for human review."
  reference_patterns:
    - "Edits containing profanity, hate speech, or personal attacks."
    - "Mass deletion of content without justification."
    - "Insertion of irrelevant external links or spam."
    - "Rapid sequence of small, disruptive edits from a new user or anonymous IP."
