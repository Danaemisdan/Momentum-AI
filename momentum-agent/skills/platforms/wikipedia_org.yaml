    - "User interaction rates with various fundraising banner designs and placements."
    - "Sentiment analysis of user feedback related to fundraising appeals."
    - "Opt-out rates for fundraising communications."
  decision_logic:
    - "IF (user_engagement_with_fundraising_banner_is_low AND article_topic_alignment_is_high) THEN suggest_contextual_rephrasing."
    - "IF (A/B_test_shows_increased_donations_BUT_negative_sentiment_increases) THEN reject_change_and_re-evaluate_ethical_framing."
    - "IF (user_privacy_violation_risk_detected_in_data_analysis) THEN immediately_halt_process_and_alert_EOC."
