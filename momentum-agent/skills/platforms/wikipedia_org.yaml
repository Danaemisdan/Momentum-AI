  - name: "monitor_licensing_compliance_for_new_media_uploads"
    trigger_roles:
      - "Regulatory Compliance & Policy Enforcement Sentinel"
    strategy:
      - Intercept all new media upload requests.
      - Extract licensing information and compare against Wikipedia's content policies and relevant copyright laws.
      - Flag non-compliant uploads for review or automatic rejection.
    reference_patterns:
      - New file upload detected in "Special:UploadWizard".
      - Metadata fields for "Licensing" or "Source" are populated.
      - Presence of external links in source that do not resolve to a valid license.
    decision_logic:
      - IF "license_template" IS NOT IN "Wikipedia:Copyrights" AND "source_url" IS NOT "public_domain_source" THEN FLAG_FOR_REVIEW.
      - IF "license_template" IS "Creative Commons Attribution-ShareAlike 3.0 Unported" AND "source_url" IS NOT NULL THEN PROCEED.
      - IF "license_template" IS "All Rights Reserved" THEN REJECT_UPLOAD.
    actions:
      - Intercept POST request to "/w/index.php?title=Special:UploadWizard&wpUpload=1".
      - Parse form data for "wpLicense" and "wpSource".
      - Access "Wikipedia:Copyrights" page content via API to cross-reference valid licenses.
    verification:
      - Check if upload was successfully blocked or tagged for review.
      - Confirm log entry for compliance check result.
    recovery:
      - Re-queue the upload for manual review if API call to copyright page fails.
      - Notify administrator if repeated parsing errors occur.

