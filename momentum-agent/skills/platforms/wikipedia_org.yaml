  decision_logic:
    - "IF (uploaded_image_metadata_lacks_valid_license_OR_source) THEN flag_for_human_review_and_potential_removal."
    - "IF (text_content_similarity_score_to_copyrighted_source > threshold) THEN flag_for_plagiarism_review."
    - "IF (content_is_confirmed_non-compliant_after_review) THEN initiate_automated_removal_or_correction_workflow."
  actions:
