      - "Suggest specific editing tasks or collaboration opportunities to relevant editor communities."
    reference_patterns:
      - "Articles marked as 'critical' or 'high importance' with low edit activity."
      - "Discrepancies in article quality or completeness across different language Wikipedias for the same topic."
      - "Editors with specific expertise (e.g., medical, historical) who are underutilized in relevant areas."
    decision_logic:
