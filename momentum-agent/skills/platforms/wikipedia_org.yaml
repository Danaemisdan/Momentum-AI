      - Low click-through rates on "See also" or "External links" sections.
      - User feedback indicating difficulty in finding specific information within an article.
    decision_logic:
      - IF (article_bounce_rate > platform_average_bounce_rate AND article_session_duration < platform_average_session_duration) THEN (flag article for optimization).
