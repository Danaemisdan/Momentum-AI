    - "Identify optimal timing and phrasing for fundraising appeals that align with user value perception and historical donation behavior, without creating undue pressure."
    - "Develop and deploy A/B tests for ethically framed donation prompts, focusing on transparency and user choice, and measuring impact on trust metrics alongside conversion."
  reference_patterns:
