  - name: "optimize_content_relevance_feedback_loop"
    trigger_roles:
      - "Reinforcement Learning & Adaptive Control Strategist"
    strategy:
      - Identify high-traffic Wikipedia articles with high bounce rates or short average session durations.
      - Analyze user interaction patterns (scroll depth, section clicks, external link follows) within these articles.
      - Propose and A/B test modifications to article structure, section ordering, or related article suggestions to improve engagement metrics.
    reference_patterns:
