    reference_patterns:
      - "Frequent access to Notion pages tagged with 'AI-Generated' or 'Draft'."
      - "Creation of new 'Comment' threads on specific text blocks."
      - "Updates to 'Status' properties on AI-generated content pages (e.g., 'Under Review', 'Flagged', 'Approved')."
      - "Creation of 'Ethical Audit Report' pages linked to the audited content."
