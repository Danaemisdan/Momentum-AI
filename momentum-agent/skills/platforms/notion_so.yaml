  - name: "audit_data_access_permissions"
    trigger_roles:
      - "Data Governance & Ethical AI Steward"
    strategy:
      - "Scan all Notion pages and databases for access permissions."
      - "Cross-reference permissions against predefined data classification policies."
      - "Flag and report any discrepancies or unauthorized access configurations."
    reference_patterns:
      - "Regular access to Notion's 'Share' settings on various pages."
      - "Comparison of current permissions with a 'Data Classification Policy' database."
      - "Creation of 'Audit Report' pages detailing findings."
    decision_logic:
      - "IF a page containing 'Confidential' data is shared publicly THEN flag as critical violation."
      - "IF a user has 'Edit' access to a 'Restricted' database without explicit approval THEN flag as high priority."
      - "IF a new user is added to the workspace THEN trigger a review of their default access rights."
    actions:
      - "Navigate to 'Settings & Members' -> 'Members'."
      - "Iterate through all members, reviewing their workspace access levels."
      - "For each database tagged 'Sensitive' or 'Confidential', open 'Share' settings."
      - "Compare current sharing settings with entries in 'Data Access Policy' database."
      - "Create a new page in 'Governance Reports' database titled 'Access Audit Report - [Date]'."
      - "Document all identified discrepancies with page/database link, current permission, and required permission."
    verification:
      - "Confirm 'Access Audit Report' page is created and populated."
      - "Verify at least one discrepancy (if any exist) is correctly documented."
      - "Check that the report includes timestamps and relevant links."
    recovery:
      - "IF Notion API rate limits are hit during scan THEN pause for 60 seconds and resume."
      - "IF a specific page's share settings cannot be accessed THEN log the page ID and skip, noting the failure."

  - name: "simulate_adversarial_data_injection"
    trigger_roles:
      - "Systemic Robustness & Adversarial Resilience Engineer"
    strategy:
      - "Identify critical data inputs to AI models within Notion databases."
      - "Generate synthetic adversarial data points designed to disrupt model integrity."
      - "Inject these data points into a sandboxed Notion database and observe system response."
    reference_patterns:
      - "Frequent interaction with 'AI Model Input' databases."
      - "Creation of 'Sandbox Environment' pages for testing."
      - "Documentation of 'Attack Vectors' and 'System Responses'."
    decision_logic:
      - "IF a new AI model is deployed THEN create a corresponding adversarial test plan."
      - "IF a simulation reveals model degradation >10% THEN trigger immediate alert and root cause analysis."
      - "IF a known adversarial pattern is detected in production data THEN initiate a targeted simulation."
    actions:
      - "Navigate to 'AI Model Data Inputs' workspace."
      - "Duplicate a critical database (e.g., 'Customer Sentiment Data') to create 'Adversarial Test Sandbox - [Model Name]'."
      - "Generate 100 synthetic data entries with subtle, misleading patterns (e.g., highly positive reviews for a failing product)."
      - "Import these synthetic entries into the 'Adversarial Test Sandbox' database."
      - "Trigger a simulated AI model run using the sandboxed data (via Notion API call to external model)."
      - "Record the model's output and any system alerts in a new 'Adversarial Simulation Log' page."
    verification:
      - "Confirm 'Adversarial Test Sandbox' database is created and populated with synthetic data."
      - "Verify the simulated AI model run was initiated."
      - "Check 'Adversarial Simulation Log' for recorded outputs and alerts."
    recovery:
      - "IF database duplication fails THEN attempt to create a new database with a subset of schema."
      - "IF synthetic data generation fails THEN use a predefined set of generic adversarial examples."

