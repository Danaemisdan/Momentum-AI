  - name: "normalize_cross_platform_data_schema"
  trigger_roles:
    - "Trans-Dimensional Data Ingestion & Semantic Normalizer"
  strategy:
    - "Identify disparate data structures from ingested external sources (e.g., Google Sheets, Airtable, CSVs imported as Notion databases)."
    - "Map identified external data fields to a unified, pre-defined Notion database schema (e.g., 'Master Data Lake' database)."
    - "Execute bulk property updates and relation linking within Notion to align all imported data with the normalized schema."
  reference_patterns:
    - "Presence of multiple unlinked or inconsistently structured databases after external data import."
    - "Discrepancies in property types (e.g., 'Text' vs. 'Number' for the same data point across different sources)."
    - "Missing or incorrectly configured relations between newly imported data and existing core Notion databases."
  decision_logic:
    - "IF 'External Data Source' tag is present on a new database AND 'Normalized' property is false THEN initiate schema mapping."
    - "IF a property's data type in an imported database does not match the target 'Master Data Lake' schema THEN propose property type conversion."
    - "IF a record in an imported database has a field intended for a relation but no relation exists THEN identify potential linked records in other Notion databases."
  actions:
    - "Click '...' next to database title -> 'Merge with CSV' or 'Import'."
    - "Open database properties -> 'Add a property' or 'Edit property type'."
    - "Select multiple database entries -> 'Edit property' -> 'Update all selected'."
    - "Create new relations between databases."
  verification:
    - "Check 'Normalized' property on all records in the target database is true."
    - "Verify all properties in the target database conform to the master schema."
    - "Confirm successful relation linking for a statistically significant sample of records."
  recovery:
    - "If property type conversion fails, revert to previous property type and log error for manual review."
    - "If relation linking fails for a batch, attempt linking record by record with fuzzy matching."
    - "If schema mapping is incomplete, re-run the mapping process for unmapped fields and flag discrepancies."
  - name: "optimize_data_pipeline_for_feature_extraction"
  trigger_roles:
    - "Algorithmic Data Pipeline & Feature Store Virtuoso"
  strategy:
    - "Analyze existing Notion database structures and linked properties to identify potential features for downstream AI models."
    - "Design and implement new Notion formulas, rollups, and relations to pre-process and aggregate raw data into model-ready features."
    - "Automate the population and maintenance of a 'Feature Store' Notion database by linking and transforming data from source databases."
  reference_patterns:
    - "Frequent manual data aggregation or calculation by users within Notion."
    - "Existence of raw data points that could be combined or transformed into more informative features (e.g., 'creation_date' and 'completion_date' to 'cycle_time')."
    - "Requests for specific data points that are not directly available but can be derived from existing Notion properties."
  decision_logic:
    - "IF a 'Feature Request' database entry is marked 'Pending' AND source data exists THEN propose new formula/rollup creation."
    - "IF a database property is frequently used in filters/sorts AND is a raw value THEN evaluate for feature engineering opportunity."
    - "IF a 'Feature Store' database entry is outdated based on source data timestamps THEN trigger update process."
  actions:
    - "Open database properties -> 'Add a property' -> Select 'Formula' or 'Rollup'."
    - "Configure formula logic using Notion's expression language."
    - "Configure rollup properties to aggregate data from related databases."
    - "Create new relations between source databases and the 'Feature Store' database."
  verification:
    - "Execute test queries on the 'Feature Store' database to confirm feature accuracy and completeness."
    - "Verify that new formulas/rollups are correctly calculating and displaying derived values."
    - "Monitor 'Feature Store' update timestamps to ensure data freshness."
  recovery:
    - "If a formula produces an error, review formula syntax and test with sample data."
    - "If a rollup fails to aggregate correctly, check relation configuration and source property types."
    - "If 'Feature Store' update fails, re-run the update process and check for data integrity issues in source databases."
  - name: "establish_ethical_data_access_controls"
  trigger_roles:
    - "Ethical AI Interaction & Trust Architect"
  strategy:
    - "Review all Notion pages and databases for sensitive information categories (e.g., PII, confidential project data)."
    - "Configure granular sharing permissions, guest access, and workspace member roles to enforce data access policies based on ethical guidelines."
    - "Implement and monitor audit trails for access to sensitive data, ensuring compliance with privacy regulations and internal trust frameworks."
  reference_patterns:
    - "Presence of databases or pages tagged as 'Sensitive' or 'Confidential'."
    - "Broad sharing permissions (e.g., 'Public access' or 'Full access' for all members) on pages containing sensitive data."
    - "Audit logs showing unauthorized access attempts or unusual access patterns to restricted content."
  decision_logic:
    - "IF a database contains properties tagged 'PII' OR 'Confidential' AND sharing is 'Public' THEN restrict access to specific groups/individuals."
    - "IF a user attempts to access a page without sufficient permissions THEN log the attempt and notify administrator."
    - "IF a new workspace member is added THEN assign default role with least privilege access and prompt for specific access requests."
  actions:
    - "Click 'Share' button on a page/database -> 'Invite people' or 'Share to web' -> Adjust access levels (e.g., 'Can view', 'Can edit', 'Full access')."
    - "Go to 'Settings & members' -> 'Members' -> 'Edit' member roles."
    - "Create 'Groups' for easier permission management."
    - "Set 'Page lock' or 'Database lock' for critical pages."
  verification:
