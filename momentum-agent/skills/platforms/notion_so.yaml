    strategy:
      - "Identify existing Notion databases relevant to a specific domain (e.g., project tasks, research notes)."
      - "Design and implement a new Notion database schema to represent a symbolic knowledge graph, including entities, relationships, and properties."
      - "Develop a workflow to ingest and link external symbolic knowledge (e.g., ontologies, logical rules) into the Notion knowledge graph, ensuring semantic consistency."
    reference_patterns:
      - "Frequent creation of new database pages with structured properties."
      - "Extensive use of Notion's 'Relation' property to link pages across databases."
      - "Regular updates to database schemas and property types."
      - "Integration of external data sources via Notion API (simulated by extensive copy/paste or linked embeds)."
    decision_logic:
      - "IF a new domain-specific project is initiated AND no existing symbolic representation exists THEN create a new knowledge graph database."
      - "IF an external knowledge source is identified AND it aligns with a current project THEN design a mapping strategy for ingestion."
      - "IF a semantic inconsistency is detected between linked Notion pages THEN initiate a schema review and data reconciliation process."
    actions:
      - "Click 'New page' in sidebar."
      - "Select 'Database' template."
      - "Define new properties (Text, Select, Multi-select, Relation, Formula)."
      - "Create new 'Relation' properties linking to other Notion databases."
      - "Use Notion's 'Template' feature within databases to pre-define symbolic entity structures."
      - "Embed external content (e.g., Mermaid diagrams, code snippets representing logic)."
    verification:
      - "Query a linked database to confirm correct propagation of symbolic relationships."
      - "Review a sample of newly ingested data for accurate property assignment and relational links."
      - "Check for broken links or unfulfilled relations within the knowledge graph."
    recovery:
      - "IF data ingestion fails THEN revert to previous database state and re-evaluate mapping."
      - "IF a relation is incorrectly established THEN delete and recreate the relation property."
      - "IF a schema change causes data loss THEN restore from Notion's page history."
