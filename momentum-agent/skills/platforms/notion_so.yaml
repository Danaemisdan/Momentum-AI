  - name: "enforce_data_residency_policy_via_database_property_constraints"
    trigger_roles:
      - "Regulatory Compliance & Policy Enforcement Sentinel"
    strategy:
      - Identify databases containing sensitive user data requiring specific regional residency.
      - Access database properties and apply location-based tagging or access restrictions.
      - Monitor for new database creations or property modifications that violate established policies.
    reference_patterns:
      - User attempts to create a database in a non-compliant region for specific data types.
      - Existing database properties are modified to bypass residency rules.
      - Audit logs show data movement across geopolitical boundaries without proper authorization.
    decision_logic:
      - IF database_property_tag "data_residency" is not set AND data_sensitivity_level is "high" THEN prompt for residency selection.
      - IF user_location is "EU" AND database_location is "US" AND data_type is "PII" THEN block database creation/data entry.
      - IF existing_database_property "data_residency" is changed from "EU" to "US" for "PII" data THEN flag for review and revert.
    actions:
      - Navigate to "Settings & Members" -> "Workspaces" -> "Data Policies".
      - Select "Database Property Constraints" -> "Add New Constraint".
      - Specify "Property Type: Select", "Property Name: Data Residency", "Allowed Values: [EU, US, APAC]".
      - Apply to "Databases with Tag: PII".
      - Set "Default Value: EU".
    verification:
      - Attempt to create a new database with PII tag and observe "Data Residency" property auto-populated or restricted.
      - Verify that users from non-compliant regions cannot add PII to a database with a specific residency constraint.
      - Check audit logs for successful policy enforcement events.
    recovery:
      - IF policy application fails, re-attempt constraint creation with adjusted parameters.
      - IF a user bypasses a policy, trigger an alert to the "Global Human-AI Symbiosis Strategist" for review and manual intervention.
  
