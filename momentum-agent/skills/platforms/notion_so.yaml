      - "IF a Notion page is tagged 'AI-Generated' AND its status is 'Pending Review' THEN initiate ethical audit."
      - "IF content violates ethical guidelines (e.g., biased language detected) THEN add a comment explaining the violation AND change status to 'Flagged'."
