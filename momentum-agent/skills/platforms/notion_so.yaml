  - name: "detect_emergent_project_bottlenecks_via_task_dependency_graph"
    trigger_roles:
      - "Predictive Anomaly & Emergent Threat Forecaster"
    strategy:
      - Monitor task databases for dependencies, due dates, and completion rates.
      - Construct a dynamic dependency graph to identify critical paths and potential bottlenecks.
      - Predict future delays based on current task progress and resource allocation.
    reference_patterns:
      - Multiple tasks linked to a single, consistently delayed predecessor.
      - High number of overdue tasks within a specific project phase.
      - Resource allocation imbalances across critical project components.
    decision_logic:
      - IF "task_completion_rate" for "critical_path_tasks" < 0.8 AND "average_delay_days" > 3 THEN flag as emergent bottleneck.
      - IF "number_of_dependent_tasks" > 10 for a single "overdue_task" THEN predict cascading delay.
      - IF "resource_utilization_for_project_A" > 0.9 AND "resource_utilization_for_project_B" < 0.3 THEN suggest resource reallocation.
    actions:
      - Access "Project Tasks" database.
      - Create a "Graph View" using "Relation" properties for "Depends On".
      - Highlight tasks with "Status: Overdue" and their direct dependents.
      - Generate an "Alert" page in Notion detailing predicted bottlenecks, affected projects, and suggested interventions.
    verification:
      - Verify that the dependency graph accurately reflects task relationships.
      - Confirm that predicted bottlenecks align with actual project delays.
      - Check if the alert page provides actionable insights.
    recovery:
      - IF graph rendering is incorrect, review and correct "Relation" properties.
      - IF predictions are consistently inaccurate, adjust the weighting of input metrics.
  
  - name: "orchestrate_realtime_data_ingestion_for_live_event_dashboard"
    trigger_roles:
