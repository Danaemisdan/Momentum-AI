  - name: "proactive_system_health_anomaly_detection"
    trigger_roles:
      - "Intelligent Observability & Anomaly Detection Nexus"
    strategy:
      - "Continuously ingest Notion's operational metrics (e.g., API response times, database load, user login failures)."
      - "Apply machine learning models to detect deviations from baseline behavior, indicating potential issues."
      - "Automatically generate detailed incident reports and trigger appropriate alerts."
    reference_patterns:
      - "Notion's internal logging and metrics streams (Prometheus, Grafana)."
      - "Historical performance baselines for Notion services."
      - "Incident management platform (PagerDuty, Opsgenie)."
    decision_logic:
      - "IF api_latency_p99 > historical_average * 2 for 5 minutes THEN trigger_high_severity_alert = 'true'"
      - "IF database_connection_errors_rate > 0.05 AND user_login_failures_rate > 0.1 THEN correlate_and_escalate_to_critical = 'true'"
      - "IF page_load_time_increase > 10% AND no_recent_deployments THEN investigate_resource_contention = 'true'"
    actions:
      - "Ingest: 'Notion API Gateway Logs'."
      - "Detect: 'Anomaly: API Latency P99 for /v1/pages increased by 250% over 10 minutes'."
      - "Generate: 'Incident Report: High Severity API Latency Anomaly'."
      - "Populate: 'Report fields: Service Affected: Notion Pages API, Anomaly Type: Latency Spike, Detected At: [Timestamp], Severity: High'."
      - "Click: 'Trigger PagerDuty Alert' button."
      - "Send: 'Slack Notification to #notion-ops: @here High Severity Alert: API Latency Anomaly on Pages API. Incident Link: [Link to PagerDuty]'"
    verification:
      - "Verify: PagerDuty incident is created with correct severity and details."
      - "Verify: Slack notification is sent to the designated channel."
      - "Verify: Incident report is accessible in the observability dashboard."
    recovery:
      - "IF PagerDuty integration fails: Fallback to direct email notification to on-call."
      - "IF Slack notification fails: Log error and re-attempt after 30 seconds."
      - "IF anomaly detection model produces false positive: Adjust model thresholds and retrain."
