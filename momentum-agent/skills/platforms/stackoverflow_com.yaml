      - "code structures highly similar to known proprietary libraries"
      - "user reports of license infringement"
    decision_logic:
      - "IF code snippet contains 'GPL' license header AND is not explicitly attributed THEN flag for review."
      - "IF code snippet matches >90% similarity to a known proprietary codebase THEN automatically redact and notify user."
      - "IF user explicitly states 'proprietary code - do not copy' THEN ensure snippet is not indexed for public reuse."
    actions:
      - "Access 'Code Snippet Analysis Engine'."
      - "Initiate 'License Pattern Matching Scan' on new posts."
      - "Trigger 'Automated Moderation Action' (e.g., comment redaction, user warning)."
