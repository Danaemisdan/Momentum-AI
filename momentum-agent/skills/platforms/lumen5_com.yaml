      - "check_for_improvement_in_accessibility_scores_post-remediation"
    recovery:
      - "IF scanner_fails_to_process_template THEN log_error_and_queue_for_manual_review"
      - "IF report_generation_fails THEN retry_report_generation_and_notify_design_team"

