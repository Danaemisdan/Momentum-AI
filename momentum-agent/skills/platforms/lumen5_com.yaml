    reference_patterns:
      - "Real-time ingestion of social media trend data (e.g., TikTok trends, YouTube trending topics)."
      - "Rapid creation of new Lumen5 video templates."
      - "Targeted promotion of templates within the Lumen5 platform (e.g., 'Trending' section, personalized recommendations)."
