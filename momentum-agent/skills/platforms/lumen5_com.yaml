      - click: "QuarantineAccount"
      - click: "BlockIPAddress_Z"
      - send_alert: "SecurityOperationsTeam@lumen5.com"
    verification:
      - assert: "UnauthorizedAccessAttempt_blocked_successfully"
      - assert: "SuspiciousAccount_quarantined"
      - assert: "SecurityAlert_sent_and_acknowledged"
    recovery:
