      - if (user_A_has_not_created_a_video_in_B_weeks AND user_A_subscription_renewal_is_within_C_days) then (trigger_re-engagement_campaign_for_user_A)
      - if (user_P_submits_Q_negative_support_tickets_in_R_days) then (escalate_user_P_to_dedicated_account_manager)
