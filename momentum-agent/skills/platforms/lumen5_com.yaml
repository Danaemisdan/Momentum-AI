  - name: "cross_platform_video_distribution_optimization"
    trigger_roles:
      - "Omni-Dimensional Deployment & Orchestration Architect"
    strategy:
      - "Analyze target audience demographics and platform-specific engagement metrics for various social media and content distribution channels (e.g., YouTube, TikTok, Instagram, LinkedIn)."
      - "Automatically optimize Lumen5-generated videos for deployment across these diverse platforms, adjusting aspect ratios, resolutions, captioning styles, and call-to-actions."
      - "Orchestrate the simultaneous, scheduled deployment of tailored video versions to maximize reach and engagement on each chosen platform."
    reference_patterns:
      - "identification of optimal video length for TikTok vs. YouTube"
      - "analysis of engagement rates for square vs. vertical videos on Instagram"
      - "detection of platform-specific content guidelines (e.g., music licensing, ad policies)"
    decision_logic:
