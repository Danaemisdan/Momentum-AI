      - if (IP_address_Z_attempts_more_than_N_failed_logins_in_M_minutes) then (block_IP_address_Z_and_alert_security)
      - if (data_transfer_volume_from_account_A_exceeds_threshold_B_in_time_C) then (flag_for_review_and_temporarily_suspend_transfers)
