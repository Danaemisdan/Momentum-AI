    reference_patterns:
      - Spikes in cloud provider billing for compute/storage.
      - Latency increases in specific video rendering steps.
      - Underutilization reports from Kubernetes/serverless logs.
    decision_logic:
      - if (cost_per_video_exceeds_threshold) then (initiate_pipeline_reconfiguration_analysis)
      - if (resource_utilization_below_target_for_stage_X_for_Y_minutes) then (scale_down_stage_X_resources)
      - if (queue_length_for_stage_Z_exceeds_threshold_for_W_minutes) then (scale_up_stage_Z_resources_with_cost_constraint)
    actions:
      - click: "Admin/Settings/PipelineOptimization"
      - input: "CostEfficiencyMode=Aggressive"
      - click: "ApplyDynamicResourceAllocation"
      - click: "MonitorPipelineMetricsDashboard"
    verification:
      - assert: "CostPerVideoMetric < previous_cost_per_video_metric"
      - assert: "ResourceUtilizationMetrics_within_optimal_range"
      - assert: "VideoGenerationThroughput_remains_stable_or_improves"
    recovery:
