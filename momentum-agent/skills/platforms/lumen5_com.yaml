  - name: "regulatory_compliance_audit_video_asset"
    trigger_roles:
      - "Regulatory Compliance & Policy Enforcement Sentinel"
    strategy:
      - Identify newly created or modified video projects on lumen5.com.
      - Cross-reference video content (text, audio, visuals) against a dynamic database of regulatory guidelines and platform policies.
      - Flag any potential violations for review and remediation.
    reference_patterns:
      - High volume of new video creations.
      - Specific keywords or visual elements identified in video content.
      - User reports of inappropriate content.
    decision_logic:
      - IF video_content_contains(restricted_keywords) THEN flag_for_human_review(severity: high, reason: "Potential policy violation").
      - IF video_content_displays(prohibited_imagery) THEN initiate_automated_takedown_process(reason: "Prohibited imagery detected").
      - IF video_metadata_indicates(target_audience_under_13) AND video_content_contains(commercial_ads) THEN flag_for_COPPA_review(severity: critical, reason: "Potential COPPA violation").
      - IF video_content_matches(known_copyrighted_material_fingerprint) THEN issue_copyright_strike(owner: identified_copyright_holder).
    actions:
      - Access video project database via API.
      - Initiate content analysis module (NLP, image recognition, audio analysis).
      - Update video project status to "Under Review" or "Violation Detected".
      - Generate compliance report for specific video.
    verification:
      - Confirm compliance report is generated and accessible.
      - Verify video status update in the platform's backend.
      - Check if notification was sent to relevant internal teams.
    recovery:
      - IF API call fails, retry up to 3 times with exponential backoff.
      - IF content analysis module times out, log error and queue for manual review.

