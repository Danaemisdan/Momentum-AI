  - name: "identify_systemic_vulnerability_chains"
  trigger_roles:
    - "Systemic Risk & Vulnerability Nexus Analyst"
  strategy:
    - "Perform continuous, multi-layered analysis of Lumen5's entire system architecture, including interdependencies between microservices, data flows, and third-party integrations."
    - "Identify potential 'nexus points' where a single vulnerability could cascade into systemic platform failure or widespread data compromise."
    - "Generate predictive risk models and propose architectural changes or mitigation strategies to break down critical vulnerability chains."
  reference_patterns:
    - "Changes in microservice API contracts."
    - "Introduction of new third-party libraries or services."
    - "Reports of vulnerabilities in common open-source components."
    - "Historical incident reports showing cascading failures."
  decision_logic:
    - "IF dependency_graph_analysis_reveals_single_point_of_failure_for_critical_service THEN action IS 'recommend_redundancy_implementation_or_circuit_breaker_pattern'."
    - "IF vulnerability_scan_identifies_CVE_in_shared_library_used_by_multiple_critical_services THEN action IS 'prioritize_patch_deployment_across_all_affected_services_and_simulate_impact'."
    - "IF predictive_risk_model_exceeds_threshold_for_data_breach_scenario THEN action IS 'propose_data_segmentation_or_enhanced_encryption_for_at_risk_data_stores'."
  actions:
    - "API_CALL: architecture_mapping_tool.generate_dependency_graph(service_inventory)"
    - "API_CALL: vulnerability_scanner.scan_codebase_and_dependencies(repository_id)"
    - "API_CALL: risk_modeling_engine.simulate_failure_cascades(dependency_graph, vulnerability_data)"
    - "API_CALL: architectural_recommendation_system.generate_mitigation_plan(risk_report)"
  verification:
    - "Review generated mitigation plans for feasibility and effectiveness."
    - "Confirm that proposed architectural changes address identified nexus points."
  recovery:
    - "IF dependency graph generation fails, alert human architect for manual mapping."
    - "IF risk simulation fails, re-evaluate input parameters and re-run, or escalate to expert review."
  
