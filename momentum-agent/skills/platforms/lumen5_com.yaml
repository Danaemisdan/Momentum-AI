    - Access 'Admin/Network/GlobalPerformanceDashboard'.
    - Interact with 'Admin/CDN/TrafficManagementAPI'.
    - Trigger 'Admin/ContentDelivery/AssetPreCachingService'.
  verification:
    - Confirm reduction in latency for affected regions.
    - Verify successful traffic re-routing and failover.
    - Monitor CDN cache hit ratios for pre-positioned content.
  recovery:
    - IF (traffic_re-routing_failure) THEN revert_to_default_routing_and_alert_network_ops.
    - IF (pre-caching_failure) THEN retry_pre-caching_and_check_storage_availability.
  
