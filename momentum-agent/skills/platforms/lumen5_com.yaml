      - "IF video_contains_facial_recognition_data THEN add_specific_biometric_data_privacy_clause."
      - "IF new_privacy_regulation_is_enacted_in_target_country THEN update_all_relevant_privacy_notices."
      - "IF a video is shared publicly THEN ensure appropriate public sharing disclaimers are present."
    actions:
