    - IF (CDN_node_failure_detected AND high_user_impact) THEN activate_failover_to_nearest_healthy_node.
    - IF (forecasted_high_demand_in_region_Y AND content_not_cached) THEN pre-cache_popular_assets_in_region_Y.
