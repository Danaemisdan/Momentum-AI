  - name: "discover_causal_factors_for_user_churn"
  trigger_roles:
    - "Probabilistic Inference & Causal Discovery Architect"
  strategy:
    - Analyze extensive user behavior data (feature usage, project completion, support interactions, subscription history) to identify probabilistic and causal relationships leading to user churn.
    - Construct a dynamic causal graph that maps user actions and platform events to churn probability.
    - Generate actionable insights and intervention strategies to mitigate churn by targeting identified causal factors.
  reference_patterns:
    - Sudden decrease in project creation frequency.
    - Increased number of failed video exports.
    - Lack of engagement with new features after initial signup.
    - Frequent visits to "Cancel Subscription" page.
