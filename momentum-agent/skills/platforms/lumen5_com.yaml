      - "IF target_platform_is_YouTube THEN ensure_16:9_aspect_ratio_and_generate_SEO-optimized_description"
      - "IF platform_specific_content_violation_risk_detected THEN flag_video_for_manual_review_before_deployment"
    actions:
      - "access_platform_analytics_APIs"
