    strategy:
      - "Determine if the user wants to start a new session or access an existing one."
      - "Identify the appropriate call-to-action for sign-up or login."
    reference_patterns:
      - "The user selects 'Sign up for free' or 'Try for free' to begin using the platform."
      - "The user chooses 'Log in' to access an existing account."
    decision_logic:
      - "IF user wants to start fresh THEN click 'Sign up for free' or 'Try for free'."
      - "IF user has an account THEN click 'Log in'."
    actions:
      - "Click 'Sign up for free'"
      - "Click 'Try for free'"
      - "Click 'Log in'"
    verification:
      - "Verify that the registration or login page is displayed."
    recovery:
      - "If the page is not displayed, try clicking the button again."
