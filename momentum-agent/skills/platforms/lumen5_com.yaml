    strategy:
      - "Continuously monitor and analyze all AI-generated video content produced by Lumen5 for potential biases (e.g., racial, gender, cultural stereotypes) in visual elements, voiceovers, and textual overlays."
      - "Cross-reference video narratives and factual claims against trusted knowledge bases and fact-checking services to detect misinformation or harmful content."
      - "Flag problematic content for human review, provide actionable feedback to the generative AI models, and implement safeguards to prevent future occurrences, ensuring Lumen5's output is ethical and trustworthy."
    reference_patterns:
      - "Automated scanning of all AI-generated video projects within Lumen5."
      - "Integration with external bias detection and fact-checking APIs."
      - "Analysis of sentiment, tone, and demographic representation in video content."
      - "Logging of flagged content and subsequent human moderation decisions."
    decision_logic:
      - "IF facial_recognition_detects_underrepresentation_of_minority_groups_in_generated_stock_footage THEN adjust_generation_parameters."
      - "IF sentiment_analysis_of_voiceover_is_disproportionately_negative_for_certain_topics THEN flag_for_bias_review."
      - "IF factual_claim_in_video_text_contradicts_trusted_source THEN flag_as_misinformation."
      - "IF a specific AI model consistently produces biased content THEN initiate_model_retraining_protocol."
    actions:
      - "Access Lumen5's AI-generated video library."
      - "Utilize internal bias detection algorithms (e.g., fairness metrics for image recognition)."
      - "Integrate with external fact-checking APIs (e.g., Google Fact Check Tools, independent fact-checkers)."
      - "Route flagged content to a human moderation queue within Lumen5."
      - "Provide feedback loops to the generative AI models for continuous improvement."
    verification:
      - "Confirm flagged content is correctly identified and routed for review."
      - "Verify that human moderators act on flagged content appropriately."
      - "Monitor bias metrics and misinformation rates for improvement over time."
    recovery:
      - "If bias detection algorithm fails, queue all new AI-generated content for manual review."
      - "If fact-checking API returns an error, temporarily disable automated fact-checking and alert human."
      - "If moderation queue overflows, temporarily restrict new AI video generation until backlog is cleared."

  - name: "engineer_viral_video_template_propagation"
    trigger_roles:
