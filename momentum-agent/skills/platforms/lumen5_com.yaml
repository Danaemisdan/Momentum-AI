intents:

- name: "Explore Platform Capabilities"
    strategy:
      - "Understand the user's interest in platform features or solutions."
      - "Identify navigation elements related to features, solutions, or pricing."
      - "Guide the user to explore specific aspects based on their query."
    reference_patterns:
      - "The user navigates through 'Featuresexpand_more' to discover specific tools like 'Turn Blogs to Videos' or 'AI Script Writing'."
      - "The user accesses 'Solutionsexpand_more' to understand how the platform addresses needs in 'Learning and Development' or 'Internal Comms'."
      - "The user reviews the 'Pricing' structure to understand different service tiers."
    decision_logic:
      - "IF user asks about specific features THEN navigate to 'Featuresexpand_more'."
      - "IF user asks about business solutions THEN navigate to 'Solutionsexpand_more'."
      - "IF user asks about cost or plans THEN navigate to 'Pricing'."
    actions:
      - "Click 'Featuresexpand_more'"
      - "Click 'Solutionsexpand_more'"
      - "Click 'Pricing'"
    verification:
      - "Verify that the relevant section (Features, Solutions, or Pricing) is displayed."
    recovery:
      - "If the section is not displayed, try clicking the navigation element again."
