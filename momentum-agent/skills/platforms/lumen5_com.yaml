    - IF user_segment_X_shows_significant_drop_in_project_completion_rate THEN investigate_causal_link_to_specific_feature_bug_or_UI_friction.
    - IF high_churn_rate_is_correlated_with_failed_exports_in_specific_resolution THEN identify_root_cause_in_rendering_pipeline.
    - IF users_who_don't_use_feature_Y_within_first_week_churn_at_higher_rate THEN recommend_proactive_onboarding_for_feature_Y.
