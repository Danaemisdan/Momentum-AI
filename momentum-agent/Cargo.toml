[package]
name = "momentum-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
llama-cpp-2 = "0.1.140"
dotenv = "0.15.0"
chromiumoxide = "0.9.1"
dirs = "6.0.0"
reqwest = { version = "0.13.2", features = ["json"] }
encoding_rs = "0.8.35"
base64 = "0.21"
serde_yaml = "0.9.34"
regex = "1.12.3"
rand = "0.8"
chrono = "0.4"
xcap = "0.9.4"
shared_memory = "0.12.4"
