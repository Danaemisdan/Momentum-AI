  - name: "enforce_data_retention_policy_for_inactive_servers"
  trigger_roles:
    - "Data Governance & Ethical AI Steward"
  strategy:
    - "Identify Discord servers that have been inactive for a predefined period, indicating potential abandonment."
    - "Initiate a data retention process, notifying server owners and eventually archiving or deleting data in compliance with policy."
    - "Ensure that data deletion is irreversible and auditable."
  reference_patterns:
