    - "Audit trail confirming data archiving and deletion events."
    - "Verification that deleted data is no longer accessible."
  recovery:
    - "IF a server owner responds to a notification and reactivates the server THEN halt the retention process."
    - "IF data archiving fails THEN re-attempt archiving and alert data engineering team."
  
