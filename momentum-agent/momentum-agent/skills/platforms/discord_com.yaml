  - name: "AutomateChannelPruningBasedOnActivityMetrics"
  trigger_roles:
    - "Cognitive Pipeline Optimization & Resource Alchemist"
  strategy:
    - "Monitor message activity and user engagement across all channels in a given Discord server."
    - "Identify channels that fall below predefined activity thresholds over a specified period."
    - "Generate a proposal for archiving or deleting inactive channels to optimize server resources."
  reference_patterns:
    - "Channels with zero messages posted for 30+ days."
    - "Channels with less than 5 unique active users in a week."
    - "Channels explicitly marked as 'legacy' or 'deprecated' by server staff."
  decision_logic:
    - "IF (channel_activity_score < threshold AND channel_age > threshold) THEN flag_for_pruning."
    - "IF (flagged_channel_is_critical_system_channel) THEN exclude_from_pruning."
    - "IF (pruning_proposal_approved_by_admin) THEN execute_pruning_actions."
  actions:
    - "Access target Discord server's 'Server Settings'."
    - "Navigate to 'Channels' section."
    - "For each flagged channel: Click 'Edit Channel' (gear icon)."
    - "Click 'Delete Channel' button."
    - "Confirm deletion in the pop-up prompt."
