    - "Post a public announcement in a designated 'server-updates' channel about channel pruning."
  verification:
    - "Verify the deleted channels no longer appear in the channel list."
    - "Confirm archived channels are inaccessible for posting by regular members."
    - "Check for user feedback or questions regarding the pruning actions."
  recovery:
    - "IF (deletion_failed_permission_error) THEN escalate_to_server_owner_for_permissions."
    - "IF (accidental_deletion_of_active_channel) THEN attempt_channel_recreation_with_backup_settings (if available)."
    - "IF (pruning_action_blocked_by_Discord_API) THEN retry_after_rate_limit_reset."
  
  - name: "FlagProhibitedContentForModeratorReview"
  trigger_roles:
    - "Sanctions & Export Control Compliance Enforcer"
  strategy:
    - "Continuously scan all public and private messages, voice chat transcripts, and uploaded files for keywords, phrases, and visual patterns indicative of prohibited content (e.g., hate speech, illegal goods, export-controlled items)."
    - "Cross-reference identified content against a dynamic database of sanctions lists, export control regulations, and Discord's Terms of Service."
    - "Generate a detailed report for moderator review, including context, evidence, and recommended action."
  reference_patterns:
    - "Keywords from OFAC SDN list or other sanctions databases."
    - "Discussions explicitly mentioning controlled technologies or goods without proper licensing."
    - "Visual content depicting illegal activities or symbols of hate groups."
    - "User reports of suspicious activity related to compliance."
  decision_logic:
    - "IF (content_matches_sanctions_list_entry OR content_violates_export_control_regulations) THEN flag_as_critical_violation."
    - "IF (content_matches_Discord_TOS_prohibited_categories) THEN flag_as_TOS_violation."
    - "IF (flagged_content_severity = critical) THEN notify_senior_moderator_immediately."
  actions:
    - "Identify offending message/file."
    - "Click '...' (More) icon next to the message."
    - "Select 'Report Message' option."
    - "Choose the most relevant violation category (e.g., 'Hate Speech', 'Illegal Activity')."
    - "Add specific details in the 'Additional Comments' field, referencing the compliance violation."
    - "Click 'Submit Report'."
    - "For severe violations, also send a direct message to designated server moderators/admins with a link to the message and a summary of the compliance breach."
  verification:
    - "Confirm 'Report Submitted' notification appears."
    - "Verify the reported message is no longer visible to the reporting AI (indicating moderator action)."
    - "Check for moderator acknowledgement or follow-up messages in designated compliance channels."
  recovery:
    - "IF (report_submission_failed) THEN re-attempt report after 1 minute."
    - "IF (message_deleted_before_report_submission) THEN log incident and associated user for future monitoring."
    - "IF (no_moderator_response_within_SLA) THEN escalate_report to a higher-tier moderator or Discord Trust & Safety."
  
  - name: "IsolateMaliciousBotActivity"
  trigger_roles:
    - "Cognitive Security Orchestration & Automated Response Nexus"
  strategy:
    - "Continuously monitor all server events, user behaviors, and API interactions for patterns indicative of malicious bot activity (e.g., spam, phishing attempts, unauthorized data access, rapid channel creation/deletion)."
    - "Correlate suspicious events across multiple vectors to confirm bot presence and intent."
    - "Automatically apply pre-defined security policies to mitigate identified threats, ranging from temporary isolation to permanent ban."
  reference_patterns:
    - "Rapid-fire identical messages from a new user account."
    - "Links to known phishing domains in chat."
    - "Sudden influx of new accounts joining and leaving channels."
    - "Unauthorized attempts to modify server settings or roles."
  decision_logic:
    - "IF (behavior_pattern_matches_known_bot_signature AND confidence_score > threshold) THEN initiate_automated_response."
    - "IF (bot_activity_severity = high) THEN ban_user_and_report_to_Discord."
    - "IF (bot_activity_severity = medium) THEN kick_user_and_revoke_roles."
    - "IF (bot_activity_severity = low) THEN mute_user_and_warn."
  actions:
    - "Identify the malicious user account."
    - "Right-click on the user's profile in the member list."
    - "IF (severity = high) THEN select 'Ban [username]' and provide a reason (e.g., 'Malicious Bot Activity - Spam/Phishing')."
    - "IF (severity = medium) THEN select 'Kick [username]' and provide a reason."
    - "IF (severity = low) THEN select 'Mute [username]' and set a duration."
    - "For high severity, also navigate to 'Server Settings' -> 'Bans' and confirm the ban entry."
    - "Post an automated alert in a designated 'security-incidents' channel."
  verification:
    - "Verify the user account is no longer present in the server (kick/ban)."
    - "Confirm the user's messages are no longer appearing (mute)."
    - "Check the 'security-incidents' channel for the automated alert."
  recovery:
    - "IF (action_failed_permission_error) THEN escalate_to_server_owner_for_permissions."
    - "IF (user_rejoins_after_kick) THEN upgrade_action_to_ban."
    - "IF (false_positive_identified) THEN unban/unmute user and refine bot detection heuristics."
  
