      - "Generate content for Discord blog (https://discord.com/blog)."
      - "Compose social media posts for Twitter, Facebook, etc."
      - "Monitor real-time chat on official Discord servers for sentiment."
    verification:
      - "Confirm consistent messaging across all communication channels."
      - "Verify positive shift in community sentiment metrics post-launch."
      - "Ensure high engagement rates on announcement content."
    recovery:
      - "IF communication_fails_to_resonate THEN re-evaluate_target_audience_AND_re-craft_narrative."
      - "IF misinformation_spreads THEN issue_clarification_statements_AND_engage_directly_with_community_leaders."
      - "IF platform_outage_occurs_during_launch THEN immediately_shift_narrative_to_status_updates_AND_recovery_efforts."
  - name: "predict_user_churn_and_propose_retention_campaign"
    trigger_roles:
      - "Predictive User Journey & Behavioral Modeler"
    strategy:
      - "Continuously analyze individual user activity patterns (login frequency, message count, server engagement, feature usage)."
      - "Identify users exhibiting early indicators of churn risk based on predictive models."
      - "Generate a personalized retention campaign proposal, including targeted in-app notifications or content recommendations, to re-engage at-risk users."
    reference_patterns:
      - "Declining login streaks or message activity for specific user cohorts."
      - "Reduced participation in previously active servers or voice channels."
      - "A/B test results for past retention campaigns."
    decision_logic:
      - "IF user_activity_drops_below_threshold_X_for_Y_days THEN flag_user_as_churn_risk."
      - "IF churn_risk_identified AND user_has_not_responded_to_generic_prompts THEN generate_personalized_re-engagement_message."
      - "IF re-engagement_message_sent AND user_activity_recovers THEN mark_user_as_retained."
    actions:
      - "Access user activity logs and telemetry data."
      - "Run predictive churn models on user data."
