      - Manual setup of new Discord bots leading to inconsistencies.
      - Delays in deploying bot updates due to infrastructure provisioning bottlenecks.
      - Security vulnerabilities arising from ad-hoc infrastructure configurations.
    decision_logic:
      - IF a new Discord bot deployment request is approved THEN synthesize and deploy a serverless function, database, and API gateway.
      - IF an existing bot requires scaling due to increased Discord server activity THEN automatically adjust resource allocations (e.g., increase function memory, database capacity).
      - IF a security vulnerability is detected in a bot's infrastructure THEN automatically deploy a patched version or isolate the affected component.
    actions:
      - Parse a new bot deployment request from an internal ticketing system or Git repository.
      - Generate Terraform/CloudFormation scripts for required cloud resources (e.g., AWS Lambda, DynamoDB, API Gateway).
