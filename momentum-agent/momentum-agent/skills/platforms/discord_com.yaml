    - "Mass DMs sent to server members from newly joined accounts."
  decision_logic:
    - "IF new joiners exceed a predefined threshold within a short period AND multiple new accounts post identical spam THEN activate raid mode."
    - "IF a significant number of users are reported for harassment within minutes AND their accounts are newly created THEN initiate temporary bans."
    - "IF a known malicious URL is detected in multiple messages across different channels THEN automatically delete messages and warn users."
  actions:
    - "Activate Discord's 'Raid Protection' settings for the affected server."
    - "Temporarily mute or kick newly joined accounts exhibiting suspicious behavior."
    - "Delete messages containing identified spam or malicious content."
    - "Log IP addresses and user IDs of suspected attackers for potential platform-wide bans."
  verification:
    - "Server activity returns to normal levels after mitigation."
    - "Number of new joiners drops significantly or is halted."
    - "Spam messages are removed, and reported users are actioned."
  recovery:
    - "IF automatic mitigation fails to stop the attack THEN escalate to human security team for manual intervention."
    - "IF false positive is detected (e.g., legitimate large influx) THEN review logs and adjust detection thresholds."
  
