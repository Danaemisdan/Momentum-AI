  - name: "assess_discord_feature_for_ethical_implications"
    trigger_roles:
      - "AI Ethics & Societal Impact Navigator"
    strategy:
      - Analyze proposed or existing Discord features (e.g., new moderation tools, recommendation algorithms, user interaction mechanics) for potential ethical risks.
      - Evaluate potential for bias, misuse, privacy violations, or negative societal impact.
      - Provide a detailed ethical risk assessment and propose mitigation strategies.
    reference_patterns:
      - Internal discussions about new features with potential for sensitive data handling.
      - User feedback or public discourse raising concerns about fairness or privacy.
      - Introduction of AI-driven features impacting user experience or content visibility.
    decision_logic:
      - IF a new AI-powered content recommendation system is proposed THEN assess for algorithmic bias, filter bubbles, and potential for radicalization.
      - IF a new moderation tool uses facial recognition or voice analysis THEN evaluate privacy implications and potential for misidentification.
      - IF a feature could disproportionately impact a vulnerable user group THEN flag for high ethical risk and require extensive review.
    actions:
