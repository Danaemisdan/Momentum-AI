  - name: "audit_ai_model_fairness_in_talent_matching"
    trigger_roles:
      - "Data Governance & Ethical AI Steward"
    strategy:
      - "Extract a statistically significant sample of talent matching recommendations generated by the platform's AI."
      - "Apply fairness metrics (e.g., disparate impact, equal opportunity) across protected attributes (anonymized) within the sample."
      - "Generate a compliance report highlighting any biases or unfair outcomes and recommend model adjustments."
    reference_patterns:
      - "Consistent under-representation of specific demographic groups in top search results for high-paying jobs."
      - "Disproportionate rejection rates for freelancers from certain regions despite comparable skill sets."
      - "Algorithmic amplification of existing biases present in historical data."
    decision_logic:
      - "IF (disparate_impact_ratio > acceptable_threshold) THEN flag as 'High Bias Risk'."
      - "IF (equal_opportunity_score < acceptable_threshold) THEN recommend 'Model Retraining with Bias Mitigation'."
      - "IF (feature_importance_analysis reveals undue weight on non-skill attributes) THEN initiate 'Feature Engineering Review'."
    actions:
      - "Access 'AI Matching Engine Logs' (read-only, anonymized)."
      - "Access 'Freelancer Demographic Data' (anonymized, read-only)."
      - "Run 'Fairness Audit Script' on selected data."
      - "Generate 'AI Fairness Compliance Report' for internal review."
      - "Submit 'Model Adjustment Recommendations' to 'AI Engineering Team'."
    verification:
      - "Confirm audit script execution completion."
      - "Verify report generation and accessibility."
      - "Receive confirmation of recommendation submission."
    recovery:
      - "If data extraction fails, retry with a smaller sample size."
      - "If audit script encounters errors, log details and notify 'Systemic Robustness Engineer'."
      - "If report generation fails, attempt to export raw audit results."

