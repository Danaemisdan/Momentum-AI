      - "IF an existing module exhibits high error rates THEN initiate a review of its error handling and logging."
      - "IF a security vulnerability is detected in a core component THEN immediately trigger a patch and audit."
      - "IF a new Upwork API version is released THEN plan for module compatibility updates."
    actions:
