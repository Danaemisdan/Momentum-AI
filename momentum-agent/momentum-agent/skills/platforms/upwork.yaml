    strategy:
      - Identify high-value client segments on Upwork based on project history and budget.
      - Design and launch targeted Upwork ad campaigns and direct outreach sequences.
      - Monitor campaign performance and dynamically adjust targeting and messaging for optimal conversion.
    reference_patterns:
      - High volume of "Promote Listing" clicks.
      - Frequent updates to "Client Search" filters.
      - Creation of multiple "Connects" spending reports.
    decision_logic:
      - IF client_segment_identified AND budget_allocated THEN launch_campaign.
      - IF campaign_performance_below_threshold THEN adjust_targeting_and_messaging.
      - IF new_high_value_project_posted THEN initiate_direct_outreach.
    actions:
