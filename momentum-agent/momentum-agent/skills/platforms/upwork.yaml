      - "IF access control policies fail to enforce restrictions, debug and re-deploy."
      - "IF third-party integration breaks due to privacy restrictions, work with the partner to implement compliant data access."

  - name: "orchestrate_upwork_sales_campaign"
    trigger_roles:
