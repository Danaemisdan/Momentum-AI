  - name: "identify_semantic_vulnerability_in_job_description"
    trigger_roles:
      - "Semantic Vulnerability Graph & Exploitability Modeler"
    strategy:
      - "Analyze job descriptions and project briefs for ambiguous language, conflicting requirements, or implicit assumptions."
      - "Construct a semantic graph of potential misinterpretations and their downstream impact on project scope or security."
      - "Generate a 'Vulnerability Report' highlighting exploitability risks and suggesting clarifications."
    reference_patterns:
      - "Use of vague terms like 'etc.', 'as needed', 'flexible'"
      - "Conflicting statements regarding data access or privacy requirements"
      - "Absence of explicit security protocols for sensitive tasks"
    decision_logic:
      - "IF 'vague_terms_detected' OR 'conflicting_statements_found' THEN initiate_semantic_graph_analysis"
      - "IF 'absence_of_security_protocols' THEN prioritize_exploitability_modeling"
      - "IF semantic_vulnerabilities_identified THEN generate_vulnerability_report_and_suggest_clarifications"
    actions:
      - "Click 'Analyze Job Description for Semantic Vulnerabilities' button"
      - "Select 'Generate Semantic Graph' option for identified ambiguities"
      - "Click 'Create Vulnerability Report' and populate with findings"
      - "Suggest 'Clarification Request' template to client"
    verification:
      - "Vulnerability Report generated with severity scores."
      - "Proposed clarifications are integrated into job description draft."
      - "Client acknowledges and addresses identified ambiguities."
    recovery:
      - "IF analysis_fails THEN re-run with a different semantic parsing model"
      - "IF report_generation_error THEN manually review identified vulnerabilities and re-attempt report creation"

  - name: "tailor_project_narrative_for_client_segment"
    trigger_roles:
      - "Adaptive Narrative & Contextual Storyteller"
    strategy:
      - "Analyze client's industry, past project history, and stated preferences to understand their communication style and priorities."
      - "Dynamically adjust project updates, proposals, and feedback summaries to align with the client's contextual understanding."
      - "Craft a compelling narrative that highlights value proposition and mitigates potential concerns based on client profile."
    reference_patterns:
      - "Client industry: 'Finance' or 'Healthcare' (implies need for formal, compliance-focused language)"
      - "Client's past feedback mentions 'clarity' or 'business impact'"
      - "Project status is 'at risk' or 'behind schedule'"
    decision_logic:
