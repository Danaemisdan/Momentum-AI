      - "IF (experienced_user_navigation_path_deviates_from_default_for_frequent_tasks) THEN suggest 'Personalized Shortcut Creation'."
      - "IF (eye_tracking_shows_excessive_scanning_without_focus) THEN trigger 'Highlight Key Information'."
    actions:
