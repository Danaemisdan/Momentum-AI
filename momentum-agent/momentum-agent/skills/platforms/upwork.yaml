      - "Extract and normalize key requirements, constraints, and desired outcomes from multimodal data (text, images, attached documents)."
      - "Generate a unified, coherent, and actionable project specification document, highlighting potential ambiguities or conflicts."
    reference_patterns:
      - "Multiple job postings from the same client with varying details."
      - "Job postings with attached PDFs, images of mockups, and text descriptions."
      - "Client communication history containing additional project context."
      - "Discrepancies between stated budget and project scope."
    decision_logic:
      - "IF multiple job postings from a single client exist AND they relate to a similar domain THEN initiate cross-modal synthesis."
      - "IF attached files (PDF, JPG, PNG) are present in a job posting THEN prioritize their content for core requirements."
      - "IF textual description contradicts visual/documentary evidence THEN flag for ambiguity and seek clarification."
      - "IF budget is disproportionate to synthesized scope THEN suggest scope adjustment or budget re-evaluation."
    actions:
      - "Scrape job posting text, attachments, and client profile data."
      - "Apply OCR/image analysis to visual data."
      - "Utilize NLP for text extraction and sentiment analysis."
      - "Generate a draft 'Unified Project Brief' document."
      - "Propose clarification questions to the client."
    verification:
      - "Confirm all identified data sources have been processed."
      - "Validate the generated brief against original sources for accuracy."
      - "Check for internal consistency and logical flow within the brief."
    recovery:
      - "IF OCR fails on an attachment THEN attempt alternative OCR engine or flag for manual review."
      - "IF NLP identifies low confidence in entity extraction THEN re-process with different model or prompt for human oversight."

  - name: "bootstrap_foundational_platform_modules"
