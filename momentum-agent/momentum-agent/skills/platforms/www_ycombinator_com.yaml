      - "API.assert('ycombinator.com/api/analytics/narrative_engagement', {'investor_id': 'ABC_investor', 'summary_type': 'personalized'})"
    recovery:
      - "LOG.error('Narrative adaptation failed, displaying default startup pitch.')"
      - "UI.display('default_startup_pitch', {'startup_id': 'XYZ_startup'})"

  - name: "synthesize_next_gen_feature_for_founder_dashboard"
    trigger_roles:
