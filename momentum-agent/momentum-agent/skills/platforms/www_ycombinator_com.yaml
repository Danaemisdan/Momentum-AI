      - "TOOL.run('feature_genesis_engine', {'input_data': 'basic_founder_needs', 'output_format': 'simplified_feature_idea'})"

  - name: "architect_cross_border_startup_data_treaty"
    trigger_roles:
      - "Jurisdictional Sovereignty & Inter-Agent Treaty Architect"
    strategy:
      - Analyze the legal and regulatory frameworks governing data privacy, intellectual property, and investment across multiple jurisdictions where YC operates or has portfolio companies.
      - Identify potential conflicts or compliance gaps in data sharing agreements between YC, its startups, and international investors.
      - Draft a standardized, modular "Inter-Agent Data Treaty" template that ensures legal compliance and operational fluidity for startups operating across borders, proposing specific clauses for YC's platform terms of service.
    reference_patterns:
      - "legal documents related to GDPR, CCPA, PIPL, etc."
      - "international investment agreements and trade laws"
      - "startup incorporation documents and data handling policies"
    decision_logic:
      - "IF a startup operates in both EU and US, THEN ensure GDPR and CCPA compliance clauses are paramount."
      - "IF an investor is from a jurisdiction with strict data localization laws, THEN propose specific data residency clauses."
      - "IF a new international data transfer regulation is enacted, THEN initiate a review and update of all relevant treaty templates."
    actions:
      - "API.call('ycombinator.com/api/legal/jurisdictional_data_laws', {'regions': ['EU', 'US', 'China', 'India']})"
      - "API.call('ycombinator.com/api/startup/global_presence', {'startup_id': 'all'})"
      - "TOOL.run('treaty_drafting_engine', {'legal_frameworks': 'data_laws', 'operational_scope': 'global_startups', 'output_format': 'treaty_template_v1'})"
    verification:
      - "API.assert('ycombinator.com/api/legal/treaty_status', {'template_name': 'Inter-Agent Data Treaty', 'status': 'drafted'})"
      - "UI.assert('internal_legal_review_board', {'document_title_contains': 'Cross-Border Data Treaty'})"
    recovery:
      - "LOG.error('Treaty drafting failed, attempting to simplify scope to two key jurisdictions.')"
      - "TOOL.run('treaty_drafting_engine', {'legal_frameworks': 'US_EU_laws', 'operational_scope': 'US_EU_startups', 'output_format': 'simplified_treaty_draft'})"

  - name: "generate_explainable_ai_rationale_for_startup_ranking"
    trigger_roles:
      - "Explainable AI & Interpretability Architect"
    strategy:
      - Intercept the output of YC's internal AI model responsible for ranking startup applications or investor matching.
      - Analyze the model's features, weights, and decision paths for a specific ranking decision.
      - Generate a human-readable explanation detailing the key factors and their relative importance that led to a particular startup's ranking or a specific investor-startup match, making the AI's logic transparent.
    reference_patterns:
