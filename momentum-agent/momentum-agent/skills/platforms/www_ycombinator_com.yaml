      - Identify unmet needs, pain points, and emerging opportunities for YC's founder-facing tools.
      - Generate a detailed specification for a novel, high-impact feature for the founder dashboard, including user stories, technical requirements, and potential KPIs.
    reference_patterns:
      - "founder survey responses, forum discussions, support chat transcripts"
      - "analytics data on founder dashboard feature usage (e.g., 'most clicked', 'least used')"
      - "competitor product announcements and feature releases"
    decision_logic:
      - "IF multiple founders request 'better mentorship matching', THEN prioritize features enhancing mentor discovery and scheduling."
      - "IF a competitor launches a new 'fundraising tracker', THEN propose a superior YC equivalent."
      - "IF a feature concept aligns with YC's strategic goals (e.g., 'founder success'), THEN elevate its priority."
    actions:
