  - name: "infer_causal_impact_of_YC_program_elements_on_startup_success"
    trigger_roles:
      - "Probabilistic Inference & Causal Discovery Architect"
    strategy:
      - "Construct a causal graph representing various YC program interventions (e.g., specific mentorship sessions, demo day participation, internal tool usage) and their potential effects on startup metrics (e.g., funding, growth, exit)."
      - "Apply advanced causal inference techniques (e.g., instrumental variables, difference-in-differences, Bayesian causal discovery) to identify direct and indirect causal links."
      - "Quantify the probabilistic impact of specific YC program elements on long-term startup success metrics, controlling for confounding factors."
    reference_patterns:
      - "Statistically significant causal effects identified between YC interventions and startup outcomes."
      - "Robustness of causal estimates across different model specifications and data subsets."
      - "Identification of previously unknown causal pathways or confounding variables."
    decision_logic:
      - "IF a new YC program initiative is launched THEN incorporate it as a potential intervention node in the causal graph."
      - "IF observed startup outcomes deviate significantly from predicted causal models THEN re-evaluate model assumptions and data quality."
      - "IF a strong correlation is observed without a clear causal link THEN initiate deeper causal discovery analysis."
    actions:
      - "Access YC internal databases containing detailed program participation logs, mentor interactions, and startup performance data."
      - "Utilize platform's statistical computing environment to run causal inference algorithms."
      - "Generate and visualize causal graphs and impact reports for YC partners."
    verification:
      - "Cross-validate causal findings with expert domain knowledge from YC partners."
      - "Perform sensitivity analysis to assess the stability of causal estimates under varying assumptions."
      - "Verify that identified causal relationships are actionable and provide clear insights for program optimization."
    recovery:
      - "IF causal model fails to converge or produces implausible results THEN review data preprocessing steps and model specification."
      - "IF insufficient data exists for robust causal inference on a specific intervention THEN flag for data collection or alternative analytical approaches."

  - name: "design_and_deploy_automated_revenue_attribution_pipelines"
    trigger_roles:
      - "Revenue Operations (RevOps) System Architect"
    strategy:
      - "Map the entire YC revenue generation lifecycle, from application fees and SAFE/equity conversions to follow-on investment tracking and platform service subscriptions."
      - "Architect and implement automated data pipelines to collect, transform, and integrate revenue-related data from various internal and external sources (e.g., Stripe, CapTable.io, internal CRM)."
      - "Develop and deploy a multi-touch attribution model (e.g., Shapley value, time decay) to accurately assign revenue credit to different YC touchpoints and initiatives, providing granular insights into ROI."
    reference_patterns:
      - "Real-time, accurate revenue dashboards reflecting attributed income streams."
      - "Reduced manual effort in revenue reconciliation and reporting."
      - "Clear insights into the ROI of specific YC programs or platform features."
    decision_logic:
      - "IF a new revenue stream is introduced (e.g., a new paid service for alumni) THEN integrate its data source and attribution logic into the pipeline."
      - "IF discrepancies are detected between reported revenue and attributed revenue THEN trigger an alert for data integrity review."
      - "IF a specific YC touchpoint consistently shows high attribution value THEN recommend further investment in that area."
    actions:
      - "Configure API integrations with financial platforms (e.g., Stripe, banking APIs)."
      - "Develop and deploy ETL jobs within YC's data warehousing infrastructure."
      - "Implement attribution model logic as a scheduled job, outputting results to a business intelligence dashboard."
    verification:
      - "Reconcile attributed revenue totals with actual financial statements on a monthly basis."
      - "Conduct A/B tests on different attribution models to validate accuracy and business utility."
      - "Verify that stakeholders (e.g., finance, program leads) can access and interpret attribution reports."
    recovery:
      - "IF a data pipeline fails or produces corrupted data THEN trigger automated alerts and initiate rollback to the last known good state."
      - "IF attribution model outputs become unstable or illogical THEN revert to a simpler, more robust model and investigate underlying data issues."

  - name: "monitor_and_enforce_algorithmic_fairness_in_startup_evaluation"
    trigger_roles:
      - "Quantum Algorithmic Governance Overseer"
    strategy:
      - "Define and operationalize fairness metrics (e.g., demographic parity, equalized odds) for all AI-driven startup evaluation and recommendation algorithms on the YC platform."
      - "Develop and integrate quantum-inspired or advanced classical algorithms for bias detection and mitigation within the application review, interview scheduling, and investor matching processes."
      - "Establish a continuous monitoring system to detect and alert on algorithmic drift or emergent biases that could lead to inequitable outcomes for founders from underrepresented groups."
    reference_patterns:
      - "Fairness metrics consistently within defined acceptable thresholds across all protected attributes."
      - "Reduced disparities in success rates (e.g., interview invites, funding) between different demographic groups, after controlling for merit."
      - "Audit trails demonstrating proactive bias detection and mitigation actions."
    decision_logic:
      - "IF fairness metrics for any protected group fall below threshold THEN trigger an immediate alert and halt affected algorithmic processes."
      - "IF a new version of an evaluation algorithm is deployed THEN run a comprehensive fairness audit before full rollout."
      - "IF historical data reveals systemic bias THEN recommend and oversee the implementation of re-weighting or debiasing techniques."
    actions:
      - "Access and analyze anonymized demographic data alongside algorithmic scores for all startups."
      - "Deploy fairness auditing tools and bias mitigation algorithms within the platform's ML pipeline."
      - "Generate real-time fairness dashboards and automated alerts for YC leadership and review teams."
    verification:
      - "Regularly publish internal reports on algorithmic fairness performance, including disaggregated metrics."
      - "Conduct independent third-party audits of critical algorithms for bias and transparency."
      - "Verify that mitigation strategies effectively reduce bias without negatively impacting overall performance or meritocratic principles."
    recovery:
      - "IF a bias detection system flags a false positive THEN review the sensitivity of the detection algorithm and adjust parameters."
      - "IF a mitigation strategy introduces unintended side effects THEN roll back the change and explore alternative debiasing methods."

  - name: "integrate_multi-modal_feedback_for_iterative_platform_improvement"
    trigger_roles:
      - "Continuous Feedback & Learning Loop Integrator"
    strategy:
      - "Design and implement a unified feedback ingestion system capable of capturing structured and unstructured data from diverse sources (e.g., founder surveys, mentor notes, investor comments, platform usage analytics, support tickets)."
      - "Develop and deploy natural language processing (NLP) and sentiment analysis models to extract actionable insights and identify emerging themes from qualitative feedback."
      - "Automate the routing and prioritization of feedback-derived insights to relevant product, engineering, and program teams, closing the loop with iterative platform and program adjustments."
    reference_patterns:
      - "Increased rate of feedback-driven feature deployments and program adjustments."
      - "Quantifiable improvement in user satisfaction scores (e.g., NPS) over time."
      - "Reduced time-to-insight from raw feedback data."
    decision_logic:
      - "IF a recurring negative sentiment or feature request is detected across multiple feedback channels THEN escalate to product management for review."
      - "IF a new platform feature is launched THEN automatically increase monitoring of feedback related to that feature."
      - "IF a critical bug report is identified via feedback THEN immediately route to the engineering incident response team."
    actions:
      - "Configure webhooks and APIs to pull data from survey platforms, CRM, and internal communication tools."
      - "Deploy NLP models (e.g., topic modeling, sentiment analysis) on ingested text data within the platform's data processing pipeline."
      - "Integrate with project management tools (e.g., Jira, Asana) to create tasks based on prioritized feedback."
    verification:
      - "Track the resolution rate and impact of feedback-driven initiatives."
      - "Monitor the correlation between feedback sentiment and platform engagement metrics."
      - "Verify that relevant teams are consistently receiving and acting upon feedback insights."
    recovery:
      - "IF a feedback ingestion pipeline fails THEN alert data engineering and temporarily store raw feedback for later processing."
      - "IF NLP models produce irrelevant or inaccurate insights THEN retrain models with updated data and adjust parameters."

  - name: "orchestrate_human-AI_synergies_in_startup_mentorship_matching"
    trigger_roles:
      - "Global Human-AI Symbiosis Strategist"
    strategy:
      - "Develop and refine a dynamic matching algorithm that optimally pairs YC founders with mentors, leveraging both explicit founder needs/mentor expertise and implicit behavioral signals (e.g., communication patterns, past successful pairings)."
      - "Design human-in-the-loop interfaces that allow YC partners and mentors to provide nuanced feedback on AI-generated matches, continuously improving the algorithm's understanding of 'good fit'."
      - "Implement a feedback mechanism to measure the efficacy of human-AI collaborative pairings, ensuring that AI augments human judgment rather than replaces it, leading to superior mentorship outcomes."
    reference_patterns:
      - "Increased satisfaction scores from both founders and mentors regarding their pairings."
      - "Higher success rates for startups that received AI-augmented mentorship pairings."
      - "Quantifiable improvement in the AI's matching accuracy over time, driven by human feedback."
    decision_logic:
      - "IF a founder expresses dissatisfaction with a mentor match THEN analyze the discrepancy between AI prediction and human feedback to refine matching parameters."
      - "IF a mentor consistently provides high-value feedback on AI suggestions THEN prioritize their input for model training."
      - "IF a new cohort of founders or mentors joins THEN re-run the matching algorithm with updated profiles and preferences."
    actions:
      - "Access YC internal databases for founder profiles, mentor expertise, and historical interaction data."
      - "Deploy and refine a recommendation engine (e.g., collaborative filtering, deep learning-based matching) for mentor-founder pairings."
      - "Integrate feedback forms and rating systems into the YC platform for both founders and mentors."
    verification:
      - "Conduct regular surveys and interviews with founders and mentors to assess satisfaction and perceived value of pairings."
      - "Track key performance indicators (e.g., meeting frequency, founder progress) for AI-matched vs. manually matched groups."
      - "Verify that the AI's matching recommendations align with expert human judgment in a high percentage of cases."
    recovery:
      - "IF the matching algorithm produces consistently poor recommendations THEN revert to a simpler heuristic and initiate a deep dive into model biases or data quality."
      - "IF human feedback loops are underutilized THEN redesign UI/UX to encourage more engagement and make feedback submission easier."

  - name: "synthesize_cross-platform_forensic_artifacts_for_incident_attribution"
    trigger_roles:
      - "Forensic Artifact Synthesizer & Incident Attribution Engine"
    strategy:
      - "Establish a centralized, immutable ledger for all critical platform events, user actions, and system logs across YC's diverse infrastructure (e.g., web servers, databases, cloud services, internal tools)."
      - "Develop and deploy advanced anomaly detection and correlation engines to identify suspicious patterns or deviations from baseline behavior across these disparate data sources."
      - "Automate the synthesis of forensic artifacts into comprehensive incident reports, providing clear attribution and timelines for security breaches, data integrity issues, or platform misuse."
    reference_patterns:
      - "Rapid detection and accurate attribution of security incidents or data anomalies."
      - "Reduced mean time to resolution (MTTR) for critical platform issues."
      - "Comprehensive, auditable trails for all significant platform events."
    decision_logic:
      - "IF an anomalous login attempt is detected from an unusual geographic location AND followed by unauthorized data access THEN trigger a high-priority security incident."
      - "IF a critical database record is modified outside of expected operational parameters THEN flag for data integrity review and identify the source."
      - "IF a series of seemingly unrelated events, when correlated, indicate a potential insider threat THEN escalate to security operations."
    actions:
      - "Integrate with all YC internal systems and cloud provider logs (e.g., AWS CloudTrail, GCP Audit Logs) to ingest event data."
      - "Deploy a SIEM (Security Information and Event Management) or custom correlation engine on the collected data."
      - "Generate automated incident reports and alerts, integrating with incident response platforms."
    verification:
      - "Conduct regular penetration testing and red team exercises to validate the detection capabilities of the system."
      - "Perform post-incident reviews to assess the accuracy and completeness of attribution reports."
      - "Verify compliance with data retention and immutability policies for forensic logs."
    recovery:
      - "IF a log ingestion pipeline fails THEN alert infrastructure team and ensure temporary local storage of logs to prevent data loss."
      - "IF the anomaly detection engine generates too many false positives THEN adjust sensitivity thresholds and refine baseline models."

  - name: "design_evolutionary_system_blueprints_for_platform_scalability"
    trigger_roles:
      - "Meta-Architect of System Engineering & Evolutionary Blueprint Designer"
    strategy:
      - "Analyze current YC platform architecture, identifying bottlenecks, single points of failure, and areas of technical debt that hinder future growth and feature development."
      - "Develop and simulate evolutionary architectural blueprints (e.g., microservices migration, serverless adoption, event-driven architectures) that anticipate future demands from increasing startup cohorts and expanded service offerings."
      - "Generate phased implementation roadmaps and resource allocation strategies for these architectural shifts, ensuring minimal disruption while maximizing long-term scalability, resilience, and cost-efficiency."
    reference_patterns:
      - "Proactive identification of architectural limitations before they impact performance."
      - "Successful implementation of architectural upgrades with minimal downtime and positive impact on key metrics (e.g., latency, throughput)."
      - "Reduced operational costs and increased developer velocity post-migration."
    decision_logic:
      - "IF projected user growth exceeds current system capacity by X% within Y months THEN trigger the activation of a pre-designed scaling blueprint."
      - "IF a new critical feature requires a fundamentally different data model or processing paradigm THEN initiate the design of a new architectural component."
      - "IF a major cloud provider announces a new service that offers significant cost or performance benefits THEN evaluate its integration into future blueprints."
    actions:
      - "Utilize architectural modeling tools (e.g., C4 model, ArchiMate) to document current and proposed architectures."
      - "Perform load testing and performance simulations on existing and hypothetical system designs."
      - "Generate detailed technical specifications and migration plans for engineering teams."
    verification:
      - "Monitor system performance metrics (e.g., response times, error rates) before and after architectural changes."
      - "Conduct post-mortem reviews of major migrations to capture lessons learned and validate design choices."
      - "Verify that new architectural components meet non-functional requirements (e.g., security, reliability, maintainability)."
    recovery:
      - "IF a proposed architectural change introduces unforeseen complexities or risks during simulation THEN revert to a more conservative blueprint or explore alternative designs."
      - "IF a migration plan encounters significant blockers during execution THEN activate a pre-defined rollback strategy and reassess the approach."

  - name: "proactively_identify_systemic_risks_in_startup_portfolio_interdependencies"
    trigger_roles:
      - "Systemic Risk & Vulnerability Nexus Analyst"
    strategy:
      - "Construct a dynamic graph model of the entire YC startup portfolio, mapping interdependencies such as shared customers, supply chain relationships, technology stacks, investor networks, and market segment overlaps."
      - "Apply network science and complex systems analysis techniques to identify critical nodes, cascading failure pathways, and emergent systemic risks (e.g., a single point of failure impacting multiple startups, contagion risk from a market downturn)."
      - "Generate predictive alerts and actionable mitigation strategies for YC partners and individual startups to preemptively address vulnerabilities that could impact the broader portfolio's stability."
    reference_patterns:
      - "Early detection of market shifts or technological vulnerabilities impacting multiple portfolio companies."
      - "Reduced incidence of cascading failures within the YC portfolio."
      - "Proactive recommendations leading to strengthened resilience across the ecosystem."
    decision_logic:
      - "IF a key technology provider (e.g., a specific cloud service) used by a significant portion of the portfolio experiences an outage THEN immediately assess the potential impact and alert affected startups."
      - "IF a major market segment (e.g., 'fintech SaaS') shows signs of contraction THEN identify all YC startups within that segment and assess their exposure."
      - "IF a critical investor or partner firm faces financial distress THEN analyze its investment footprint across the portfolio for potential ripple effects."
    actions:
      - "Access YC internal databases for startup profiles, technology stacks, investor information, and market categorizations."
      - "Utilize graph databases and network analysis libraries to model interdependencies."
      - "Generate risk reports, vulnerability maps, and mitigation recommendations for YC partners and relevant startups."
    verification:
      - "Track the effectiveness of implemented mitigation strategies in reducing identified risks."
      - "Conduct 'what-if' simulations to test the resilience of the portfolio against various systemic shocks."
      - "Verify that risk alerts are timely, accurate, and actionable for stakeholders."
    recovery:
      - "IF the interdependency graph model becomes too complex or computationally expensive THEN simplify the model by focusing on the most critical connections."
      - "IF a risk assessment produces false positives or misses critical vulnerabilities THEN refine the risk scoring algorithms and data inputs."

  - name: "architect_backend_infrastructure_for_adaptive_knowledge_acquisition_and_pedagogy"
    trigger_roles:
      - "Autonomous Knowledge Acquisition & Pedagogy Structurer"
    strategy:
      - "Design and implement a robust, scalable backend infrastructure capable of autonomously ingesting, parsing, and structuring diverse knowledge sources relevant to startup success (e.g., YC internal lectures, external industry reports, founder playbooks, mentor advice)."
      - "Develop and deploy a semantic knowledge graph and associated reasoning engine to represent relationships between concepts, best practices, and common startup challenges, enabling intelligent querying and inference."
      - "Architect an adaptive content delivery system that dynamically generates personalized learning paths and pedagogical resources for founders based on their startup's stage, industry, and identified knowledge gaps, leveraging the structured knowledge base."
    reference_patterns:
      - "Increased engagement with YC's educational content and resources."
      - "Quantifiable improvement in founder knowledge retention and application of best practices."
      - "Reduced time for founders to find relevant information and solutions to common problems."
    decision_logic:
      - "IF a new YC lecture or external industry report is published THEN automatically ingest, process, and integrate its content into the knowledge graph."
      - "IF a founder consistently struggles with a specific topic (e.g., 'go-to-market strategy') THEN the system should proactively recommend relevant learning modules and expert connections."
      - "IF the knowledge graph identifies a new emerging best practice THEN prioritize its integration and dissemination to relevant founders."
    actions:
      - "Develop data pipelines for ingesting various content formats (e.g., video transcripts, PDFs, web articles) into a centralized knowledge repository."
      - "Implement graph database technologies (e.g., Neo4j, Amazon Neptune) to store and query the semantic knowledge graph."
      - "Build an API layer for the adaptive content delivery system to serve personalized recommendations to the founder-facing platform."
    verification:
      - "Monitor founder progress through learning paths and track the application of learned concepts in their startup updates."
      - "Conduct A/B tests on different pedagogical approaches and content recommendations to optimize learning outcomes."
      - "Verify the accuracy and completeness of the knowledge graph through automated checks and expert review."
    recovery:
      - "IF a knowledge ingestion pipeline fails to parse a new content type THEN alert the engineering team and temporarily store the raw content for manual processing."
      - "IF the semantic reasoning engine produces irrelevant or incorrect recommendations THEN review the graph schema and reasoning rules for inconsistencies."
