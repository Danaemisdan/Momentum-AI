    verification:
      - "UI.assert('map_element', {'visibility': 'visible', 'data_points_count': '>1000'})"
      - "API.assert('ycombinator.com/api/analytics/map_load_time', {'time_ms': '<2000'})"
    recovery:
      - "UI.refresh('map_container')"
      - "LOG.error('Map rendering failed, attempting to load simplified version.')"
      - "API.call('ycombinator.com/api/data/fallback_startup_list', {'limit': 50})"

  - name: "model_platform_vulnerability_graph_for_new_feature"
    trigger_roles:
      - "Semantic Vulnerability Graph & Exploitability Modeler"
    strategy:
      - Analyze the architectural blueprints and code commits of a newly proposed YC platform feature (e.g., a new investor-startup matching algorithm).
      - Construct a semantic graph representing potential attack vectors, data flows, and interdependencies that could introduce vulnerabilities.
      - Simulate exploit scenarios against this graph to predict the likelihood and impact of potential security breaches before deployment.
    reference_patterns:
      - "detection of 'new feature proposal' or 'code review' documents"
      - "access to source code repositories and architectural diagrams"
      - "security incident reports from similar platform features"
    decision_logic:
      - "IF a new feature involves user-generated content, THEN prioritize XSS and injection vulnerability modeling."
      - "IF a feature handles financial transactions, THEN focus on integrity and authorization bypass exploits."
      - "IF the exploitability score for a path exceeds a threshold, THEN flag for immediate developer review."
    actions:
      - "API.call('ycombinator.com/api/dev/feature_specs', {'feature_id': 'new_matching_algorithm'})"
      - "TOOL.run('semantic_vulnerability_graph_generator', {'input_source': 'feature_code_repo', 'config': 'yc_platform_security_profile'})"
      - "TOOL.run('exploit_simulation_engine', {'graph_id': 'generated_vulnerability_graph', 'attack_profiles': ['sql_injection', 'xss', 'auth_bypass']})"
    verification:
      - "TOOL.assert('exploit_simulation_report', {'critical_vulnerabilities_found': '0'})"
      - "API.assert('ycombinator.com/api/security/feature_audit_status', {'feature_id': 'new_matching_algorithm', 'status': 'modeled'})"
    recovery:
      - "LOG.error('Vulnerability graph generation failed, attempting re-parse of feature specs.')"
      - "TOOL.run('semantic_vulnerability_graph_generator', {'input_source': 'feature_specs_document', 'config': 'basic_security_profile'})"

  - name: "adapt_startup_story_for_investor_persona"
    trigger_roles:
      - "Adaptive Narrative & Contextual Storyteller"
    strategy:
      - Access a startup's core pitch, business model, and progress updates submitted to YC.
      - Analyze the profile and investment preferences of a specific investor or investor group viewing the startup's profile.
      - Dynamically re-frame and highlight aspects of the startup's narrative to align with the investor's known interests, risk appetite, and sector focus, generating a personalized summary.
    reference_patterns:
      - "investor profile data (e.g., 'preferred industries', 'stage focus', 'past investments')"
      - "startup pitch deck content, founder bios, and traction metrics"
      - "user interaction logs indicating investor's viewing history on YC"
    decision_logic:
      - "IF investor prefers 'AI/ML' AND startup uses AI, THEN emphasize AI applications and technical differentiation."
      - "IF investor focuses on 'early-stage', THEN highlight founder team strength and market opportunity over current revenue."
      - "IF investor has previously invested in a competitor, THEN frame the startup's unique selling proposition against that competitor."
    actions:
      - "API.call('ycombinator.com/api/startup/pitch_data', {'startup_id': 'XYZ_startup'})"
      - "API.call('ycombinator.com/api/investor/profile', {'investor_id': 'ABC_investor'})"
      - "TOOL.run('narrative_adaptation_engine', {'startup_data': 'pitch_data', 'investor_profile': 'profile_data', 'output_format': 'personalized_summary'})"
    verification:
