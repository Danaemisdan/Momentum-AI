      - "IF critical system performance metrics fall below defined thresholds THEN initiate architectural review."
      - "IF a major new feature requires significant changes to core data structures THEN propose a genesis blueprint."
      - "IF multiple independent teams are encountering integration conflicts THEN design a unified core system interface."
